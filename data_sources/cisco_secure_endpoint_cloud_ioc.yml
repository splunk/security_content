name: Cisco Secure Endpoint Cloud IOC
id: b978aba7-af1c-4d6f-9258-658a32276846
version: 1
creation_date: '2026-11-27'
modification_date: '2026-11-27'
author: Nasreddine Bencherchali, Splunk
description: |-
    Cisco Secure Endpoint Cloud IOC alerts identify endpoint activity matched by cloud-hosted OpenIOC content. Enable Cloud IOC event collection in the Cisco Security Cloud TA for Splunk, configure its Secure Endpoint input with an API client and the correct regional API endpoint, and select a destination index. Preserve the original JSON so searches can inspect the IOC name, command line, file, and endpoint fields.
source: not_applicable
sourcetype: cisco:se
supported_TA:
    - name: Cisco Security Cloud
      url: https://splunkbase.splunk.com/app/7404
      version: 4.2.0
fields:
    - cloud_ioc.description
    - cloud_ioc.short_description
    - command_line.arguments
    - computer.connector_guid
    - computer.hostname
    - connector_guid
    - event_type
    - file.file_name
    - file.file_path
    - file.identity.sha256
    - id
    - severity
    - start_timestamp
    - timestamp
    - timestamp_nanoseconds
output_fields: []
references:
    - https://docs.amp.cisco.com/en/SecureEndpoint/Secure%20Endpoint%20User%20Guide.pdf
    - https://www.cisco.com/c/en/us/td/docs/security/cisco-secure-cloud-app/user-guide/cisco-security-cloud-user-guide/m_configure_cisco_products_in_cisco_security_cloud.html
