description: |-
    Data source object for Kernel Extension Activity events from Cisco Endpoint Visibility Module.
    Install and enable Cisco Secure Client Endpoint Visibility Module on the endpoint.
    Configure EVM customer policy with "splunk_url" set to the HTTPS Splunk HTTP Event Collector endpoint and "splunk_auth_header" set to Splunk <HEC token>; enable a HEC token for the destination index.
