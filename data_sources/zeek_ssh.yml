name: Zeek SSH
id: 9e228bf6-8c75-4d36-997c-e5ef1e1bf760
version: 1
creation_date: '2026-10-12'
modification_date: '2026-10-12'
author: Raven Tait, Nasreddine Bencherchali, Splunk
description: Logs SSH handshakes analyzed by Zeek, including client and server banners and connection endpoints.
mitre_components:
    - Network Traffic Content
    - Network Traffic Flow
source: ssh.log
sourcetype: zeek:ssh
supported_TA:
    - name: TA for Zeek
      url: https://splunkbase.splunk.com/app/5466
      version: 1.0.11
fields:
    - id.orig_h
    - id.orig_p
    - id.resp_h
    - id.resp_p
    - client
    - server
    - uid
output_fields:
    - id.orig_h
    - id.resp_h
    - id.resp_p
    - client
