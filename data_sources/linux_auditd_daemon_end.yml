name: Linux Auditd Daemon End
id: 15135c45-e302-4d5a-a38a-3e8279f2ebd8
version: 4
creation_date: '2024-08-08'
modification_date: '2026-10-14'
author: Teoderick Contreras, Splunk
description: Logs the execution of processes on a Linux system, including details about the auditd daemon status.
mitre_components:
    - Command Execution
    - Process Creation
    - Process Metadata
    - OS API Execution
    - Application Log Content
source: auditd
sourcetype: auditd
separator: type
separator_value: DAEMON_END
configuration: https://github.com/Neo23x0/auditd/blob/master/audit.rules
supported_TA:
    - name: Splunk Add-on for Unix and Linux
      url: https://splunkbase.splunk.com/app/833
      version: 10.3.4
fields:
    - _time
    - auid
    - date_hour
    - date_mday
    - date_minute
    - date_month
    - date_second
    - date_wday
    - date_year
    - date_zone
    - eventtype
    - host
    - index
    - linecount
    - msg
    - op
    - pid
    - punct
    - res
    - source
    - sourcetype
    - splunk_server
    - subj
    - tag
    - tag::eventtype
    - timeendpos
    - timestartpos
    - type
output_fields:
    - op
    - res
    - pid
    - uid
    - dest
example_log: |
    type=DAEMON_END msg=audit(06/05/2025 11:01:46.838:9436) : op=terminate auid=root pid=1 subj=unconfined res=success
