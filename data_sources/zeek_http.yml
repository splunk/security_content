name: Zeek HTTP
id: 257a3ae6-a3f6-44e0-9d10-bdc5b4f011a3
version: 1
creation_date: '2026-10-12'
modification_date: '2026-10-12'
author: Raven Tait, Nasreddine Bencherchali, Splunk
description: Logs HTTP requests and responses analyzed by Zeek, including methods, URI, host, status codes, and request bodies when configured.
mitre_components:
    - Network Traffic Content
    - Network Traffic Flow
    - Application Log Content
source: http.log
sourcetype: zeek:http
supported_TA:
    - name: TA for Zeek
      url: https://splunkbase.splunk.com/app/5466
      version: 1.0.11
fields:
    - id.orig_h
    - id.orig_p
    - id.resp_h
    - id.resp_p
    - method
    - uri
    - host
    - status_code
    - post_body
    - user_agent
output_fields:
    - id.orig_h
    - id.resp_h
    - id.resp_p
    - uri
    - method
    - status_code
