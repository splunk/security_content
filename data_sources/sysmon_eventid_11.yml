name: Sysmon EventID 11
id: f3db9179-f4f5-416d-bc03-39f4d4ff699e
version: 4
creation_date: '2024-05-22'
modification_date: '2026-05-13'
author: Patrick Bareiss, Splunk
description: Logs the creation of a new file, including details about the file path, hash information, and associated process metadata.
mitre_components:
    - File Creation
    - File Metadata
    - Process Metadata
    - Application Log Content
    - OS API Execution
source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
sourcetype: XmlWinEventLog
separator: EventID
separator_value: '11'
configuration: https://github.com/SwiftOnSecurity/sysmon-config
supported_TA:
    - name: Splunk Add-on for Sysmon
      url: https://splunkbase.splunk.com/app/5709
      version: 5.0.1
fields:
    - _time
    - action
    - Channel
    - Computer
    - CreationUtcTime
    - date_hour
    - date_mday
    - date_minute
    - date_month
    - date_second
    - date_wday
    - date_year
    - date_zone
    - dest
    - dvc
