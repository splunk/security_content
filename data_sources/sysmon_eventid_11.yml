field_mappings:
    - data_model: cim
      data_set: Endpoint.Filesystem
      mapping:
          Computer: Filesystem.dest
          ProcessGuid: Filesystem.process_guid
          ProcessId: Filesystem.process_id
          TargetFilename: Filesystem.file_path
          TargetFilename|endswith: Filesystem.file_name
example_log: |
