    - EventCode
    - EventData_Xml
    - EventDescription
    - EventID
    - EventRecordID
    - eventtype
    - file_create_time
    - file_name
    - file_path
    - Guid
    - host
    - id
    - Image
    - index
    - Keywords
    - Level
    - linecount
    - Name
    - object_category
