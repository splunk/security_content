example_log: |
    {"timestamp":"2026-05-07T17:25:54Z","accountId":"387769110234","region":"us-west-2","requestId":"f3b55895-e86b-4361-b049-939c415864ec","operation":"InvokeModelWithResponseStream","modelId":"arn:aws:bedrock:us-west-2:387769110234:application-inference-profile/30gg9eioz4ca","input":{"inputContentType":"application/json","inputBodyJson":{"messages":[{"role":"user","content":[{"type":"text","text":"Command: PGPASSWORD=dev_password psql -h localhost -U foo_dev -d detector_optimization -c \"SELECT org_id, status, last_scan_at FROM scans;\"\nOutput: BqDQY5OAAAA | success | 2026-05-06 00:28:27"}]}],"system":[{"type":"text","text":"You are Claude Code, Anthropic's official CLI for Claude."}],"tools":[],"metadata":{"user_id":"user_120425bc83874fef93db29aaf0b716bb_account__session_1c3dc58a-bb6b-4380-982d-6cc8b0a00b8c"},"max_tokens":16384,"anthropic_version":"bedrock-2023-05-31","anthropic_beta":["claude-code-20250219"]},"inputTokenCount":23,"cacheReadInputTokenCount":0,"cacheWriteInputTokenCount":0},"output":{"outputContentType":"application/json","outputBodyJson":[{"type":"message_stop","amazon-bedrock-invocationMetrics":{"inputTokenCount":23,"outputTokenCount":25,"invocationLatency":900,"firstByteLatency":600}}],"outputTokenCount":25},"identity":{"arn":"arn:aws:sts::387769110234:assumed-role/bedrock-inference-role/jani@foo.com"},"inferenceRegion":"us-west-2","schemaType":"ModelInvocationLog","schemaVersion":"1.0"}
