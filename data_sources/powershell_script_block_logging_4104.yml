name: Powershell Script Block Logging 4104
id: 5cfd0c72-d989-47a0-92f9-6edc6f8d3564
version: 5
creation_date: '2024-05-22'
modification_date: '2026-10-14'
author: Patrick Bareiss, Splunk
description: Logs detailed content of PowerShell script blocks as they are executed, including the full command text and context for the execution.
mitre_components:
    - Script Execution
    - Command Execution
    - Process Metadata
    - OS API Execution
    - Application Log Content
source: XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
sourcetype: XmlWinEventLog
separator: EventID
separator_value: '4104'
supported_TA:
    - name: Splunk Add-on for Microsoft Windows
      url: https://splunkbase.splunk.com/app/742
      version: 11.0.3
fields:
    - _time
    - ActivityID
    - Channel
    - Computer
    - dest
    - dvc
    - dvc_nt_host
    - event_id
    - EventCode
    - EventData_Xml
    - EventID
    - EventRecordID
    - eventtype
    - Guid
    - host
    - id
    - index
    - Keywords
    - Level
    - linecount
    - MessageNumber
    - MessageTotal
    - Name
    - Opcode
    - ProcessID
    - punct
    - RecordNumber
    - ScriptBlockId
    - ScriptBlockText
    - severity
    - severity_id
    - signature
    - signature_id
    - source
    - sourcetype
    - splunk_server
    - System_Props_Xml
    - SystemTime
    - tag
    - tag::eventtype
    - Task
    - TaskCategory
    - ThreadID
    - timestamp
    - user_id
    - UserID
    - vendor_product
    - Version
output_fields:
    - dest
    - signature
    - signature_id
    - user_id
    - vendor_product
    - Guid
    - Opcode
    - Name
    - Path
    - ProcessID
    - ScriptBlockId
    - ScriptBlockText
field_mappings:
    - data_model: cim
      data_set: Endpoint.Processes
      mapping:
          Computer: Processes.dest
          Path: Processes.process_path
          ScriptBlockId: Processes.process_id
          ScriptBlockText: Processes.process
          UserID: Processes.user_id
    - data_model: ocsf
      mapping:
          Computer: device.hostname
          Path: process.file.path
          ScriptBlockId: process.uid
          ScriptBlockText: process.cmd_line
          UserID: actor.user.uid
example_log: |
    <Event xmlns='http://schemas.microsoft.com/win/2004/08/events/event'><System><Provider Name='Microsoft-Windows-PowerShell' Guid='{A0C1853B-5C40-4B15-8766-3CF1C58F985A}'/><EventID>4104</EventID><Version>1</Version><Level>5</Level><Task>2</Task><Opcode>15</Opcode><Keywords>0x0</Keywords><TimeCreated SystemTime='2024-03-05T08:36:27.697068800Z'/><EventRecordID>173718</EventRecordID><Correlation ActivityID='{3282F326-6ACF-0000-3BFA-8532CF6ADA01}'/><Execution ProcessID='4744' ThreadID='3940'/><Channel>Microsoft-Windows-PowerShell/Operational</Channel><Computer>ar-win-dc.attackrange.local</Computer><Security UserID='S-1-5-21-3344543075-1022232225-2459664213-500'/></System><EventData><Data Name='MessageNumber'>1</Data><Data Name='MessageTotal'>1</Data><Data Name='ScriptBlockText'>Get-ADComputer -TrustedForDelegation</Data><Data Name='ScriptBlockId'>2deff591-3d0a-452d-8965-70b16cff029e</Data><Data Name='Path'></Data></EventData></Event>
