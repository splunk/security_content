name: Linux Auditd Add User
id: 30f79353-e1d2-4585-8735-1e0359559f3f
version: 4
creation_date: '2024-08-08'
modification_date: '2026-10-14'
author: Teoderick Contreras, Splunk
description: Logs activities related to the addition of a new user account on a Linux system, including details about the username, UID, and the process initiating the action.
mitre_components:
    - User Account Creation
    - User Account Metadata
    - OS API Execution
    - Application Log Content
source: auditd
sourcetype: auditd
separator: type
separator_value: ADD_USER
configuration: https://github.com/Neo23x0/auditd/blob/master/audit.rules
supported_TA:
    - name: Splunk Add-on for Unix and Linux
      url: https://splunkbase.splunk.com/app/833
      version: 10.3.4
fields:
    - _time
    - addr
    - AUID
    - auid
    - date_hour
    - date_mday
    - date_minute
    - date_month
    - date_second
    - date_wday
    - date_year
    - date_zone
    - eventtype
    - exe
    - host
    - hostname
    - ID
    - id
    - index
    - linecount
    - msg
    - op
    - pid
    - punct
    - res
    - ses
    - source
    - sourcetype
    - splunk_server
    - subj
    - tag
    - tag::eventtype
    - terminal
    - timeendpos
    - timestartpos
    - type
    - UID
    - uid
example_log: |
    type=ADD_USER msg=audit(1722950859.266:6994): pid=1788 uid=0 auid=1000 ses=1 subj=unconfined msg='op=adding user id=1002 exe="/usr/sbin/useradd" hostname=ar-linux1 addr=? terminal=pts/1 res=success'
    UID="root" AUID="ubuntu" ID="unknown(1002)"
