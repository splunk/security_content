    - index
    - k8s_ns
    - k8s_pod_name
    - linecount
    - parent
    - proc_exepath
    - process
    - punct
    - source
    - sourcetype
    - splunk_server
    - terminal
    - timeendpos
    - timestartpos
    - user
    - user_loginuid
    - user_uid
