name: Linux Auditd Execve
id: 9ef6364d-cc67-480e-8448-3306829a6a24
version: 3
creation_date: '2024-08-08'
modification_date: '2026-05-13'
author: Teoderick Contreras, Splunk
description: Logs the execution of processes on a Linux system, including details about the executed command, arguments, and the initiating process.
mitre_components:
    - Command Execution
    - Process Creation
    - Process Metadata
    - OS API Execution
    - Application Log Content
source: auditd
sourcetype: auditd
separator: type
separator_value: EXECVE
configuration: https://github.com/Neo23x0/auditd/blob/master/audit.rules
supported_TA:
    - name: Splunk Add-on for Unix and Linux
      url: https://splunkbase.splunk.com/app/833
      version: 10.3.4
fields:
    - _time
    - a0
    - a1
    - a2
    - argc
    - date_hour
    - date_mday
    - date_minute
    - date_month
    - date_second
    - date_wday
    - date_year
    - date_zone
    - eventtype
    - execve_command
    - host
    - index
    - linecount
    - msg
    - punct
    - source
    - sourcetype
    - splunk_server
    - tag
    - tag::eventtype
    - timeendpos
    - timestartpos
    - type
example_log: |
    type=EXECVE msg=audit(02/20/2025 11:02:58.146:94942): argc=2 a0=touch a1=./.hide_this_data.txt
