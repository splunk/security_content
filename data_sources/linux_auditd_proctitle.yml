name: Linux Auditd Proctitle
id: 5a25984a-2789-400a-858b-d75c923e06b1
version: 4
creation_date: '2024-08-08'
modification_date: '2026-10-14'
author: Teoderick Contreras, Splunk
description: Logs the full command-line arguments of a process execution on a Linux system, providing visibility into the executed command and its parameters.
mitre_components:
    - Command Execution
    - Process Metadata
    - OS API Execution
    - Application Log Content
source: auditd
sourcetype: auditd
separator: type
separator_value: PROCTITLE
configuration: https://github.com/Neo23x0/auditd/blob/master/audit.rules
supported_TA:
    - name: Splunk Add-on for Unix and Linux
      url: https://splunkbase.splunk.com/app/833
      version: 10.3.4
fields:
    - _time
    - ALL
    - date_hour
    - date_mday
    - date_minute
    - date_month
    - date_second
    - date_wday
    - date_year
    - date_zone
    - eventtype
    - host
    - if
    - index
    - linecount
    - msg
    - of
    - proctitle
    - punct
    - source
    - sourcetype
    - splunk_server
    - tag
    - tag::eventtype
    - timeendpos
    - timestartpos
    - type
example_log: |
    type=PROCTITLE msg=audit(02/20/2025 10:42:55.725:93710): proctitle=echo malware_user ALL=(ALL) NOPASSWD: ALL
