version: 2
creation_date: '2026-09-02'
modification_date: '2026-09-03'
author: Nasreddine Bencherchali, Rod Soto, Splunk
description: |-
    Maps AI-related ESCU detections and ESCU-generated risk/notable findings to NIST AI RMF subcategories for coverage review, gap analysis, and operational follow-up.
    Coverage is generated from detection metadata and configured AI data-source selectors; live findings are limited to standard ESCU rule saved-search output in the form "ESCU - <detection_name> - Rule".
