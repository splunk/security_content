name: unit-testing
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - data_sources/**
      - detections/**
      - lookups/**
      - macros/**
      - install.yml
jobs:
  unit-testing:
    runs-on: large-ubuntu-22.04-32core
    if: "!contains(github.ref, 'refs/tags/')" #don't run on tags - future steps won't run either since they depend on this job
    steps:
        #For fork PRs, always check out security_content and the PR target in security content!
        - name: Check out the repository code
          uses: actions/checkout@v7
          with:
            repository: 'splunk/security_content' #this should be the TARGET repo of the PR. we hardcode it for now
            ref: ${{ github.base_ref }}

        - name: Print out information abour PR target
          run: |
            echo "The PR target branch is: ${{ github.base_ref }}"
            echo "The PR head branch is: ${{ github.head_ref }}"
            echo "My current branch is"
            git branch --show-current
            git rev-parse HEAD


        - name: Set up Python
          uses: actions/setup-python@v6
          with:
            python-version: 3.14
            architecture: x64

        - name: Install contentctl-ng
          shell: bash
          run: |
            # TEMPORARY: hardcoded because this step runs on the base branch checkout, whose requirements.txt
            # does not yet pin 1.2.0b1. Revert to `pip install -r requirements.txt` before merging.
            echo "- Build Tool Version - contentctl-ng==1.2.0b1 (hardcoded)"
            pip install contentctl-ng==1.2.0b1

        # Check out the PR, even if it lives in a fork.
        # Instructions for pulling a PR were taken from:
        # https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/reviewing-changes-in-pull-requests/checking-out-pull-requests-locally
        - name: Checkout the PR branch and the target to calculate changed files for testing
          run: |

            echo "Current Branch (Head Ref): ${{ github.head_ref }}"
            echo "Target Branch (Base Ref): ${{ github.base_ref }}"
            git pull > /dev/null 2>&1
            #We checkout into a new branch - new_branch_for_testing to avoid name collisions with develop incase the forked PR is from develop
            git fetch origin pull/${{ github.event.pull_request.number }}/head:new_branch_for_testing
            #We must specifically get the PR's target branch from security_content, not the one that resides in the fork PR's forked repo
            git switch new_branch_for_testing

        - name: Run a contentctl-ng build command to create a package that will be tested.
          run: |
            contentctl-ng build

        # Writes testing_artifacts/test_plan_<timestamp>.yml. This step does not connect to Splunk,
        # so it runs before the slow provisioning step to fail fast on planning errors.
        - name: Create a test plan for content which has changed between this branch and the target branch
          run: |
            contentctl-ng test plan --test-type detection.unit --mode CHANGED --git-ref ${{ github.base_ref }}
            echo "contentctl-ng test plan - COMPLETED"

        # --provision starts the local Splunk container and waits until it is healthy before installing apps.
        - name: Run a contentctl-ng install to provision and configure the testing environment
          env:
            APPINSPECTUSERNAME: "${{ secrets.APPINSPECTUSERNAME }}"
            APPINSPECTPASSWORD: "${{ secrets.APPINSPECTPASSWORD }}"
          run : |
            contentctl-ng install --provision --splunkbase-username "$APPINSPECTUSERNAME" --splunkbase-password "$APPINSPECTPASSWORD"

        # With no --plan-input, this runs the most recent plan in testing_artifacts/.
        # Writes testing_artifacts/test_results_<timestamp>.yml and test_results_junit_<timestamp>.xml,
        # and exits non-zero if any test fails, errors, or does not run.
        - name: Run the test plan
          run: |
            contentctl-ng test run --post-test-behavior NEVER_PAUSE
            echo "contentctl-ng test run - COMPLETED"

        # Store the plan, results (YAML and JUnit XML), contentctl-ng logs, and built package to job artifact test_summary_results.zip
        - name: store_artifacts
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: test_summary_results
            path: |
              testing_artifacts/
              contentctl_ng_*.log
              dist/*.tar.gz
            if-no-files-found: warn

        # Run a simple custom script created to pretty print results in a markdown friendly format in Github Actions Summary
        - name: Check the testing_artifacts test results for pass/fail.
          if: always()
          run: |
            echo "This job will fail if there are failures in unit-testing"
            python .github/workflows/format_test_results.py >> $GITHUB_STEP_SUMMARY
            echo "The Unit testing is completed. See details in the unit-testing job summary UI "
