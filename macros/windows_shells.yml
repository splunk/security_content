description: Windows shell process names and PE internal names used to identify renamed shell binaries.
definition: (Processes.process_name IN ("bash.exe", "cmd.exe", "powershell.exe", "powershell_ise.exe", "pwsh.exe", "sh.exe", "WindowsTerminal.exe", "wt.exe") OR Processes.original_file_name IN ("Cmd.Exe", "PowerShell.EXE", "pwsh.dll", "PowerShell_ISE.EXE"))
