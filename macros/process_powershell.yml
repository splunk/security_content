definition: (Processes.process_name=pwsh.exe OR Processes.process_name=powershell.exe OR Processes.original_file_name=pwsh.dll OR Processes.original_file_name=PowerShell.EXE OR Processes.original_file_name=powershell_ise.EXE OR Processes.process_namepowershell_ise.exe)
description: Matches the process with its original file name, data for this macro came from https://strontic.github.io/
name: process_powershell