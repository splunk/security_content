version: 1
status: production
date: '2026-01-05'
author: Raven Tait, Splunk
description: Leverage advanced Splunk searches to detect and investigate suspicious user agent strings 
  on the network, including malware, command and control frameworks, RMM software, and other unwanted 
  programs.
narrative: It is a common for attackers of all types to leverage existing
  tools and frameworks to carry out activities on endpoints. Often less skilled adversaries
  forget to change some defaults, especially when it comes to things like user agents. 
  Fortunately, there are a number of ways to monitor network data in Splunk
  to detect suspicious activity involving these default user agent strings.
