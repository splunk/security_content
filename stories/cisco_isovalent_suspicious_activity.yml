version: 1
date: '2025-09-30'
author: Bhavin Patel, Splunk
status: production
description: This analytics story focuses on identifying suspicious activities and potential security threats within environments using Cisco Isovalent. It provides detection rules and guidance to help security teams recognize signs of adversary tactics such as unauthorized access attempts, unusual network activity, and other behaviors indicative of potential compromise.
narrative: |
  Cisco Isovalent with Tetragon delivers kernel-level, eBPF-powered visibility that traditional logs miss, correlating process execution, file access, and network flows with Kubernetes workload identity (namespace, labels, pod/container) and full process ancestry. This depth enables reliable detection of real-world Kubernetes threats, including container escapes, ServiceAccount token theft and API abuse, IMDS credential access, kubectl-in-container misuse, DGA/C2 beacons over trusted SaaS (GitHub, Pastebin, Discord), insecure curl usage (-k/--insecure), cron-based persistence, crypto‑mining, scanner/supply-chain image pulls, privileged/hostPath abuse, and much more.
  By continuously observing process_exec and L7 DNS/HTTP activity tied to specific pods and deployments, these detections surface late process launches, anomalous shells, and suspicious outbound connections that deviate from normal workload behavior—accelerating triage and response, reducing dwell time, and shrinking blast radius across Kubernetes environments.
