description: |-
    This analytic story covers exploitation attempts and post-exploitation activity associated with Node2Shell (CVE-2026-111497), an out-of-bounds write in the Brotli decoder used by Node.js.
    Its detections identify large HTTP POST requests that receive server errors and Linux auditd process image changes under the same PID, which can help surface exploit attempts and command execution for investigation.
narrative: |-
    Node2Shell (CVE-2026-111497) is a memory corruption vulnerability in the Brotli decoder used by Node.js. Applications that process untrusted Brotli data may be at risk of exploitation, which can result in application crashes or code execution.

    The detections in this story identify suspicious web request patterns and unexpected Linux process activity that may be associated with exploitation and post-exploitation behavior.

    Review relevant web, application, and endpoint telemetry together. Validate affected software versions and how the application processes untrusted data, and investigate unusual process activity in the context of the host and application. Tune detections for expected application behavior and legitimate large requests.
