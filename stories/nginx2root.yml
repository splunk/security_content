description: |-
    This analytic story covers exploitation attempts and post-exploitation activity associated with NGINX HTTP/2 remote code execution vulnerabilities CVE-2026-123007 and CVE-2026-123633.
    It's endpoint detections identify web server processes spawning shells and repeated NGINX worker crashes. 
narrative: |-
    On November 18, 2026, F5 and nginx.org disclosed ten vulnerabilities in nginx. Five of them, detailed by the Xint research team and published under the name nginx2root, are memory corruption flaws that an unauthenticated attacker can use to crash an nginx worker or, per Xint's research, run commands on the server. 
    
    Xint also found a Linux kernel bug that turns that foothold into root on the host, including from inside a Docker container. 

    The detections in this story identify suspicious Linux process activity that may be associated with exploitation and post-exploitation behavior.

    Review relevant web, application, and endpoint telemetry together. Validate affected software versions and how the application processes untrusted data, and investigate unusual process activity in the context of the host and application. Tune detections for expected application behavior and legitimate large requests.
