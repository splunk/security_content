description: |-
    This analytic story covers Ruby2Shell, a one-byte heap overflow in Ruby string case conversion tracked as CVE-2026-132825 and GHSA-34m4-m9fh-gqp5, and process activity that may follow code execution in an affected Ruby web application.
narrative: |-
    CVE-2026-132825 is a one-byte heap overflow in Ruby string case conversion for legacy single-byte encodings. Converting repeated sharp S characters can expand the output past the allocated buffer.

    Rails and classic-style Sinatra can reach the affected operation while handling untrusted requests. Other Ruby applications depend on how they convert input. UTF-8 follows a different path. Successful exploitation may execute code inside the Ruby worker or start a child process, but a matching request does not establish either outcome.

    HTTP Large POST and Oversized Multipart Header Activity identifies traffic patterns that may accompany heap manipulation, including repeated large bodies or long multipart headers. Ruby Repeated Legacy Sharp S Bytes in POST Body provides a narrower signal for the case-conversion input when bounded, plaintext body capture is available. Review the Ruby version, framework, request handling, client, and nearby worker failures before assigning this CVE.

    Web or Application Server Spawning a Shell, Windows Suspicious Child Process Spawned From WebServer, and Linux Auditd Shell from Web or Application Directory cover child execution after a web-worker compromise.

    Child execution is a strong investigative pivot, not a required result of the overflow. Upgrade Ruby to 3.3.14, 3.4.13, or 4.0.10, and update applications that bundle an affected runtime.
