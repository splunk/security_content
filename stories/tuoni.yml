description: Tuoni is a sophisticated, cross-platform red teaming framework designed to enhance
  cybersecurity education and training through large-scale cyber defense exercises.
narrative: This Analytic Story supports you to detect Tactics, Techniques and Procedures
  (TTPs) from Tuoni. A new wave of cyberattacks has emerged using the Tuoni C2 framework,
  a sophisticated tool that allows threat actors to deploy malicious payloads directly into system memory.
  This technique helps attackers avoid detection by traditional security solutions that rely on scanning files stored on disk.
  The Tuoni framework has gained attention in the cybersecurity community for its modular design
  and ability to perform multiple attack variations without leaving significant traces on compromised systems.
