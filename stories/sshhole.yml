status: production
description: |-
    This analytic story covers SSH password-bypass activity and related post-authentication behavior associated with SSHhole CVE. Its detections identify suspicious SSH authentication against common non-user accounts, subsequent doas execution as root, and Linux shell execution recorded by auditd.
narrative: |-
    SSHHole demonstrates an SSH password-bypass path that can allow access through accounts that commonly do not accept interactive logins. The detections in this story look for a failed SSH password attempt followed by a successful login for a common non-user account, an accepted SSH login followed by a doas command run as root, and auditd shell execution under a common non-user account.
