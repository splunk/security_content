        - Ivanti EPMM Remote Unauthenticated Access
    asset_type: Web Server
    cve:
        - CVE-2023-35082
    atomic_guid: []
    mitre_attack_id:
        - T1190
        - T1133
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: network
