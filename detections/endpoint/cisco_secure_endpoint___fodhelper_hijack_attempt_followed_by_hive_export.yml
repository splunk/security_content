name: Cisco Secure EP - Fodhelper Hijack Attempt and Hive Export
id: 4f5cad48-680e-4799-81c9-d85547a3853d
version: 1
creation_date: '2026-11-27'
modification_date: '2026-11-27'
author: Nasreddine Bencherchali, Splunk
status: production
type: Anomaly
description: |-
    This analytic detects a Fodhelper UAC handler registration followed by a Windows registry hive export by the same user on the same endpoint within five minutes, by correlating two Cisco Secure Endpoint Behavioral Protection alerts.
    The sequence can indicate an attempted privilege escalation followed by collection of registry data. The handler alert does not prove that Fodhelper elevated a process; Secure Endpoint may block that path.
    Verify the actual process integrity level and parentage, the exported hive, the account's authorization, and any subsequent transfer.
data_source:
    - Cisco Secure Endpoint Behavioral Protection Threat Detection
search: |-
    `cisco_secure_endpoint`
    event_type="Threat Detection"

    | `cisco_secure_endpoint_extract_bp_fields`

    | where sig_id IN ("20211102144224","20211119002713")

    | spath path=bp_data.details.matched_activity.events{0}.registry:set.key output=handler_key
    | spath path=bp_data.details.matched_activity.events{0}.registry:set.data_txt output=handler_value
    | spath path=bp_data.details.matched_activity.events{0}.registry:set.user.domain output=registry_domain
    | spath path=bp_data.details.matched_activity.events{0}.process:start.cmd_line output=export_command
    | spath path=bp_data.details.matched_activity.events{0}.process:start.user.domain output=process_domain
    | spath path=bp_data.details.matched_activity.events{1}.file:create.path output=hive_path
    | spath path=bp_data.details.matched_activity.events{1}.file:create.name output=hive_name

    | eval stage=if(sig_id="20211102144224","handler","export"),
           actor=lower(user),
           actor_domain=lower(coalesce(registry_domain,process_domain)),
           event_time=tonumber(timestamp)+tonumber(timestamp_nanoseconds)/1000000000,
           setup_time_candidate=if(stage="handler",event_time,null()),
           handler_key_candidate=if(stage="handler",handler_key,null()),
           handler_value_candidate=if(stage="handler",handler_value,null())

    | where isnotnull(endpoint_guid)
            AND isnotnull(actor)
            AND isnotnull(actor_domain)
            AND isnotnull(event_time)

    | sort 0 endpoint_guid actor_domain actor event_time

    | streamstats last(setup_time_candidate) as setup_time
            last(handler_key_candidate) as handler_key
            last(handler_value_candidate) as handler_value
      by endpoint_guid actor_domain actor

    | where stage="export"
            AND isnotnull(setup_time)
            AND event_time>=setup_time
            AND event_time-setup_time<=300
            AND isnotnull(hive_path)
            AND isnotnull(hive_name)

    | eval hive_file=hive_path.urldecode("%5C").hive_name,
           user=actor_domain.urldecode("%5C").actor,
           firstTime=setup_time,
           lastTime=event_time

    | table dest user endpoint_guid handler_key handler_value
            export_command hive_file firstTime lastTime
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `cisco_secure_endpoint___fodhelper_hijack_attempt_followed_by_hive_export_filter`
how_to_implement: |-
    This search requires Cisco Secure Endpoint Behavioral Protection Threat Detection alerts, which include event_type="Threat Detection".
    This search uses an input macro named `cisco_secure_endpoint`.
    We strongly recommend that you specify your environment-specific configurations (index, source, sourcetype, etc.) for Cisco Secure Endpoint Behavioral Protection Threat Detection alerts.
    Replace the macro definition with configurations for your Splunk environment.
    The `cisco_secure_endpoint_extract_bp_fields` macro extracts the common signature, endpoint, and actor fields used by this search.
    The search also uses a post-filter macro designed to filter out known false positives.
    The logs are to be ingested using the Cisco Security Cloud App for Splunk (https://splunkbase.splunk.com/app/7404).
known_false_positives: >-
    An approved UAC test followed by administrative registry backup can produce this sequence. Confirm the handler value, export command, actual elevation path, and change record before assigning compromise.
references:
    - https://docs.amp.cisco.com/en/SecureEndpoint/Secure%20Endpoint%20User%20Guide.pdf
    - https://attack.mitre.org/techniques/T1548/002/
    - https://attack.mitre.org/techniques/T1012/
drilldown_searches:
    - name: View BP Activity for - $dest$
      search: |-
        `cisco_secure_endpoint` event_type="Threat Detection"
        | spath path=computer.connector_guid output=endpoint_guid
        | search endpoint_guid="$endpoint_guid$"
        | spath path=bp_data.details.sig_id output=sig_id
        | spath path=bp_data.remediated output=remediated
        | spath path=bp_data.details.matched_activity.events{0}.process:start.cmd_line output=process_command
        | spath path=bp_data.details.matched_activity.events{0}.script:execution.cmd_line output=script_command
        | eval observed_command=coalesce(process_command,script_command)
        | table _time detection severity sig_id remediated observed_command _raw
        | sort - _time
      earliest_offset: 7d
      latest_offset: "0"
    - name: View Cloud IOC Activity for - $dest$
      search: |-
        `cisco_secure_endpoint` event_type="Cloud IOC"
        | spath path=computer.connector_guid output=endpoint_guid
        | search endpoint_guid="$endpoint_guid$"
        | spath path=cloud_ioc.short_description output=ioc_name
        | spath path=cloud_ioc.description output=ioc_description
        | spath path=command_line.arguments output=process_command
        | spath path=file.file_name output=file_name
        | spath path=file.file_path output=file_path
        | spath path=file.identity.sha256 output=file_sha256
        | eval activity_time=strftime(tonumber(coalesce(start_timestamp,timestamp)),"%Y-%m-%d %H:%M:%S")
        | table _time activity_time ioc_name severity process_command file_name file_path file_sha256 ioc_description _raw
        | sort - _time
      earliest_offset: 7d
      latest_offset: "0"
    - name: View risk events for the last 7 days for - "$user$"
      search: |-
        | from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
      earliest_offset: 7d
      latest_offset: "0"
intermediate_findings:
    entities:
        - field: dest
          type: system
          score: 20
          message: Fodhelper handler set then hive $hive_file$ exported by $user$ on $dest$
threat_objects:
    - field: handler_value
      type: command
    - field: export_command
      type: command
    - field: hive_file
      type: file_path
analytic_story:
    - Windows Post-Exploitation
asset_type: Endpoint
mitre_attack_id:
    - T1548.002
    - T1012
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test - Cisco Secure Endpoint BP
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_secure_endpoint/behavioral_protection/fodhelper_hijack_hive_export/cisco_se.log
          source: not_applicable
          sourcetype: cisco:se
      test_type: unit
