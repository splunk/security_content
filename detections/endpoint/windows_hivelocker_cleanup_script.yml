name: Windows Hivelocker Cleanup Script
id: 0c4b7785-96df-4e05-9429-1bf9e22eb6ac
version: 1
date: '2026-04-13'
author: Raven Tait, Splunk
status: production
type: TTP
description: |-
    Detects the execution of hive.bat, a self-deleting clean-up script utilized by Hivelocker.
    Hivelocker is a ransomware family with versions written in Go and Rust that can encrypt files on fixed or removable disks as well as network shares.
    False positives are possible since the name of the bat file isn't particularly unique but the combination of flags and piping to NUL should limit them adequately.
data_source:
    - Sysmon EventID 1
    - Windows Event Log Security 4688
    - CrowdStrike ProcessRollup2
search: |-
    | tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where Processes.process="*/c*" Processes.process="*hive.bat*" Processes.process="*>NUL*" Processes.process_name="cmd.exe" by Processes.process Processes.vendor_product Processes.user_id Processes.process_hash Processes.parent_process_name Processes.parent_process_exec Processes.action Processes.dest Processes.process_current_directory Processes.process_path Processes.process_integrity_level Processes.original_file_name Processes.parent_process Processes.parent_process_path Processes.parent_process_guid Processes.parent_process_id Processes.process_guid Processes.process_id Processes.user Processes.process_name
    | `drop_dm_object_name(Processes)`
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `windows_hivelocker_cleanup_script_filter`
how_to_implement: The detection is based on data that originates from Endpoint Detection and Response (EDR) agents. These agents are designed to provide security-related telemetry from the endpoints where the agent is installed. To implement this search, you must ingest logs that contain the process GUID, process name, and parent process. Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product. The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: Some legitimate batch files with similar names may trigger this detection, but the specific combination of flags and piping to NUL helps reduce false positives. Review alerts to exclude approved scripts as needed.
references:
    - https://advantage.mandiant.com/reports/22-00016782#_Toc109212830
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa22-321a
    - https://explore.avertium.com/resource/hive-ransomware-everything-you-need-to-know
drilldown_searches:
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View the detection results for - "$user$" and "$dest$"
      search: '%original_detection_search% | search  user = "$user$" dest = "$dest$"'
    - name: View risk events for the last 7 days for - "$user$" and "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
rba:
    message: Potential Hivelocker cleanup script observed on $dest$ via $process$.
    risk_objects:
        - field: dest
          type: system
          score: 50
    threat_objects:
        - field: parent_process_name
          type: parent_process_name
tags:
    analytic_story:
        - Ransomware
    asset_type: Endpoint
    mitre_attack_id:
        - T1485
        - T1070.004
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1485/snapattack/snapattack.log
          source: XmlWinEventLog:Security
          sourcetype: XmlWinEventLog
