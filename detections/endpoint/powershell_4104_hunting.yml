name: PowerShell 4104 Hunting
id: d6f2b006-0041-11ec-8885-acde48001122
version: 29
creation_date: '2021-08-19'
modification_date: '2026-09-03'
author: Michael Haag, Splunk
status: production
type: Hunting
description: 'The following analytic identifies suspicious PowerShell execution using Script Block Logging (EventCode 4104). It leverages specific patterns and keywords within the ScriptBlockText field to detect potentially malicious activities. This detection is significant for SOC analysts as PowerShell is commonly used by attackers for various malicious purposes, including code execution, privilege escalation, and persistence.

    If confirmed malicious, this activity could allow attackers to execute arbitrary commands, exfiltrate data, or maintain long-term access to the compromised system, posing a severe threat to the organization''s security.'
data_source:
    - Powershell Script Block Logging 4104
search: |
    | tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime FROM datamodel=Endpoint.Processes where Processes.process IN ("*-dumpcr*", "* -version *", "*::decompress*", "*Add-Exfiltration*", "*Add-Persistence*", "*Add-RegBackdoor*", "*Add-ScrnSaveBackdoor*", "*AmsiBypass*", "*assemblybuilderaccess*", "*backdoor*", "*backupprivilege*", "*beacon*", "*bitstransfer*", "*Brute-Force*", "*BruteForce*", "*CachedRDPConnection*", "*Check-VM*", "*cnvert*", "*compress-archive*", "*ComputerProperty*", "*comsvcs*", "*copy-vss*", "*CreateShortcut*", "*disablerealtimemonitoring*", "*Do-Exfiltration*", "*downloadfile*", "*downloadstring*", "*Enabled-DuplicateToken*", "*EXEonRemote*", "*exfiltration*", "*expand-archive*", "*Exploit-*", "*exploit*", "*Find-*", "*Frombase64*", "*Get-ApplicationHost*", "*Get-ChromeDump*", "*Get-ClipboardContents*", "*Get-*Credent*", "*Get-FoxDump*", "*Get-GPPPassword*", "*Get-IndexedItem*", "*Get-Keystrokes*", "*Get-PassHash*", "*Get-*Password*", "*Get-RegAlwaysInstallElevated*", "*Get-RegAutoLogon*", "*Get-RickAstley*", "*Get-Screenshot*", "*Get-SecurityPackages*", "*Get-ServiceFilePermission*", "*Get-ServicePermission*", "*Get-ServiceUnquoted*", "*Get-SiteListPassword*", "*Get-System*", "*Get-TimedScreenshot*", "*Get-UnattendedInstallFile*", "*Get-Unconstrained*", "*Get-VaultCredential*", "*Get-VulnAutoRun*", "*Get-VulnSchTask*", "*Gupt-Backdoor*", "*gzipstream*", "*hijack*", "*HTTP-Login*", "*IEX *", "*injection*", "*Install-Service*", "*Install-ServiceBinary*", "*Install-SSP*", "*internetexplorer.application*", "*Invoke-*", "*io.compression*", "*kerberos::*", "*lastloggedon*", "*localadmin*", "*LSASecret*", "*lsass.exe*", "*MailRaider*", "*metasp*", "*mimikatz*", "*NEEEEWWW*", "*netfirewall*", "*NetworkRelay*", "*New-HoneyHash*", "*ngrok*", "*nishang*", "*Out-Minidump*", "*out-shortcut*", "*Port-Scan*", "*PortScan*", "*PowerBreach*", "*PowerShellIcmp*", "*PowerShelludp*", "*powershellwmi*", "*PowerUp*", "*PowerView*", "*rc4bytestream*", "*reflection.assembly*", "*remoteps*", "*remotewmi*", "*Remove-Update*", "*SEKURLSA::*", "*Set-MacAttribute*", "*Set-Wallpaper*", "*shell.application*", "*shellcode*", "*Show-TargetScreen*", "*Start-CaptureServer*", "*start-process*", "*system.security.cryptography*", "*Uninstall-Windows*", "*UserProperty*", "*VolumeShadowCopyTools*", "*WebClient*", "*webrequest*", "*wmicommand*", "*wmimethod*", "*wmiobject*", "*write-zip*", "*xmlhttp*") by Processes.dest Processes.signature Processes.signature_id Processes.user_id Processes.vendor_product Processes.Guid Processes.Opcode Processes.Name Processes.Path Processes.ProcessID Processes.ScriptBlockId Processes.ScriptBlockText | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `powershell_4104_hunting_filter`
how_to_implement: 'The following Hunting analytic requires PowerShell operational logs to be ingested with ScriptBlockLogging enabled.

    Modify the powershell macro as needed to match the sourcetype or add index.

    This analytic is specific to EventID 4104, or PowerShell Script Block Logging.'
known_false_positives: Limited false positives. May filter as needed.
