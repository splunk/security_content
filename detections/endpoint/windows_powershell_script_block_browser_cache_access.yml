name: Windows PowerShell Script Block Browser Cache Access
id: 6962e59a-907f-41fe-8688-9174bce89d31
version: 1
creation_date: '2026-11-02'
modification_date: '2026-11-02'
author: Raven Tait, Splunk
status: production
type: TTP
description: |-
    This analytic detects PowerShell Script Block Logging events that enumerate or read browser cache directories. PowerShell inspecting Firefox, Chrome, Edge, Brave, or Chromium cache files can indicate cache smuggling, where web content disguised as an image is extracted and staged for execution. The analytic looks for browser cache paths together with file enumeration or read operations, rather than relying on cache markers or a specific payload name.
data_source:
    - Powershell Script Block Logging 4104
search: |-
    `powershell`
    EventCode=4104

    | eval ScriptBlockText=coalesce(ScriptBlockText, EventData_Xml, Message)
    | eval script_block=lower(ScriptBlockText)
    | eval cache_family=case(
        like(script_block, "%mozilla%firefox%profiles%") AND like(script_block, "%cache2%entries%"), "Firefox",
        like(script_block, "%google%chrome%user data%") AND like(script_block, "%cache_data%"), "Chrome",
        like(script_block, "%microsoft%edge%user data%") AND like(script_block, "%cache_data%"), "Edge",
        like(script_block, "%bravesoftware%brave-browser%user data%") AND like(script_block, "%cache_data%"), "Brave",
        like(script_block, "%chromium%user data%") AND like(script_block, "%cache_data%"), "Chromium"
      )
    | where isnotnull(cache_family)
        AND (
          like(script_block, "%get-childitem%")
          OR like(script_block, "%gci %")
          OR like(script_block, "%readallbytes%")
          OR like(script_block, "%readalltext%")
          OR like(script_block, "%readbytes%")
          OR like(script_block, "%get-content%")
          OR like(script_block, "%select-string%")
          OR like(script_block, "%copy-item%")
          OR like(script_block, "%writeallbytes%")
        )
    | eval dest=coalesce(dest, Computer, dvc, host)
    | eval user=coalesce(user, UserID, User)
    | stats count min(_time) as firstTime max(_time) as lastTime
        values(cache_family) as cache_family values(ScriptBlockText) as ScriptBlockText
        values(Path) as Path values(Guid) as Guid
        by dest user ScriptBlockId ProcessID signature signature_id
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `windows_powershell_script_block_browser_cache_access_filter`
how_to_implement: |-
    The following analytic requires PowerShell operational logs to be imported. Modify the powershell macro as needed to match the sourcetype or add index. This analytic is specific to 4104, or PowerShell Script Block Logging.
known_false_positives: |-
    Administrators or support scripts may inspect browser caches for troubleshooting, cleanup, or forensic analysis. Review the script content, user, host, and any subsequent file creation or script execution before disposition.
references:
    - https://sensepost.com/blog/2023/browsers-cache-smuggling/
    - https://x.com/MsftSecIntel/status/2106197481960706155
drilldown_searches:
    - name: View the detection results for - "$dest$" and "$user$"
      search: '%original_detection_search% | search dest = "$dest$" user = "$user$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$" and "$user$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$", "$user$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
finding:
    title: PowerShell accessed the [$cache_family$] browser cache on [$dest$]
    entity:
        field: dest
        type: system
        score: 50
threat_objects:
    - field: signature_id
      type: signature
analytic_story:
    - Browser Cache Smuggling
    - Malicious PowerShell
asset_type: Endpoint
mitre_attack_id:
    - T1059.001
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059.001/powershell_browser_cache_access/windows-powershell.log
          source: XmlWinEventLog:Microsoft-Windows-PowerShell/Operational
          sourcetype: XmlWinEventLog
      test_type: unit
