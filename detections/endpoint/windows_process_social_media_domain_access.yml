name: Windows Process Social Media Domain Access
id: d6dc231e-8595-499b-889e-cf6a055df4d4
version: 1
creation_date: '2026-10-06'
modification_date: '2026-10-06'
author: Teoderick Contreras, Splunk
status: production
type: Anomaly
description: This analytic detects outbound network connections from a Python process running from suspicious or non-standard directories to Facebook and Meta-related domains. It leverages Sysmon Event ID 3 (network connection) telemetry to surface this anomalous behavior. Legitimate Python applications rarely originate from paths such as C:\Users\Public\, Windows font or debug folders, or the Recycle Bin, making direct outbound calls to Facebook infrastructure from these locations a strong indicator of compromise. For example the Braodo Stealer, a Python-based credential-harvesting malware, abuses authenticated browser sessions to query the Meta Graph API and enumerate the victim's Facebook and Meta advertising infrastructure. Beyond stealing browser credentials and session cookies, it collects advertising account IDs, statuses, currencies, balances, spending amounts and limits, payment thresholds, creation dates, and associated credit-card payment method details. For Business Manager accounts, it also queries advertising-account limits, giving the attacker a comprehensive view of the victim's advertising footprint. If confirmed malicious, this activity indicates an active Braodo Stealer infection capable of exfiltrating sensitive financial and advertising data alongside browser-stored credentials and cookies.
data_source:
    - Sysmon EventID 3
search: |-
    `sysmon`
      EventCode=3
      Image IN (
      "C:\\Users\\Public\\*",
      "*\\windows\\fonts\\*",
      "*\\windows\\debug\\*",
      "*\\Users\\Administrator\\Music\\*",
      "*Recycle.bin*",
      "*\\Windows\\Media\\*",
      "\\Windows\\repair\\*",
      "*\\PerfLogs\\*",
      "*:\\Windows\\Prefetch\\*",
      "*:\\Windows\\Cursors\\*",
      "*:\\Windows\\INF\\*"
      ) AND
      process_name IN (
      python.exe,
      python2*.exe,
      python3*.exe,
      py.exe,
      pythonw.exe,
      py.exe,
      pypy.exe) AND
      DestinationHostname IN ("*.facebook.com", "*.fb.com", "*.facebook.net", "*.facebook.org", "*.fbcd.net", "*.fbsbx.com", "*.tfbw.net", "*.fbstatic-a.akamaihd.net" ) AND
      direction = outbound
      | stats count min(_time) as firstTime
              max(_time) as lastTime
      by action app dest dest_ip dest_port direction dvc protocol protocol_version
        src src_ip src_port transport user vendor_product process_name
        process_exec process_guid process_id
      | `security_content_ctime(firstTime)`
      | `security_content_ctime(lastTime)`
    | `windows_process_social_media_domain_access_filter`
how_to_implement: To successfully implement this search, you need to be ingesting logs with the process name and sysmon eventcode = 3 connection events from your endpoints. If you are using Sysmon, you must have at least version 6.0.4 of the Sysmon TA.
known_false_positives: No false positives have been identified at this time.
references:
    - https://www.splunk.com/en_us/blog/security/cracking-braodo-stealer-analyzing-python-malware-and-its-obfuscated-loader.html
drilldown_searches:
    - name: View the detection results for - "$dest$"
      search: '%original_detection_search% | search  dest = "$dest$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
intermediate_findings:
    entities:
        - field: dest
          type: system
          score: 20
          message: A Python Process Accessing Facebook Domain on $dest$ by $user$
analytic_story:
    - Braodo Stealer
asset_type: Endpoint
mitre_attack_id:
    - T1586.001
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1586.001/python_fb/python_facebook.log
          source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
          sourcetype: XmlWinEventLog
      test_type: unit
