name: Cisco Secure EP - Hidden Script After Delivery or Zone Change
id: 08d7aef4-3c58-4a36-b482-71fb55470771
version: 1
creation_date: '2026-11-27'
modification_date: '2026-11-27'
author: Nasreddine Bencherchali, Splunk
status: production
type: TTP
description: |-
    This analytic detects hidden PowerShell execution of a script after a BITS transfer, a Zone.Identifier change, or both, by correlating Cisco Secure Endpoint Behavioral Protection alerts for the same file and process tree.
    Delivery or trust-marker modification followed by concealed execution can indicate an attacker staging and running a payload. The result records which preceding action was observed.
    Review the script content, transfer source when present, and the initiating process.
data_source:
    - Cisco Secure Endpoint Behavioral Protection Threat Detection
search: |-
    `cisco_secure_endpoint`
    event_type="Threat Detection"

    | `cisco_secure_endpoint_extract_bp_fields`

    | where sig_id IN ("20170804213338","20190603173116","20201202215412")

    | spath path=bp_data.details.matched_activity.events{0}.process:start.parent_guid output=parent_guid
    | spath path=bp_data.details.matched_activity.events{0}.process:start.cmd_line output=process_command
    | spath path=bp_data.details.matched_activity.events{0}.process:start.args{} output=process_args

    | eval stage=case(sig_id="20170804213338","transfer",
           sig_id="20190603173116","zone",
               sig_id="20201202215412","execute")

    | eval transfer_file=if(stage="transfer",lower(mvindex(process_args,-1)),null()),
           transfer_url=if(stage="transfer",mvindex(process_args,-2),null())

    | rex field=process_command "(?i)ReadAllText\('(?<executed_file>[A-Za-z]:[^']+\.ps1)'"

    | rex field=process_command "(?i)>\s*(?<zone_file>[A-Za-z]:.+?\.ps1):Zone\.Identifier"

    | eval file_ref=lower(coalesce(transfer_file,zone_file,executed_file))

    | eval event_time=tonumber(timestamp)+tonumber(timestamp_nanoseconds)/1000000000

    | where isnotnull(endpoint_guid)
            AND isnotnull(parent_guid)
            AND isnotnull(file_ref)
            AND isnotnull(event_time)

    | sort 0 endpoint_guid parent_guid file_ref event_time

    | streamstats max(eval(if(stage="transfer",event_time,null()))) as transfer_time
                  last(eval(if(stage="transfer",process_command,null()))) as transfer_command
                  last(eval(if(stage="transfer",transfer_url,null()))) as download_url
              max(eval(if(stage="zone",event_time,null()))) as zone_time
              last(eval(if(stage="zone",process_command,null()))) as zone_command
      by endpoint_guid parent_guid file_ref

    | where stage="execute"

    | eval transfer_time=if(isnotnull(transfer_time) AND event_time-transfer_time<=300,transfer_time,null()),
           zone_time=if(isnotnull(zone_time) AND event_time-zone_time<=300,zone_time,null())

    | where isnotnull(transfer_time) OR isnotnull(zone_time)

    | eval download_url=if(isnotnull(transfer_time),download_url,null()),
           transfer_command=if(isnotnull(transfer_time),transfer_command,null()),
           zone_command=if(isnotnull(zone_time),zone_command,null()),
           activity=case(isnotnull(transfer_time) AND isnotnull(zone_time),"BITS transfer and zone change",
                         isnotnull(transfer_time),"BITS transfer",
                         isnotnull(zone_time),"zone marker change"),
           script_file=file_ref,
           execution_command=process_command,
           firstTime=if(isnull(transfer_time),zone_time,if(isnull(zone_time),transfer_time,min(transfer_time,zone_time))),
           lastTime=event_time

    | sort 0 endpoint_guid parent_guid script_file firstTime -lastTime

    | dedup endpoint_guid parent_guid script_file firstTime

    | eval user=coalesce(user,"unknown")

    | table dest user endpoint_guid parent_guid script_file activity
            download_url transfer_command zone_command execution_command firstTime lastTime
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `cisco_secure_endpoint___hidden_script_after_delivery_or_zone_change_filter`
how_to_implement: |-
    This search requires Cisco Secure Endpoint Behavioral Protection Threat Detection alerts, which include event_type="Threat Detection".
    This search uses an input macro named `cisco_secure_endpoint`.
    We strongly recommend that you specify your environment-specific configurations (index, source, sourcetype, etc.) for Cisco Secure Endpoint Behavioral Protection Threat Detection alerts.
    Replace the macro definition with configurations for your Splunk environment.
    The `cisco_secure_endpoint_extract_bp_fields` macro extracts the common signature, endpoint, and actor fields used by this search.
    The search also uses a post-filter macro designed to filter out known false positives.
    The logs are to be ingested using the Cisco Security Cloud App for Splunk (https://splunkbase.splunk.com/app/7404).
known_false_positives: >-
    A legitimate deployment workflow may transfer a script with BITS, change its zone marker, or
    run it hidden. Review the source URL when present, script content, account, parent process, and
    deployment change record.
references:
    - https://docs.amp.cisco.com/en/SecureEndpoint/Secure%20Endpoint%20User%20Guide.pdf
    - https://attack.mitre.org/techniques/T1197/
    - https://attack.mitre.org/techniques/T1553/005/
    - https://attack.mitre.org/techniques/T1059/001/
drilldown_searches:
    - name: View BP Activity for - $dest$
      search: |-
        `cisco_secure_endpoint` event_type="Threat Detection"
        | spath path=computer.connector_guid output=endpoint_guid
        | search endpoint_guid="$endpoint_guid$"
        | spath path=bp_data.details.sig_id output=sig_id
        | spath path=bp_data.remediated output=remediated
        | spath path=bp_data.details.matched_activity.events{0}.process:start.cmd_line output=process_command
        | spath path=bp_data.details.matched_activity.events{0}.script:execution.cmd_line output=script_command
        | eval observed_command=coalesce(process_command,script_command)
        | table _time detection severity sig_id remediated observed_command _raw
        | sort - _time
      earliest_offset: 7d
      latest_offset: "0"
    - name: View Cloud IOC Activity for - $dest$
      search: |-
        `cisco_secure_endpoint` event_type="Cloud IOC"
        | spath path=computer.connector_guid output=endpoint_guid
        | search endpoint_guid="$endpoint_guid$"
        | spath path=cloud_ioc.short_description output=ioc_name
        | spath path=cloud_ioc.description output=ioc_description
        | spath path=command_line.arguments output=process_command
        | spath path=file.file_name output=file_name
        | spath path=file.file_path output=file_path
        | spath path=file.identity.sha256 output=file_sha256
        | eval activity_time=strftime(tonumber(coalesce(start_timestamp,timestamp)),"%Y-%m-%d %H:%M:%S")
        | table _time activity_time ioc_name severity process_command file_name file_path file_sha256 ioc_description _raw
        | sort - _time
      earliest_offset: 7d
      latest_offset: "0"
    - name: View risk events for the last 7 days for - "$user$"
      search: |-
        | from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
      earliest_offset: 7d
      latest_offset: "0"
finding:
    title: Hidden script on $dest$ after $activity$
    entity:
        field: dest
        type: system
        score: 50
threat_objects:
    - field: download_url
      type: url
    - field: script_file
      type: file_path
    - field: execution_command
      type: command
analytic_story:
    - Compromised Windows Host
    - Windows Post-Exploitation
asset_type: Endpoint
mitre_attack_id:
    - T1059.001
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test - Cisco Secure Endpoint BP
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_secure_endpoint/behavioral_protection/bits_transfer_hidden_script_execution/cisco_se.log
          source: not_applicable
          sourcetype: cisco:se
      test_type: unit
    - name: True Positive Test - Cisco Secure Endpoint BP Zone Change
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_secure_endpoint/behavioral_protection/zone_marker_hidden_script_execution/cisco_se.log
          source: not_applicable
          sourcetype: cisco:se
      test_type: unit
    - name: True Positive Test - Cisco Secure Endpoint BP BITS and Zone Change
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_secure_endpoint/behavioral_protection/bits_zone_hidden_script_execution/cisco_se.log
          source: not_applicable
          sourcetype: cisco:se
      test_type: unit
