name: Linux Auditd Audit Configuration File Modification
id: 9e2b7c41-3f6a-4d58-b0e2-7a4c5d1f8b60
version: 1
creation_date: '2026-11-02'
modification_date: '2026-11-24'
author: vahid malekmohammadi
status: production
type: Anomaly
description: |-
    The following analytic detects modification of the Linux audit (auditd) configuration under /etc/audit/ (rules files, auditd.conf and dispatcher plugins), the legacy /etc/audisp/ directory and /etc/libaudit.conf, using Linux Auditd.
    Adversaries tamper with these files to weaken or disable logging so their activity is not recorded. Unlike stopping the auditd service, which raises a DAEMON_END event, editing the on-disk configuration leaves the running daemon up and only takes effect on the next reload or reboot, which makes it a stealthier defense-evasion technique.
    The analytic correlates the PATH record of an audit configuration file with the CWD and SYSCALL records of the same audit event, reconstructs the absolute path when the file was opened by a relative name (for example after a chdir into /etc/audit), and requires a successful syscall so that denied attempts are not reported.
    Package upgrades and the augenrules compile step legitimately write these files, so this is modeled as an anomaly and should be tuned with the filter macro.
data_source:
    - Linux Auditd Path
    - Linux Auditd Cwd
    - Linux Auditd Syscall
search: |-
    `linux_auditd`
    (
      (type=PATH nametype IN ("NORMAL","CREATE","DELETE"))
      OR type=CWD
      OR type=SYSCALL
    )

    | rex "msg=audit\([^)]*:(?<audit_id>\d+)\)"
    | fillnull cwd

    | stats values(name) as names values(nametype) as nametype values(cwd) as cwd values(comm) as process_name values(exe) as process values(success) as success values(auid) as auid values(uid) as uid min(_time) as firstTime max(_time) as lastTime BY audit_id host

    | eval cwd=mvfilter(cwd!=0)
    | mvexpand cwd

    | eval candidate_paths=mvmap(names, if(match(names,"^/"), names, cwd."/".names))
    | eval matched_paths=mvfilter(match(candidate_paths,"/etc/(?:[\.\/]+)?(audit|audisp)(/.+)?$") OR match(candidate_paths,"/etc/(?:[\.\/]+)?libaudit\.conf$"))
    | eval match_count=mvcount(matched_paths)

    | where match_count>0 AND success="yes" AND isnotnull(process_name)
    
    | fields - names,match_count,candidate_paths
    | rename host as dest, matched_paths as path

    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `linux_auditd_audit_configuration_file_modification_filter`
how_to_implement: |-
    To implement this detection, ingest auditd data consisting of SYSCALL, PATH, CWD and PROCTITLE events using the Splunk Add-on for Unix and Linux (https://splunkbase.splunk.com/app/833), and normalize the field names to the Splunk Common Information Model (CIM).
    Make sure the type=CWD record is captured in your auditd configuration, as it is used here to reconstruct the absolute path when an audit configuration file is opened by a relative name.
    The host's auditd rules must generate PATH and SYSCALL records for writes under these locations - the common way is a watch such as "-w /etc/audit/ -p wa -k <key>", "-w /etc/audisp/ -p wa -k <key>" and "-w /etc/libaudit.conf -p wa -k <key>" (shipped by most hardened rulesets, e.g. the Neo23x0 auditd baseline). Use write and attribute permissions (wa) and do not add read permission, because the analytic cannot tell a read from a write.
    The analytic matches on the file paths in the PATH records of every audit event, so on hosts with broad audit rules (for example execve auditing) it processes a large number of records; test it in a development environment and check its run time before enabling it in production.
    The analytic requires a successful (success=yes) syscall correlated to the PATH record, so denied/failed write attempts are not reported as modifications. Confirm field names against a real event, as auditd extraction can vary by deployment.
known_false_positives: |-
    The augenrules compile step rewrites /etc/audit/audit.rules (process augenrules), and package installation or upgrade of auditd (apt, dpkg, rpm, ucf) writes these files legitimately, as does configuration-management tooling (Ansible, Puppet, Chef, Salt).
    Administrators editing rule files under /etc/audit/rules.d/ or tuning auditd.conf will also trigger this.
    Update the filter macro to allowlist the expected maintenance processes (for example process_name=augenrules writing /etc/audit/audit.rules, and the package-manager binaries for your environment) or the service accounts that run them.
references:
    - https://attack.mitre.org/techniques/T1562/012/
    - https://github.com/Neo23x0/auditd/blob/master/audit.rules
    - https://man7.org/linux/man-pages/man8/auditctl.8.html
drilldown_searches:
    - name: View the detection results for - "$dest$"
      search: '%original_detection_search% | search  dest = "$dest$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
intermediate_findings:
    entities:
        - field: dest
          type: system
          score: 20
          message: Audit configuration file [$path$] was modified by process [$process_name$] on host - [$dest$], a possible attempt to weaken or disable auditing.
analytic_story:
    - Compromised Linux Host
    - Security Solution Tampering
asset_type: Endpoint
mitre_attack_id:
    - T1685.004
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1562.001/linux_auditd_audit_config_modification/linux_auditd_audit_config_modification.log
          source: auditd
          sourcetype: auditd
      test_type: unit
