name: Windows Possible Mustang Panda USB Tools
id: e66a167f-6506-4e5b-8e4d-1b04940c70be
version: 1
date: '2026-04-13'
author: Raven Tait, Splunk
status: production
type: TTP
description: 'Detects known executables used for infection or DLL Side Loading by Mutang Panda being launched from a non C:\ location. This can indicate a compromise via USB, or external storage device. This detection needs adjusted if you do not use C:\  as the root device. This detection requires process creation event logging.

'
data_source:
    - Sysmon EventID 1
search: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where Processes.process_path IN ("*CefSub.exe", "*upservice.exe", "*OleView.exe", "*mcsync.ex", "*SymantecHp.exe", "*Symantec.exe", "*browser.ex", "*HPCustParticUI.exe", "*Samvd.exe", "*rar330.exe", "*AtlTraceTool8.exe", "*piz.exe", "*scx.exe", "*mscorsvw.exe", "*dabs.ex", "*GUP.exe", "*spoololk.exe", "*FacialFeatureDemo.exe", "*Symantecs.exe", "*vivaldi.exe", "*Symantecsy.exe", "*wsc_proxy.exe", "*ygfdt.exe", "*install_.exe", "*PlugInInstallerUtility2.exe", "*melt_64.exe", "*atkexComSvcRes.exe", "*GoogleUpdate*.exe") NOT Processes.process_path="C:\\*" by Processes.process Processes.vendor_product Processes.user_id Processes.process_hash Processes.parent_process_name Processes.parent_process_exec Processes.action Processes.dest Processes.process_current_directory Processes.process_path Processes.process_integrity_level Processes.original_file_name Processes.parent_process Processes.parent_process_path Processes.parent_process_guid Processes.parent_process_id Processes.process_guid Processes.process_id Processes.user Processes.process_name | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)`| `windows_possible_mustang_panda_usb_tools_filter`'
how_to_implement: The detection is based on data that originates from Endpoint Detection and Response (EDR) agents. These agents are designed to provide security-related telemetry from the endpoints where the agent is installed. To implement this search, you must ingest logs that contain the process GUID, process name, and parent process. Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product. The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: Some legitimate tools may be run from external drives or non-C:\ locations for maintenance or portability. Adjust filters accordingly to avoid false alerts for approved usage scenarios.
references:
    - https://decoded.avast.io/threatintel/apt-treasure-trove-avast-suspects-chinese-apt-group-mustang-panda-is-collecting-data-from-burmese-government-agencies-and-opposition-groups/
drilldown_searches:
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View the detection results for - "$user$" and "$dest$"
      search: '%original_detection_search% | search  user = "$user$" dest = "$dest$"'
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View risk events for the last 7 days for - "$user$" and "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") starthoursago=168  | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
rba:
    message: Potential Possible Mustang Panda USB Tools activity observed on $dest$ via $process$.
    risk_objects:
        - field: dest
          type: system
          score: 50
    threat_objects:
        - field: parent_process_name
          type: process
tags:
    analytic_story:
        - Compromised Windows Host
    asset_type: Endpoint
    mitre_attack_id:
        - T1574.002
        - T1204.002
        - T1020
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1574.002/snapattack/snapattack.log
          source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
          sourcetype: XmlWinEventLog
