name: Linux Dirty Frag Kernel Privilege Escalation
id: 517e7bf8-d0aa-46ac-80e1-f9f498944b71
version: 1
creation_date: "2026-05-20"
modification_date: "2026-06-13"
author: Axsel Riando Soplanit, Alexander Wijaya, Matthew Roytua, Muhammad Rafdi Aufar Ahmad, Brian Stevan Ambarita, Ensign Infosecurity
status: experimental
type: TTP
description:
  The following analytic detects exploitation of Dirty Frag (CVE-2026-43284
  and CVE-2026-43500), a Linux kernel local privilege escalation vulnerability disclosed
  in May 2026 and exploited in the wild within 24 hours of public release. Dirty Frag
  is a successor to Copy Fail (CVE-2026-31431) and bypasses the Copy Fail mitigation.
  The exploit corrupts the kernel page cache via the IPsec ESP or RxRPC subsystems
  using a high-frequency splice() syscall loop, followed by a privilege transition
  to root in the same audit session. This analytic anchors on the exploit-specific
  behavioral signature observed by Microsoft Defender and validated against the public
  proof-of-concept (V4bel/dirtyfrag) in lab conditions, a sustained splice() spray
  (50 or more calls within a 60-second window) from an unprivileged process executing
  from a user-writable path (/home, /tmp, /dev/shm, /var/tmp, /run/user, /root), followed
  within 5 minutes by a setuid() syscall executed by /usr/bin/su in the same auditd
  session. The detection differs from generic privilege-escalation analytics because
  it requires the splice spray volume signature, which is not produced by normal su,
  sudo, or service workloads. The splice-on-userpath behavior is the unique behavioral
  signature that distinguishes Dirty Frag from non-exploit privilege escalation. User-mode
  EDR products do not reliably observe page-cache corruption because it occurs entirely
  in kernel mode; auditd-forwarded telemetry is the most reliable detection layer for
  this vulnerability family.
data_source:
  - Linux Auditd Syscall
search: |-
  `linux_auditd` type=SYSCALL key=dirty_frag_splice (exe="/home/*" OR exe="/tmp/*" OR exe="/var/tmp/*" OR exe="/dev/shm/*" OR exe="/run/user/*" OR exe="/root/*")
  | bin _time span=60s
  | stats count AS splice_count values(exe) AS spray_binary values(pid) AS spray_pid values(AUID) AS user earliest(_time) AS spray_start latest(_time) AS spray_end BY auid, host, ses
  | where splice_count >= 50
  | join type=inner auid, host, ses [
    search `linux_auditd` type=SYSCALL key=dirty_frag_privesc syscall=105 auid>=1000 AND auid!="4294967295" (comm=su OR exe="/usr/bin/su")
    | stats earliest(_time) AS privesc_time values(exe) AS privesc_binary values(comm) AS privesc_comm values(ppid) AS privesc_ppid BY auid, host, ses
  ]
  | eval window_secs = privesc_time - spray_end
  | where window_secs >= 0 AND window_secs <= 300
  | `security_content_ctime(spray_start)`
  | `security_content_ctime(spray_end)`
  | `security_content_ctime(privesc_time)`
  | rename host AS dest
  | table dest, user, auid, ses, spray_binary, spray_pid, splice_count, spray_start, spray_end, privesc_binary, privesc_comm, privesc_ppid, privesc_time, window_secs
  | `linux_dirty_frag_kernel_privilege_escalation_filter`
how_to_implement: This analytic requires Linux auditd telemetry forwarded to Splunk
  via the Splunk_TA_nix add-on with the linux_audit sourcetype (typically aliased
  to the linux_auditd macro). The detection depends on two non-default auditd rules
  that must be deployed on monitored Linux hosts. The required rules are documented
  in the deployment/dirty_frag_audit.rules file shipped with this analytic. The dirty_frag_splice
  rule captures splice() syscalls (audit syscall number 275) by unprivileged users
  (auid greater than or equal to 1000). The dirty_frag_privesc rule captures setuid,
  setresuid, and setreuid syscalls. These rules do not exist in default ESCU, STIG,
  or CIS Linux audit rulesets. Without them the detection cannot fire. To deploy,
  copy the rules file to /etc/audit/rules.d/dirty_frag.rules on each monitored host,
  reload with augenrules --load, and verify loading with auditctl -l grep dirty_frag.
  This deployment model is consistent with existing ESCU Linux auditd analytics that
  require specific watched paths or syscall rules to function.
known_false_positives: The splice volume threshold (50 calls per 60 seconds from a
  single process in a user-writable path) is calibrated against the V4bel public PoC,
  which produces approximately 460 splice calls in 90 seconds. Legitimate user-mode
  workloads that may produce splice() calls (web servers, mail transfer agents, language
  runtimes) typically execute from system paths (/usr/sbin, /usr/bin, /usr/lib) and
  are excluded by the user-writable path filter. Custom-compiled applications, developer
  test binaries, or container runtimes executing from /home or /tmp could theoretically
  reach the volume threshold during legitimate I/O-heavy workloads (large file copies,
  log rotation, archive operations). Operators should baseline splice volume in their
  environment before enabling as a notable event. If false positives occur, add an
  allowlist of trusted binary paths via the linux_dirty_frag_kernel_privilege_escalation_filter
  macro, or raise the splice_count threshold based on observed legitimate-workload
  baseline. The join on auid+host+ses with a 5-minute window to a setuid syscall from
  /usr/bin/su substantially reduces false positives, as legitimate high-volume splice
  workloads rarely terminate in an su invocation in the same audit session.
