name: Windows RMM Tool Installation
id: 32301cef-40e4-498b-8156-7c7c5f4ceef8
version: 1
date: '2026-04-13'
author: Raven Tait, Splunk
status: production
type: TTP
description: 'Detects file events associated with the installation of various remote access tools. Remote management tools, when used for legitimate purposes, can help IT professionals and system administrators remotely access and manage computer systems. However, threat actors may exploit these tools for malicious purposes.'
data_source:
    - Sysmon EventID 11
search: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Filesystem where Filesystem.file_path IN ("*Advanced Monitoring Agent*", "*Ammyy*", "*AnyDesk*", "*Atera*", "*chromoting*", "*FleetDeck*", "*GoToAssist*", "*GoToMyPC*", "*jumpcloud*", "*Program Files\\Level*", "*LogMeIn*", "*NinjaRMM*", "*NinjaOne*", "*Parsec*", "*PC Monitor*", "*Pulseway*", "*RealVNC*", "*\\RMan*", "*ScreenConnect*", "*Splashtop*", "*TacticalRMM*", "*TailScale*", "*TeamViewer*", "*TightVNC*", "*UltraVNC*", "*vncserver*", "*ZMAgent*", "*ZohoMeeting*", "*MeshAgent*", "*.msh*") NOT Filesystem.file_path="*\\*\\*\\*\\*" by Filesystem.dest Filesystem.file_create_time Filesystem.process_path Filesystem.process_guid Filesystem.process_id Filesystem.file_path Filesystem.action Filesystem.file_name Filesystem.user Filesystem.vendor_product | `drop_dm_object_name(Filesystem)` | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)`| `windows_rmm_tool_installation_filter`'
how_to_implement: The detection is based on data that originates from Endpoint Detection and Response (EDR) agents. These agents are designed to provide security-related telemetry from the endpoints where the agent is installed. To implement this search, you must ingest logs that contain the process GUID, process name, and parent process. Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product. The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: Legitimate IT and system administrators may trigger these detections during authorized installations of remote access tools. Filter alerts for verified administrative activities to reduce false positives.
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-320a
drilldown_searches:
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View the detection results for - "$user$" and "$dest$"
      search: '%original_detection_search% | search  user = "$user$" dest = "$dest$"'
    - name: View risk events for the last 7 days for - "$user$" and "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
rba:
    message: A process created a suspicious file at $file_path$ on $dest$
    risk_objects:
        - field: dest
          type: system
          score: 50
    threat_objects: []
tags:
    analytic_story:
        - NetSupport RMM Tool Abuse
        - Remote Monitoring and Management Software
    asset_type: Endpoint
    mitre_attack_id:
        - T1543.003
        - T1569.002
        - T1219
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1543.003/snapattack/snapattack.log
          source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
          sourcetype: XmlWinEventLog
