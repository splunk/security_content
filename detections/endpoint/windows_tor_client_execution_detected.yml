name: Windows TOR Client Execution
id: f164bc6f-ecbe-45e0-aaa6-f5c4d8c84b9a
version: 1
date: '2026-01-26'
author: Vignesh Subramanian, Splunk
status: production
type: Anomaly
description: The following analytic detects execution of the TOR Browser and related TOR components on Windows endpoints by monitoring process creation activity. Adversaries and insider threats leverage TOR to anonymize command-and-control traffic, facilitate data exfiltration, and evade network monitoring and policy enforcement. While TOR can be used for legitimate research and privacy purposes, its presence on enterprise endpoints is often unusual and should be investigated to determine intent, scope, and any associated malicious behavior.
data_source:
- Windows Event Log Security 4688
- Sysmon EventID 1
search: |
  | tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime
    from datamodel=Endpoint.Processes
    where Processes.process_name = "tor.exe"
      OR Processes.process_path = "*\\BraveSoftware\\Brave-Browser\\User Data\\*\\tor-*-win32-brave-*"
    by Processes.action
       Processes.dest
       Processes.original_file_name
       Processes.parent_process
       Processes.parent_process_exec
       Processes.parent_process_guid
       Processes.parent_process_id
       Processes.parent_process_name
       Processes.parent_process_path
       Processes.process
       Processes.process_exec
       Processes.process_guid
       Processes.process_hash
       Processes.process_id
       Processes.process_integrity_level
       Processes.process_name
       Processes.process_path
       Processes.user
       Processes.user_id
       Processes.vendor_product
  | `drop_dm_object_name(Processes)`
  | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)`
  | `windows_tor_client_execution_filter`
how_to_implement: This detection uses the Endpoint.Processes data model and it requires Windows process creation logs from Windows Security EventCode=4688 or Sysmon EventID=1. Ensure that these events are onboarded and mapped to the Endpoint.Processes data model in accordance with the Splunk Common Information Model (CIM).
known_false_positives: This detection focuses on TOR-related processes and may generate benign matches in environments where TOR is intentionally used, such as security testing, research, or lab environments.
references:
- https://unit42.paloaltonetworks.com/tor-traffic-enterprise-networks/
- https://attack.mitre.org/software/S0183/
- https://attack.mitre.org/techniques/T1090/003/
drilldown_searches:
- name: View the detection results for - "$dest$" and "$user$"
  search: '%original_detection_search% | search dest = "$dest$" user="$user$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$dest$" and "$user$"
  search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$",
    "$user$") starthoursago=168  | stats count min(_time)
    as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message)
    as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all)
    as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics"
    by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
rba:
  message: TOR client process $process_name$ was launched by parent process $parent_process_name$ on host $dest$ by the user $user$ with command line $process$
  risk_objects:
  - field: dest
    type: system
    score: 50
  - field: user
    type: user
    score: 50
  threat_objects:
  - field: parent_process_name
    type: parent_process_name
  - field: process_name
    type: process_name
  - field: process
    type: process
tags:
  analytic_story:
  - Compromised Windows Host
  - Windows Post-Exploitation
  - Command And Control
  - Data Exfiltration
  - Data Protection
  asset_type: Endpoint
  mitre_attack_id:
  - T1090.003
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: endpoint
tests:
- name: True Positive Test
  attack_data:
  - data: https://media.githubusercontent.com/media/splunk/attack_data/refs/heads/master/datasets/attack_techniques/T1090.003/windows_tor_client_execution/windows-sysmon.log
    sourcetype: XmlWinEventLog
    source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
