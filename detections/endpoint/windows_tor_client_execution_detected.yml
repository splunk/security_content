name: Windows TOR Client Execution Detected
id: 
version: 1
date: '2026-01-26'
author: Vignesh Subramanian, Splunk
status: production
type: Anomaly
description: The following analytic detects execution of TOR Browser and related TOR components on Windows endpoints by monitoring process creation activity. Adversaries and insider threats leverage TOR to anonymize their presence, evade network monitoring, and bypass security controls. Detection of TOR client execution on Windows systems can indicate attempts to hide data exfiltration, command-and-control traffic, or other policy-violating behavior. Also, TOR can be used for legitimate research, privacy, and security-testing purposes, its presence on enterprise endpoints is often unusual and should be investigated to determine intent, scope, and any associated malicious behavior.
data_source:
- Windows Event Log Security 4688
- Sysmon EventID 1
search: "| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)\
  \ as lastTime from datamodel=Endpoint.Processes where Processes.process_name=\"\
  tor.exe\" OR Processes.process_name=\"*tor*\" AND Processes.parent_process_name\
  \ IN (\"firefox.exe\",\"brave.exe\",\"cmd.exe\",\"powershell.exe\") by Processes.action\
  \ Processes.dest Processes.original_file_name Processes.parent_process Processes.parent_process_exec\
  \ Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name\
  \ Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid\
  \ Processes.process_hash Processes.process_id Processes.process_integrity_level\
  \ Processes.process_name Processes.process_path Processes.user Processes.user_id\
  \ Processes.vendor_product \n| `drop_dm_object_name(Processes)` \n| `security_content_ctime(firstTime)`\n\
  | `security_content_ctime(lastTime)` | `windows_tor_client_execution_detected_filter`"
how_to_implement: This detection uses the Endpoint.Processes data model and it requires Windows process creation logs from Windows Security EventCode=4688 or Sysmon EventID=1. Ensure that these events are onboarded and mapped to the Endpoint.Processes data model in accordance with the Splunk Common Information Model (CIM).
known_false_positives: This detection focuses on TOR-related processes and may generate benign matches in environments where TOR is intentionally used, such as security testing, research, or lab environments.
references:
- https://unit42.paloaltonetworks.com/tor-traffic-enterprise-networks/
- https://attack.mitre.org/software/S0183/
- https://attack.mitre.org/techniques/T1090/003/
drilldown_searches:
- name: View the detection results for - "$dest$"" and "$user$"
  search: '%original_detection_search% | search dest = "$dest$" user="$user$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$dest$" and "$user$"
  search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$",
    "$user$") starthoursago=168  | stats count min(_time)
    as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message)
    as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all)
    as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics"
    by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
rba:
  message: TOR client execution process detected on host $dest$ by user $user$
  risk_objects:
  - field: dest
    type: system
    score: 25
  - field: user
    type: user
    score: 25
  threat_objects:
  - field: parent_process_name
    type: parent_process_name
  - field: process_name
    type: process_name
tags:
  analytic_story:
  - Compromised Windows Host
  - Windows Post-Exploitation
  - Command And Control
  - Data Exfiltration
  - Data Protection
  asset_type: Endpoint
  mitre_attack_id:
  - T1090.003
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: endpoint
tests:
- name: True Positive Test
  attack_data:
  - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1090.003/windows_tor_client_execution/windows-sysmon.log
    sourcetype: XmlWinEventLog
    source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational