name: Windows Possible DCSync attack
id: bdfb293e-e3ba-4890-acae-21d112396315
version: 1
date: '2026-04-13'
author: Raven Tait, Splunk
status: production
type: TTP
description: "The rule detect a access by a non-machine account to an AD object (stored credentials) with properties of DS-Replication-Get-Changes or DS-Replication-Get-Changes-All and Domain-DNS class WRITE_DAC."
data_source:
    - Windows Event Log Security 4662
search: '`wineventlog_security` EventID=4662 NOT SubjectUserName="*$" Properties IN ("*1131f6ad-9c07-11d1-f79f-00c04fc2dcd2*", "*1131f6aa-9c07-11d1-f79f-00c04fc2dcd2*") Properties="*19195a5b-6da0-11d0-afd3-00c04fd930c9*" | fillnull | stats count by Computer, SubjectUserName, EventID, Properties | rename Computer as dest| `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)`| `windows_possible_dcsync_attack_filter`'
how_to_implement: The detection is based on data that originates from Endpoint Detection and Response (EDR) agents. These agents are designed to provide security-related telemetry from the endpoints where the agent is installed. To implement this search, you must ingest logs that contain the process GUID, process name, and parent process. Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product. The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: Legitimate server promotions to Domain Controllers by Domain or Enterprise Admins may trigger this detection. Filter these events for approved administrative activities.
references:
    - https://www.linkedin.com/pulse/mimikatz-dcsync-event-log-detections-john-dwyer
drilldown_searches:
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View the detection results for - "$user$" and "$dest$"
      search: '%original_detection_search% | search  user = "$user$" dest = "$dest$"'
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View risk events for the last 7 days for - "$user$" and "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") starthoursago=168  | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
rba:
    message: Potential Possible DCSync attack activity observed on $dest$.
    risk_objects:
        - field: dest
          type: system
          score: 50
    threat_objects: []
tags:
    analytic_story:
        - Active Directory Privilege Escalation
        - Active Directory Lateral Movement
        - Sneaky Active Directory Persistence Tricks
        - Credential Dumping
    asset_type: Endpoint
    mitre_attack_id:
        - T1003.006
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003.006/snapattack/snapattack.log
          source: XmlWinEventLog:Security
          sourcetype: XmlWinEventLog
