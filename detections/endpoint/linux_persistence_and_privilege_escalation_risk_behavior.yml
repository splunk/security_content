name: Linux Persistence and Privilege Escalation Risk Behavior
id: ad5ac21b-3b1e-492c-8e19-ea5d5e8e5cf1
version: 8
date: '2025-05-02'
author: Michael Haag, Splunk
status: production
type: Correlation
description: The following analytic identifies potential Linux persistence and privilege
  escalation activities. It leverages risk scores and event counts from various Linux-related
  data sources, focusing on tactics associated with persistence and privilege escalation.
  This activity is significant for a SOC because it highlights behaviors that could
  allow an attacker to maintain access or gain elevated privileges on a Linux system.
  If confirmed malicious, this activity could enable an attacker to execute code with
  higher privileges, persist in the environment, and potentially access sensitive
  information, posing a severe security risk.
data_source: []
search: |
  | tstats `summariesonly` `common_fbd_fields`
      values(All_Risk.threat_object) AS threat_object
      from datamodel=Risk.All_Risk
      ```replace the where clause with with | genratetimerange ```
      where earliest="-30d@d" latest="now"
      (All_Risk.analyticstories IN ("Linux Privilege Escalation","Linux Persistence Techniques") OR source="*Linux*")
      All_Risk.annotations.mitre_attack.mitre_tactic IN ("persistence","privilege-escalation")
      All_Risk.risk_object_type="system"
      by All_Risk.normalized_risk_object All_Risk.risk_object_type index 
  | `get_mitre_annotations` 
  | rename All_Risk.normalized_risk_object AS normalized_risk_object All_Risk.risk_object_type AS risk_object_type 
  | `generate_findings_summary` 
  | stats list(*) AS * limit=100
      sum(int_risk_score_sum) AS risk_score
      by `fbd_grouping(normalized_risk_object, risk_object_type)` 
  | `dedup_and_compute_common_fbd_fields`,
      annotations.mitre_attack = mvdedup('annotations.mitre_attack'),
      annotations.mitre_attack.mitre_tactic = mvdedup('annotations.mitre_attack.mitre_tactic'),
      mitre_tactic_id_count = mvcount('annotations.mitre_attack.mitre_tactic'),
      annotations.mitre_attack.mitre_technique_id = mvdedup('annotations.mitre_attack.mitre_technique_id'),
      mitre_technique_id_count = mvcount('annotations.mitre_attack.mitre_technique_id'),
      threat_object = mvdedup(threat_object)
      | fillnull value=0 mitre_tactic_id_count mitre_technique_id_count threat_object
  | fields - int_risk_score_sum int_findings_count contributing_event_ids
  | `drop_dm_object_name("All_Risk")`
  | where source_count >= 4
  | table `common_fbd_fields_results`, mitre_tactic_id_count, mitre_technique_id_count, source_count
  | `linux_persistence_and_privilege_escalation_risk_behavior_filter`
how_to_implement: Ensure Linux anomaly and TTP analytics are enabled. TTP may be set
  to finding  for point detections, anomaly should not be findings but risk generators.
  The correlation relies on more than x amount of distict detection names generated
  before generating a finding. Modify the value as needed. Default value is set to
  4. This value may need to be increased based on activity in your environment.
known_false_positives: False positives will be present based on many factors. Tune
  the correlation as needed to reduce too many triggers.
references:
- https://attack.mitre.org/tactics/TA0004/
drilldown_searches:
- name: View the detection results for - "$fbd_group_by$"
  search: '%original_detection_search% | search  fbd_group_by = "$fbd_group_by$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$fbd_group_by$"
  search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$fbd_group_by$")
    starthoursago=168  | stats count min(_time) as firstTime max(_time) as lastTime
    values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories)
    as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic)
    as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
fbd:
  input_type: custom-fbd
tags:
  analytic_story:
  - Linux Privilege Escalation
  - Linux Persistence Techniques
  asset_type: Endpoint
  mitre_attack_id:
  - T1548
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: audit
tests:
- name: True Positive Test
  attack_data:
  - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1548/linux_risk/linuxrisk.log
    source: linuxrisk
    sourcetype: stash
