    - Black Basta Ransomware
    - Cactus Ransomware
    - CISA AA22-264A
    - CISA AA23-347A
    - CISA AA24-241A
    - IcedID
    - RedLine Stealer
    - Ryuk Ransomware
    - Salat Stealer
