name: Linux Auditd eBPF Program Load
id: b469bd55-6398-4be5-ba23-c077f673d5f3
version: 1
creation_date: '2026-10-31'
modification_date: '2026-11-02'
author: vahid malekmohammadi
status: production
type: Anomaly
description: |-
  The following analytic detects a process loading an eBPF program via the bpf() syscall (BPF_PROG_LOAD) from a user-controlled or world-writable directory (/home, /root, /tmp, /var/tmp, /dev/shm, /run/user) on a Linux host, using Linux Auditd.
  eBPF lets a privileged process attach probes to kernel and userland functions; adversaries abuse it to hook authentication routines and steal credentials - for example pamspy attaches a uprobe to pam_get_authtok in libpam to capture plaintext passwords during sshd, sudo and su authentication - and to build stealthy rootkits and backdoors.
data_source:
    - Linux Auditd Syscall
search: |-
    `linux_auditd` type=SYSCALL SYSCALL=bpf success=yes
      | rename host as dest
      | eval bpf_cmd=case(a0 IN ("5","0x5","BPF_PROG_LOAD"),"BPF_PROG_LOAD", true(),"other:".a0)
      | where bpf_cmd="BPF_PROG_LOAD"
      | stats count min(_time) as firstTime max(_time) as lastTime
        BY comm exe bpf_cmd uid auid ppid pid key dest
      | `security_content_ctime(firstTime)`
      | `security_content_ctime(lastTime)`
      | `linux_auditd_ebpf_program_load_filter`
how_to_implement: |-
  To implement this detection, the process begins by ingesting auditd data, that consist SYSCALL, TYPE, EXECVE and PROCTITLE events, which captures command-line executions and process details on Unix/Linux systems. These logs should be ingested and processed using Splunk Add-on for Unix and Linux (https://splunkbase.splunk.com/app/833), which is essential for correctly parsing and categorizing the data. The next step involves normalizing the field names  to match the field names set by the Splunk Common Information Model (CIM) to ensure consistency across different data sources and enhance the efficiency of data modeling. This approach enables effective monitoring and detection of Linux endpoints where auditd is deployed
known_false_positives: |-
  Developers and security engineers building or testing eBPF tooling (bpftrace, bcc, libbpf-based programs, custom or research builds) from home directories, /tmp or build output folders, eBPF test and CI jobs that execute from temporary workspaces, and administrators running unpackaged eBPF agents or troubleshooting tools from /root or /home can load eBPF programs from these paths.
  Update the filter macro to allowlist the specific executables, accounts (uid/auid) or hosts that legitimately run eBPF tooling from these locations.
references:
    - https://attack.mitre.org/techniques/T1556/003/
    - https://attack.mitre.org/techniques/T1003/
    - https://github.com/citronneur/pamspy
    - https://www.elastic.co/guide/en/security/current/bpf-program-or-map-load-via-bpftool.html
    - https://man7.org/linux/man-pages/man2/bpf.2.html
drilldown_searches:
    - name: View the detection results for - "$dest$"
      search: '%original_detection_search% | search  dest = "$dest$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
intermediate_findings:
    entities:
        - field: dest
          type: system
          score: 56
          message: Process [$comm$] (pid $pid$) loaded an eBPF program (BPF_PROG_LOAD) on host - [$dest$].
analytic_story:
    - Linux Rootkit
    - Linux Post-Exploitation
    - Compromised Linux Host
asset_type: Endpoint
mitre_attack_id:
    - T1556.003
    - T1003
    - T1014
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1556.003/linux_auditd_ebpf/linux_auditd_ebpf.log
          source: auditd
          sourcetype: auditd
      test_type: unit
