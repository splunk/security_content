name: Windows Defender ASR Block Events
id: 026f5f4e-e99f-4155-9e63-911ba587300b
version: 11
creation_date: '2023-12-06'
modification_date: '2026-09-22'
author: Michael Haag, Splunk
status: production
type: Anomaly
description: |-
    This detection searches for ASR block events that are generated when a process or application attempts to perform an action that is blocked by an ASR rule.
    Typically, these will be enabled in block most after auditing and tuning the ASR rules themselves.
data_source:
    - Windows Event Log Defender 1121
    - Windows Event Log Defender 1126
    - Windows Event Log Defender 1129
    - Windows Event Log Defender 1131
    - Windows Event Log Defender 1133
search: |-
    `ms_defender`
    EventCode IN (
        1121,
        1126,
        1129,
        1131,
        1133
    )
    | fillnull
    | stats count min(_time) as firstTime
                  max(_time) as lastTime
      by host EventCode
         Parent_Commandline Process_Name Target_Commandline
         Path ID RuleType

    | lookup local=t asr_rules ID OUTPUT ASR_Rule

    | rename host as dest

    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `windows_defender_asr_block_events_filter`
how_to_implement: |-
    The following analytic requires collection of Windows Defender Operational logs in either XML or multi-line. To collect, setup a new input for the Windows Defender Operational logs. In addition, it does require a lookup that maps the ID to ASR Rule name. Note that Audit and block Event IDs have different fields, therefore the analytic will need to be modified for each type of event.
known_false_positives: |-
    Some false positives are expected initially as the ASR rules are tuned and configured.
references:
    - https://asrgen.streamlit.app/
    - https://learn.microsoft.com/en-us/defender-endpoint/attack-surface-reduction-rules-overview
drilldown_searches:
    - name: View the detection results for - "$dest$"
      search: '%original_detection_search% | search  dest = "$dest$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
intermediate_findings:
    entities:
        - field: dest
          type: system
          score: 20
          message: The ASR block event [$ASR_Rule$] was triggered on [$dest$].
threat_objects:
    - field: Parent_Commandline
      type: parent_process
    - field: Target_Commandline
      type: process
    - field: Process_Name
      type: file_path
analytic_story:
    - Windows Attack Surface Reduction
asset_type: Endpoint
mitre_attack_id:
    - T1059
    - T1566.001
    - T1566.002
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1059/defender/asr_block.log
          source: XmlWinEventLog:Microsoft-Windows-Windows Defender/Operational
          sourcetype: XmlWinEventLog
      test_type: unit
