name: Cisco Secure EP - Shadow Storage Cap Attempt Before File Rename
id: 47db6eae-484e-4516-ac4c-b17226554393
version: 1
creation_date: '2026-11-27'
modification_date: '2026-11-27'
author: Nasreddine Bencherchali, Splunk
status: production
type: TTP
description: |-
    This analytic detects a vssadmin command setting shadow-copy storage to 401MB followed by a file rename with a ransomware-associated extension, by correlating two Cisco Secure Endpoint Behavioral Protection alerts on the same endpoint and actor.
    The shadow-storage signature also matches /maxsize=unbounded; this correlation selects 401MB because unbounded does not indicate a storage cap. The sequence can indicate an attempt to limit recovery before destructive file changes, but the alerts do not prove the resize succeeded, reduced a previous limit, or that the file was encrypted.
data_source:
    - Cisco Secure Endpoint Behavioral Protection Threat Detection
search: |-
    `cisco_secure_endpoint`
    event_type="Threat Detection"

    | `cisco_secure_endpoint_extract_bp_fields`

    | where sig_id IN ("20211007120302","20250710215511")

    | spath path=bp_data.details.matched_activity.events{0}.process:start.cmd_line output=process_command
    | spath path=bp_data.details.matched_activity.events{0}.file:move.path output=moved_path
    | spath path=bp_data.details.matched_activity.events{0}.file:move.name output=moved_name
    | spath path=bp_data.details.matched_activity.events{0}.file:move.old_name output=original_name
    | spath path=bp_data.details.matched_activity.events{0}.file:move.user.name output=moved_user

    | rex field=process_command "(?i)/maxsize\s*=\s*(?<shadow_storage_size>401MB|unbounded)\b"

    | eval shadow_storage_size=lower(shadow_storage_size)

    | eval stage=case(sig_id="20211007120302","recovery",
               sig_id="20250710215511","file")

    | where stage="file" OR shadow_storage_size="401mb"

    | eval user=coalesce(user,moved_user,"unknown"),
           event_time=tonumber(timestamp)+tonumber(timestamp_nanoseconds)/1000000000

    | where isnotnull(endpoint_guid)
            AND isnotnull(event_time)
            AND (stage="recovery" OR isnotnull(moved_name))

    | stats max(eval(if(stage="recovery",event_time,null()))) as recovery_time
            max(eval(if(stage="file",event_time,null()))) as file_time
            values(eval(if(stage="recovery",process_command,null()))) as recovery_command
            values(eval(if(stage="recovery",shadow_storage_size,null()))) as shadow_storage_size
            values(eval(if(stage="file",moved_path,null()))) as moved_path
            values(eval(if(stage="file",moved_name,null()))) as moved_name
            values(eval(if(stage="file",original_name,null()))) as original_name
            values(dest) as dest
      by endpoint_guid user

    | where isnotnull(recovery_time)
            AND isnotnull(file_time)
            AND recovery_time<=file_time
            AND file_time-recovery_time<=30

    | eval recovery_command=mvindex(recovery_command,0),
           shadow_storage_size=mvindex(shadow_storage_size,0),
           affected_file=mvindex(moved_path,0)."\\".mvindex(moved_name,0),
           firstTime=recovery_time,
           lastTime=file_time

    | rex field=recovery_command "(?i)/for=(?<shadow_volume>[A-Za-z]:)"

    | table dest user endpoint_guid shadow_volume shadow_storage_size recovery_command original_name affected_file
            firstTime lastTime
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `cisco_secure_endpoint___shadow_storage_cap_attempt_before_file_rename_filter`
how_to_implement: |-
    This search requires Cisco Secure Endpoint Behavioral Protection Threat Detection alerts, which include event_type="Threat Detection".
    This search uses an input macro named `cisco_secure_endpoint`.
    We strongly recommend that you specify your environment-specific configurations (index, source, sourcetype, etc.) for Cisco Secure Endpoint Behavioral Protection Threat Detection alerts.
    Replace the macro definition with configurations for your Splunk environment.
    The `cisco_secure_endpoint_extract_bp_fields` macro extracts the common signature, endpoint, and actor fields used by this search.
    The search also uses a post-filter macro designed to filter out known false positives.
    The logs are to be ingested using the Cisco Security Cloud App for Splunk (https://splunkbase.splunk.com/app/7404).
known_false_positives: >-
    Approved backup maintenance can set shadow storage to 401MB, and software can rename a file with a .chaos extension. Review the actor, change record, executable, file content, and whether the two actions affected the same volume. The BP alerts do not establish that the resize succeeded or that both actions used the same volume.
references:
    - https://docs.amp.cisco.com/en/SecureEndpoint/Secure%20Endpoint%20User%20Guide.pdf
    - https://attack.mitre.org/techniques/T1490/
    - https://attack.mitre.org/techniques/T1486/
drilldown_searches:
    - name: View BP Activity for - $dest$
      search: |-
        `cisco_secure_endpoint` event_type="Threat Detection"
        | spath path=computer.connector_guid output=endpoint_guid
        | search endpoint_guid="$endpoint_guid$"
        | spath path=bp_data.details.sig_id output=sig_id
        | spath path=bp_data.remediated output=remediated
        | spath path=bp_data.details.matched_activity.events{0}.process:start.cmd_line output=process_command
        | spath path=bp_data.details.matched_activity.events{0}.script:execution.cmd_line output=script_command
        | eval observed_command=coalesce(process_command,script_command)
        | table _time detection severity sig_id remediated observed_command _raw
        | sort - _time
      earliest_offset: 7d
      latest_offset: "0"
    - name: View Cloud IOC Activity for - $dest$
      search: |-
        `cisco_secure_endpoint` event_type="Cloud IOC"
        | spath path=computer.connector_guid output=endpoint_guid
        | search endpoint_guid="$endpoint_guid$"
        | spath path=cloud_ioc.short_description output=ioc_name
        | spath path=cloud_ioc.description output=ioc_description
        | spath path=command_line.arguments output=process_command
        | spath path=file.file_name output=file_name
        | spath path=file.file_path output=file_path
        | spath path=file.identity.sha256 output=file_sha256
        | eval activity_time=strftime(tonumber(coalesce(start_timestamp,timestamp)),"%Y-%m-%d %H:%M:%S")
        | table _time activity_time ioc_name severity process_command file_name file_path file_sha256 ioc_description _raw
        | sort - _time
      earliest_offset: 7d
      latest_offset: "0"
    - name: View risk events for the last 7 days for - "$user$"
      search: |-
        | from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
      earliest_offset: 7d
      latest_offset: "0"
finding:
    title: Shadow storage cap attempt before suspicious rename on $dest$
    entity:
        field: dest
        type: system
        score: 50
threat_objects:
    - field: affected_file
      type: file_path
    - field: recovery_command
      type: command
analytic_story:
    - Compromised Windows Host
    - Windows Post-Exploitation
asset_type: Endpoint
mitre_attack_id:
    - T1490
    - T1486
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test - Cisco Secure Endpoint BP
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_secure_endpoint/behavioral_protection/recovery_storage_reduced_before_encrypted_file_activity/cisco_se.log
          source: not_applicable
          sourcetype: cisco:se
      test_type: unit
