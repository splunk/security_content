name: Windows SapphireStealer Indicators
id: d2937c0c-1b3e-41ea-994e-4545c97bc9e9
version: 1
date: '2026-04-13'
author: Raven Tait, Splunk
status: production
type: Anomaly
description: |-
    Detects file indicators associated with SapphireStealer malware.
    SapphireStealer is an information stealer that was written in .NET.
    It offers straightforward but effective functionality capable of stealing sensitive information from infected systems.
    It's built on DotNet and requires the DotNetZip.dll to also be on the host in the same location as the main executable.
    It creates several temporary files in the LocalTemp directory as it performs data extraction.
data_source:
    - Sysmon EventID 11
search: |-
    | tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Filesystem where Filesystem.file_path IN ("*\\AppData\\Local\\Temp\\sapphire*", "*\\AppData\\Local\\Temp\\DotNetZip*", "*\\AppData\\Local\\Temp\\log.zip*", "*Sapphire.exe*") by Filesystem.dest Filesystem.file_create_time Filesystem.process_path Filesystem.process_guid Filesystem.process_id Filesystem.file_path Filesystem.file_name Filesystem.user Filesystem.vendor_product Filesystem.action
    | `drop_dm_object_name(Filesystem)`
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `windows_sapphirestealer_indicators_filter`
how_to_implement: The detection is based on data that originates from Endpoint Detection and Response (EDR) agents. These agents are designed to provide security-related telemetry from the endpoints where the agent is installed. To implement this search, you must ingest logs that contain the process GUID, process name, and parent process. Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product. The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: Some legitimate security tools and software updates may create or modify similar temporary files in the LocalTemp directory. Verify detections against approved application usage to reduce false positives.
references:
    - https://blog.talosintelligence.com/sapphirestealer-goes-open-source/
    - https://github.com/0day2/SapphireStealer
    - https://www.securityweek.com/threat-actors-adopt-modify-open-source-sapphirestealer-information-stealer/
    - https://thehackernews.com/2023/08/sapphirestealer-malware-gateway-to.html
drilldown_searches:
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View the detection results for - "$user$" and "$dest$"
      search: '%original_detection_search% | search  user = "$user$" dest = "$dest$"'
    - name: View risk events for the last 7 days for - "$user$" and "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
rba:
    message: A process created a suspicious file at $file_path$ on $dest$
    risk_objects:
        - field: dest
          type: system
          score: 20
    threat_objects: []
tags:
    analytic_story:
        - Windows Post-Exploitation
    asset_type: Endpoint
    mitre_attack_id:
        - T1555.003
        - T1113
        - T1033
        - T1589
        - T1020
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1555.003/snapattack/snapattack.log
          source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
          sourcetype: XmlWinEventLog
