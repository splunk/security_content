name: Registry Keys Used For Persistence
id: f5f6af30-7aa7-4295-bfe9-07fe87c01a4b
version: 36
creation_date: '2020-04-29'
modification_date: '2026-11-23'
author: Jose Hernandez, David Dorsey, Teoderick Contreras, Rod Soto, Splunk
status: production
type: Anomaly
description: |-
    The following analytic identifies modifications to registry keys commonly used for persistence mechanisms. It leverages data from endpoint detection sources like Sysmon or Carbon Black, focusing on specific registry paths known to initiate applications or services during system startup.
    This activity is significant as unauthorized changes to these keys can indicate attempts to maintain persistence or execute malicious actions upon system boot.
    If confirmed malicious, this could allow attackers to achieve persistent access, execute arbitrary code, or maintain control over compromised systems, posing a severe threat to system integrity and security.
data_source:
    - Sysmon EventID 13
search: |-
    | tstats `security_content_summariesonly`
      count min(_time) as firstTime
            max(_time) as lastTime

    FROM datamodel=Endpoint.Registry where

    Registry.action = "modified"

    Registry.registry_path IN (
        "*\\Classes\\htmlfile\\shell\\open\\command",
        "*\\CurrentControlSet\\Control\\Lsa\\OSConfig\\Security Packages",
        "*\\CurrentControlSet\\Control\\Lsa\\Security Packages",
        "*\\CurrentControlSet\\Control\\Session Manager\\BootExecute",
        "*\\CurrentVersion\\Explorer\\SharedTaskScheduler",
        "*\\CurrentVersion\\Explorer\\Shell Folders\\*",
        "*\\CurrentVersion\\Explorer\\StartupApproved\\Run",
        "*\\CurrentVersion\\Explorer\\User Shell Folders\\*",
        "*\\CurrentVersion\\Image File Execution Options\\*\\Debugger",
        "*\\CurrentVersion\\policies\\explorer\\run*",
        "*\\CurrentVersion\\Run*",
        "*\\CurrentVersion\\RunOnce",
        "*\\CurrentVersion\\RunServices*",
        "*\\CurrentVersion\\SilentProcessExit\\*",
        "*\\CurrentVersion\\Svchost\\*",
        "*\\CurrentVersion\\Windows\\Appinit_Dlls*",
        "*\\CurrentVersion\\Windows\\Load",
        "*\\CurrentVersion\\Winlogon\\Notify*",
        "*\\CurrentVersion\\Winlogon\\Shell*",
        "*\\CurrentVersion\\Winlogon\\Userinit*",
        "*\\CurrentVersion\\Winlogon\\VmApplet*",
        "*\\SOFTWARE\\Microsoft\\Netsh\\*"
    )

    by Registry.action Registry.dest Registry.process_guid Registry.process_id
       Registry.registry_hive Registry.registry_path Registry.registry_key_name
       Registry.registry_value_data Registry.registry_value_name Registry.registry_value_type
       Registry.status Registry.user Registry.vendor_product

    | `drop_dm_object_name(Registry)`

    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `registry_keys_used_for_persistence_filter`
how_to_implement: |-
    To successfully implement this search, you must be ingesting data that records registry activity from your hosts to populate the endpoint data model in the registry node. This is typically populated via endpoint detection-and-response product, such as Carbon Black or endpoint data sources, such as Sysmon. The data used for this search is typically generated via logs that report reads and writes to the registry.
known_false_positives: |-
    There are many legitimate applications that must execute on system startup and will use these registry keys to accomplish that task.
references:
    - https://github.com/redcanaryco/atomic-red-team/blob/388942adbd9641f4dfdcf079d7efe9a75ec0ac43/atomics/T1547.001/T1547.001.yaml#L5
drilldown_searches:
    - name: View the detection results for - "$dest$" and "$user$"
      search: '%original_detection_search% | search  dest = "$dest$" user = "$user$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$" and "$user$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$", "$user$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: '0'
intermediate_findings:
    entities:
        - field: dest
          type: system
          score: 20
          message: A registry entry [$registry_path$] in a location commonly used for persistence was modified on [$dest$] by [$user$] with the value [$registry_value_data$].
threat_objects:
    - field: registry_value_data
      type: registry_value_text
