name: Credential Dumping via Symlink to Shadow Copy New
id: 01875260-5532-4639-af5d-ec86e1614587
version: 1
date: '2025-11-10'
author: PB
description: "The following analytic detects instances of credential dumping through the use of symbolic links that target volume shadow copies. It identifies this illicit behavior by searching for processes that execute the `mklink` command in association with `HarddiskVolumeShadowCopy`, analyzing various attributes of the process, including its parent process and execution details. \n\nDetecting this behavior is crucial for a Security Operations Center (SOC) as credential dumping is a common tactic employed by attackers to gain access to sensitive information, leading to unauthorized access to accounts and data. These attacks can facilitate further malicious actions, such as lateral movement within the network, data exfiltration, or even complete system compromise. \n\nThe impact of credential dumping can be severe, resulting in significant financial loss, severe reputational damage, and regulatory repercussions for affected organizations. Therefore, timely identification and response\
  \ to this behavior can significantly mitigate risks associated with credential theft and enhance overall cybersecurity posture."
data_source:
- Sysmon EventID 1
- Windows Event Log Security 4688
- CrowdStrike ProcessRollup2
type: TTP
status: production
tags:
  analytic_story:
  - Credential Dumping
  asset_type: Endpoint
  mitre_attack_id:
  - T1003.003
  product:
  - Splunk Enterprise Security
  security_domain: endpoint
search: "| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)\n  as lastTime from datamodel=Endpoint.Processes where `process_cmd` Processes.process=*mklink*\n  Processes.process=*HarddiskVolumeShadowCopy* by Processes.action Processes.dest\n  Processes.original_file_name Processes.parent_process Processes.parent_process_exec\n  Processes.parent_process_guid Processes.parent_process_id Processes.parent_process_name\n  Processes.parent_process_path Processes.process Processes.process_exec Processes.process_guid\n  Processes.process_hash Processes.process_id Processes.process_integrity_level Processes.process_name\n  Processes.process_path Processes.user Processes.user_id Processes.vendor_product\n  | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)`\n  | `credential_dumping_via_symlink_to_shadow_copy_new_filter`"
how_to_implement: None
known_false_positives: None
references: null
rba:
  message: An instance of $parent_process_name$ spawning $process_name$ was identified on endpoint $dest$ by user $user$ attempting to create symlink to a shadow copy to grab credentials.
  risk_objects:
  - field: user
    type: user
    score: 81
  - field: dest
    type: system
    score: 81
  threat_objects: []
tests:
- name: True Positive Test
  attack_data:
  - data: https://media.githubusercontent.com/media/splunk/attack_data/master/attack_techniques/T1003.003/credential-dumping-via-symlink/data.log
    source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
    sourcetype: XmlWinEventLog
drilldown_searches:
- name: View the detection results for - "$user$" and "$dest$"
  search: '%original_detection_search% | search  user = "$user$" dest = "$dest$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$user$" and "$dest$"
  search: "| from datamodel Risk.All_Risk | search normalized_risk_object IN (\"$user$\",\n      \"$dest$\") starthoursago=168  | stats count min(_time) as firstTime max(_time)\n      as lastTime values(search_name) as \"Search Name\" values(risk_message) as \"Risk\n      Message\" values(analyticstories) as \"Analytic Stories\" values(annotations._all)\n      as \"Annotations\" values(annotations.mitre_attack.mitre_tactic) as \"ATT&CK Tactics\"\n      by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`"
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
