name: Windows NirSoft Utilities
id: 5b2f4596-7d4c-11ec-88a7-acde48001122
version: 11
creation_date: '2022-01-24'
modification_date: '2026-10-01'
author: Michael Haag, Onur Mustafa Erdogan, Splunk
status: production
type: Anomaly
description: |
    The following analytic identifies the execution of commonly used NirSoft utilities on Windows systems.
    This activity is significant for a SOC because NirSoft utilities, while legitimate, can be used by adversaries for malicious purposes like credential theft or system reconnaissance.
    If confirmed malicious, this activity could lead to unauthorized access, data exfiltration, or further system compromise.
    Note that this search does not use a where clause to filter out known benign paths, as NirSoft utilities can be executed from various locations. This might hinder performance in environments with high data volumes.
    Apply additional filtering as necessary to enhance this.
data_source:
    - Sysmon EventID 1
search: |
    `sysmon` EventID=1
    ( Company=nirsoft OR 
      [
        | inputlookup nirsoft_utilities_lookup.csv
        | search original_file_name=*.exe
        | table original_file_name
      ]
    )
    | stats count by dest original_file_name parent_process parent_process_guid parent_process_id parent_process_name parent_process_path
        process process_guid process_id process_hash process_integrity_level process_name process_path user user_id vendor_product
    | lookup local=t nirsoft_utilities_lookup original_file_name OUTPUT description
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `windows_nirsoft_utilities_filter`
how_to_implement: |-
    To successfully implement this search, you need to be ingesting process creation events from your endpoints using Sysmon.
    These logs must be processed using the latest Sysmon Technical Add-on (https://splunkbase.splunk.com/app/5709).
known_false_positives: False positives may be present. Filtering may be required before setting to alert.
references:
    - https://www.cisa.gov/uscert/ncas/alerts/TA18-201A
    - http://www.nirsoft.net/
    - https://www.microsoft.com/security/blog/2022/01/15/destructive-malware-targeting-ukrainian-organizations/
drilldown_searches:
    - name: View the detection results for - "$dest$"
      search: '%original_detection_search% | search  dest = "$dest$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
intermediate_findings:
    entities:
        - field: dest
          type: system
          score: 20
          message: NirSoft tool [$process_name$] was executed on host [$dest$]. This utility [$description$].
threat_objects:
    - field: process_name
      type: process_name
analytic_story:
    - Data Destruction
    - WhisperGate
    - Unusual Processes
asset_type: Endpoint
mitre_attack_id:
    - T1588.002
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1588.002/atomic_red_team/windows-sysmon.log
          source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
          sourcetype: XmlWinEventLog
      test_type: unit
