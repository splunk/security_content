name: Windows Execution of Local LLM Framework
id: 2397d00a-cfd3-46e1-ba73-dee6d8ba1d0c
version: 1
date: '2025-11-12'
author: Rod Soto
status: production
type: Hunting
description: Detects execution of local Large Language Model (LLM) frameworks on Windows endpoints by monitoring Windows Security Event Log 4688 (Process Creation) for known LLM tools and AI/ML libraries. This hunting detection identifies shadow AI deployments and unauthorized local model inference operations by analyzing process execution patterns, command-line arguments, and parent process relationships for frameworks including Ollama, LM Studio, GPT4All, Jan, llama.cpp, KoboldCPP, NutStudio, and Python-based libraries such as HuggingFace Transformers and LangChain. The search leverages pre-extracted fields from the Splunk Add-on for Microsoft Windows to classify framework types and correlate process activity with potential security risks including data exfiltration through local AI processing, policy violations from unapproved AI usage, and decentralized AI deployments that bypass enterprise governance. Organizations can use this detection to gain visibility into local LLM infrastructure, identify users downloading or executing AI frameworks outside approved channels, and detect potential intellectual property risks from processing sensitive data through unmonitored local models.
data_source:
- Windows Event Log Security 4688
search: |
  `wineventlog_security` EventCode=4688 
  (NewProcessName="*ollama*" OR 
   NewProcessName="*llama*" OR 
   NewProcessName="*llama-run*" OR
   NewProcessName="*gpt4all*" OR 
   NewProcessName="*lmstudio*" OR 
   NewProcessName="*nutstudio*" OR
   NewProcessName="*koboldcpp*" OR 
   NewProcessName="*jan*" OR 
   NewProcessName="*jan.exe*" OR
   CommandLine="*transformers*" OR 
   CommandLine="*langchain*" OR 
   CommandLine="*huggingface*" OR
   CommandLine="*llama-run*" OR
   CommandLine="*nutstudio*" OR
   ParentProcessName="*ollama*" OR
   ParentProcessName="*lmstudio*" OR
   ParentProcessName="*nutstudio*" OR
   ParentProcessName="*gpt4all*" OR
   ParentProcessName="*jan*" OR
   ParentProcessName="*llama-run*")
  | eval host=Computer
  | eval Framework=case(
      like(NewProcessName, "%ollama%") OR like(ParentProcessName, "%ollama%"), "Ollama",
      like(NewProcessName, "%lmstudio%") OR like(NewProcessName, "%LM Studio%") OR like(ParentProcessName, "%lmstudio%"), "LM Studio",
      like(NewProcessName, "%nutstudio%") OR like(ParentProcessName, "%nutstudio%") OR like(CommandLine, "%nutstudio%"), "NutStudio",
      like(NewProcessName, "%gpt4all%") OR like(ParentProcessName, "%gpt4all%"), "GPT4All",
      like(NewProcessName, "%jan%") OR like(ParentProcessName, "%jan%") OR like(NewProcessName, "%jan.exe%"), "Jan",
      like(NewProcessName, "%koboldcpp%") OR like(CommandLine, "%koboldcpp%"), "KoboldCPP",
      like(NewProcessName, "%llama-run%") OR like(ParentProcessName, "%llama-run%") OR like(CommandLine, "%llama-run%"), "Llama-Run",
      like(CommandLine, "%transformers%") OR like(CommandLine, "%huggingface%"), "HuggingFace/Transformers",
      like(CommandLine, "%langchain%"), "LangChain",
      like(NewProcessName, "%llama%") OR like(NewProcessName, "%llama.cpp%") OR like(ParentProcessName, "%llama%"), "Llama.cpp",
      1=1, "Related Activity")
  | stats count by host, Framework, EventCode, ParentProcessName, NewProcessName, SubjectUserName
  | sort host, Framework, -count
  | `windows_execution_of_local_llm_framework_filter`
how_to_implement: Enable Windows Security Event Log auditing for Process Creation (Event ID 4688) across Windows endpoints via Group Policy. Ensure the Audit Process Creation policy is enabled under Computer Configuration > Windows Settings > Security Settings > Advanced Audit Policy Configuration > Detailed Tracking. Additionally, enable command-line process auditing by configuring the Include command line in process creation events policy under Computer Configuration > Administrative Templates > System > Audit Process Creation. Ingest Windows Security Event Logs into Splunk via the Splunk Universal Forwarder or Windows Event Log Input, ensuring they are tagged with sourcetype=WinEventLog Security or XmlWinEventLog Security. Install and configure the Splunk Add-on for Microsoft Windows (TA-microsoft-windows) to ensure proper field extractions for NewProcessName, ParentProcessName, CommandLine, SubjectUserName, and Computer fields. Verify the wineventlog_security macro exists in your Splunk environment and correctly references the Windows Security event logs. Create or update the windows_execution_of_local_llm_framework_filter macro in your detections/filters folder to exclude approved development environments, authorized ML/AI workstations, sanctioned frameworks, or known safe systems. Deploy this hunting search as a scheduled saved search in Splunk Enterprise Security or Splunk Cloud to run on a regular cadence (recommended every 30-60 minutes). Tune the detection by adding new framework process names and command-line patterns as emerging LLM tools are identified.
known_false_positives: Legitimate development and data science workflows where developers, ML engineers, and researchers install and run local LLM frameworks for experimentation, fine-tuning, or prototyping. Approved AI/ML sandboxes and lab environments, open-source and educational use cases, third-party software bundling HuggingFace/Transformers/LangChain libraries as dependencies, and system administrators deploying frameworks as part of containerized services. Parent process and command-line keyword overlap with unrelated tools (e.g., "llama-backup", tools using "--transformers" flags for non-LLM purposes). Recommended tuning — baseline approved frameworks and users, exclude sanctioned development/lab systems, require additional context (user role, peer group, model artifacts, network exfiltration signals) before escalating to incidents.
references:
- https://splunkbase.splunk.com/app/8024
- https://www.ibm.com/think/topics/shadow-ai
- https://www.splunk.com/en_us/blog/artificial-intelligence/splunk-technology-add-on-for-ollama.html
- https://blogs.cisco.com/security/detecting-exposed-llm-servers-shodan-case-study-on-ollama 
drilldown_searches:
- name: View the detection results for - "$host$"
  search: '%original_detection_search% | search host="$host$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$host$"
  search: |
    | from datamodel Risk.All_Risk
    | search normalized_risk_object="$host$" starthoursago=168
    | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
