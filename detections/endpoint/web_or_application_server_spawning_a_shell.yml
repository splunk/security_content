name: Web or Application Server Spawning a Shell
id: 8fdb41ad-091c-4d7a-af1d-9123fe94b539
version: 10
creation_date: '2021-12-13'
modification_date: '2026-11-23'
author: Michael Haag, Nasreddine Bencherchali, Splunk
status: production
type: TTP
description: |
    This analytic identifies a Linux or Windows shell started by a web or application server process, including Java, PHP, Ruby workers running Puma, and Python workers, as well as Ghostscript image-rendering processes.
    It uses process creation telemetry and the parent-child relationship to identify unexpected command execution from a service.
    A shell launched by a rendering worker may follow activity in an upload or preview workflow; a matching process event is a behavioral signal and does not identify a specific vulnerability.
    Review the parent service, child command line, and nearby application activity to determine whether the action was authorized.
data_source:
    - Sysmon for Linux EventID 1
    - Sysmon EventID 1
search: |
    | tstats `security_content_summariesonly`
      count min(_time) as firstTime
            max(_time) as lastTime

    from datamodel=Endpoint.Processes where

    (
        Processes.parent_process_name IN (
            "apache*",
            "caddy",
            "httpd",
            "java",
            "lighttpd",
            "nginx",
            "gs",
            "ghostscript",
            "php*",
            "ruby*",
            "tomcat*"
        )
        `linux_shells`
    )
    OR
    (
        Processes.parent_process_name IN (
            "apache*.exe",
            "beasvc.exe",
            "caddy.exe",
            "coldfusion.exe",
            "frankenphp.exe",
            "gswin32.exe",
            "gswin32c.exe",
            "gswin64.exe",
            "gswin64c.exe",
            "http*.exe",
            "iisexpress.exe",
            "java.exe",
            "javaw.exe",
            "jbosssvc.exe",
            "jrun.exe",
            "lighttpd.exe",
            "lsphp*.exe",
            "MSExchangeHMWorker.exe",
            "nginx*.exe",
            "openresty.exe",
            "php*.exe",
            "roadrunner.exe",
            "ruby.exe",
            "rubyw.exe",
            "tomcat*.exe",
            "traefik.exe",
            "UMWorkerProcess.exe",
            "w3wp.exe",
            "wildfly-service.exe",
            "ws_TomcatService.exe"
        )
        `windows_shells`
    )

    NOT Processes.parent_process_name IN ("phpstorm*")

    NOT (
        Processes.parent_process_name="python3"
        Processes.process_name="sh"
        Processes.process_current_directory="/opt/microsoft/mdatp/sbin"
    )

    NOT (
        Processes.parent_process_name="w3wp.exe"
        Processes.parent_process_path="C:\\Windows\\System32\\inetsrv\\w3wp.exe"
        Processes.parent_process="*mobileframe server (64-bit)*"
        Processes.process_name="cmd.exe"
        Processes.process IN (
            "*/c ren *",
            "*eemsp_test*",
            "*getworkorderpart_*"
        )
    )

    NOT (
        Processes.process_current_directory = "/opt/nessus_agent/*"
        Processes.process_path = "/bin/sh"
    )

    NOT (
        Processes.process_current_directory = "/home/*/jenkins/*"
        Processes.process_path IN ("/bin/sh", "/bin/bash", "/usr/bin/bash")
    )

    NOT (
        Processes.parent_process_path = "*\\ArcGis\\Portal\\framework\\runtime\\jre\\bin\\*"
        Processes.parent_process_name = "javaw.exe"
        Processes.process_name = "cmd.exe"
        Processes.process = "*whoami*"
    )

    NOT (
        Processes.parent_process_path = "C:\\Program Files\\CCSI\\Instance_*"
        Processes.parent_process_name = "httpd.exe"
        Processes.process_name = "cmd.exe"
        Processes.process = "* /s /c *"
        Processes.process IN (
            "*ObixHMAC.exe*",
            "*TraceGen.exe*",
            "*UAAnalyzer.exe*"
        )
    )

    by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
       Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
       Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
       Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
       Processes.process_name Processes.process_path Processes.process_current_directory Processes.user Processes.user_id Processes.vendor_product

    | `drop_dm_object_name(Processes)`

    | where NOT (
        parent_process_name="ruby"
        AND match(parent_process_path, "(?i)^/home/[^/]+/[.]rvm/rubies/ruby-[^/]+/bin/ruby$")
        AND match(parent_process, "(?i)/rspec tests/")
        AND match(process_current_directory, "(?i)^/home/[^/]+/jenkins/workspace/.+$")
        AND process="sh"
    )
    | where (
        NOT match(parent_process_name, "(?i)^javaw?(\.exe)?$")
        OR match(parent_process, "(?i)(org\.apache\.catalina\.startup\.Bootstrap|-Dcatalina\.base=|org\.eclipse\.jetty\.start\.Main|-Djetty\.home=|org\.jboss\.modules\.Main|-Djboss\.home\.dir=|weblogic\.Server|-Dweblogic\.Name=|weblogic-launcher\.jar|com\.ibm\.ws\.runtime\.WsServer|com\.ibm\.ws\.kernel\.boot\.cmdline\.Bootstrap|com\.sun\.enterprise\.glassfish\.bootstrap\.ASMain|com\.caucho\.server\.resin\.Resin)")
        OR match(parent_process, "(?i)(org\.springframework\.boot\.loader\.|quarkus-run\.jar|io\.quarkus\.runner\.GeneratedMain|io\.micronaut\.runtime\.Micronaut|io\.dropwizard\.cli\.ServerCommand|play\.core\.server\.ProdServerStart|io\.helidon\.microprofile\.server\.Main|io\.helidon\.webserver|io\.vertx\.core\.Launcher)")
        OR match(parent_process, "(?i)(org\.keycloak|org\.apereo\.cas|org\.elasticsearch\.bootstrap\.Elasticsearch|com\.atlassian\.jira\.startup\.Launcher|BitbucketServerLauncher|com\.google\.gerrit\.pgm\.Daemon|-Dsolr\.solr\.home=|jenkins\.war)")
    )

    | where (
        NOT match(parent_process_name, "(?i)ruby")
        OR match(coalesce(parent_process,""), "(?i)\b(rails|rack|rackup|puma|passenger|unicorn|thin|webrick|falcon|sidekiq|sinatra|hanami|agoo|iodine)\b")
    )

    | where NOT (
        match(parent_process_name, "(?i)^php")
        AND match(
            lower(trim(process)),
            "^(cmd\.exe /s /c \"stty 2> nul\"|c:\\\\windows\\\\system32\\\\cmd\.exe /s /c \"mode con\"|sh -c \"stty -a \| grep columns\"|sh -c nproc|sh -c \"stty -g\"|sh -c \"tput (cols|lines)\")$"
        )
    )

    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `web_or_application_server_spawning_a_shell_filter`
how_to_implement: |
    The detection is based on data that originates from Endpoint Detection and Response (EDR) agents.
    These agents are designed to provide security-related telemetry from the endpoints where the agent is installed.
    To implement this search, you must ingest logs that contain the process GUID, process name, and parent process.
    Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product.
    The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: |
    Filtering may be required on internal developer build systems or classify assets as web facing and restrict the analytic based on asset type.
references:
    - https://blog.netlab.360.com/ten-families-of-malicious-samples-are-spreading-using-the-log4j2-vulnerability-now/
    - https://gist.github.com/olafhartong/916ebc673ba066537740164f7e7e1d72
drilldown_searches:
    - name: View the detection results for - "$dest$"
      search: '%original_detection_search% | search  dest = "$dest$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
finding:
    title: An instance of [$parent_process_name$] spawning [$process_name$] with CommandLine [$process$] was identified on endpoint [$dest$], potentially indicative of exploitation.
    entity:
        field: dest
        type: system
        score: 50
threat_objects:
    - field: parent_process_name
      type: parent_process_name
    - field: process_name
      type: process_name
    - field: process
      type: process
