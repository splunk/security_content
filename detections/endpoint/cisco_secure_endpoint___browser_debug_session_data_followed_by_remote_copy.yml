name: Cisco Secure EP - Browser Debug Followed by Remote Copy
id: 68f714ef-94b8-492f-ac06-c86e69971a11
version: 1
creation_date: '2026-11-27'
modification_date: '2026-11-27'
author: Nasreddine Bencherchali, Splunk
status: production
type: TTP
description: |-
    This analytic detects a browser launched for remote debugging and forcibly closed by the same parent process, followed by rclone copying a browser Cookies database or a file named session_cookie.json, by correlating two Cisco Secure Endpoint Behavioral Protection alerts on the same endpoint and actor.
    Remote debugging can expose session data to another process, and a subsequent remote copy may indicate credential or session exfiltration. The alerts do not establish that a session_cookie.json file came from that browser session; analysts must verify its contents and origin.
data_source:
    - Cisco Secure Endpoint Behavioral Protection Threat Detection
search: |-
    `cisco_secure_endpoint`
    event_type="Threat Detection"

    | `cisco_secure_endpoint_extract_bp_fields`

    | where sig_id IN ("20260810007777","20240715190623")

    | spath path=bp_data.details.matched_activity.events{0}.process:start.cmd_line output=process_command
    | spath path=bp_data.details.matched_activity.events{0}.process:start.parent_guid output=browser_parent_guid
    | spath path=bp_data.details.matched_activity.events{1}.process:start.cmd_line output=kill_command
    | spath path=bp_data.details.matched_activity.events{1}.process:start.parent_guid output=kill_parent_guid
    | spath path=bp_data.details.matched_activity.events{0}.process:start.args{2} output=copy_source
    | spath path=bp_data.details.matched_activity.events{0}.process:start.args{3} output=remote_destination

    | eval stage=case(sig_id="20260810007777","browser",
               sig_id="20240715190623","copy")

    | where (stage="browser"
             AND isnotnull(kill_command)
             AND browser_parent_guid=kill_parent_guid)
            OR (stage="copy"
                AND (match(copy_source,"(?i)\\\\session_cookie[.]json$")
                     OR match(copy_source,"(?i)\\\\Network\\\\Cookies$")))

    | eval user=coalesce(user,"unknown"),
           event_time=tonumber(timestamp)+tonumber(timestamp_nanoseconds)/1000000000

    | where isnotnull(endpoint_guid)
            AND isnotnull(event_time)

    | eval browser_time_candidate=if(stage="browser",event_time,null()),
           browser_command_candidate=if(stage="browser",process_command,null()),
           kill_command_candidate=if(stage="browser",kill_command,null())

    | sort 0 endpoint_guid user event_time

    | streamstats max(browser_time_candidate) as browser_time
                  last(browser_command_candidate) as browser_command
                  last(kill_command_candidate) as last_kill_command
      by endpoint_guid user

    | where stage="copy"
            AND isnotnull(browser_time)
            AND isnotnull(last_kill_command)
            AND isnotnull(copy_source)
            AND isnotnull(remote_destination)
            AND browser_time<event_time
            AND event_time-browser_time<=300

    | eval kill_command=last_kill_command,
           copy_command=process_command,
           copy_time=event_time,
           firstTime=browser_time,
           lastTime=copy_time

    | where isnotnull(browser_command)
            AND isnotnull(kill_command)

    | table dest user endpoint_guid browser_command kill_command copy_source
            remote_destination copy_command firstTime lastTime
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `cisco_secure_endpoint___browser_debug_session_data_followed_by_remote_copy_filter`
how_to_implement: |-
    This search requires Cisco Secure Endpoint Behavioral Protection Threat Detection alerts, which include event_type="Threat Detection".
    This search uses an input macro named `cisco_secure_endpoint`.
    We strongly recommend that you specify your environment-specific configurations (index, source, sourcetype, etc.) for Cisco Secure Endpoint Behavioral Protection Threat Detection alerts.
    Replace the macro definition with configurations for your Splunk environment.
    The `cisco_secure_endpoint_extract_bp_fields` macro extracts the common signature, endpoint, and actor fields used by this search.
    The search also uses a post-filter macro designed to filter out known false positives.
    The logs are to be ingested using the Cisco Security Cloud App for Splunk (https://splunkbase.splunk.com/app/7404).
known_false_positives: >-
    Approved browser debugging followed by a legitimate transfer of browser profile data can match. Verify the debugging request, process lineage, source file contents, remote destination, and authorization. The BP alerts do not expose cookie bytes or prove the copied file contained a live session.
references:
    - https://docs.amp.cisco.com/en/SecureEndpoint/Secure%20Endpoint%20User%20Guide.pdf
    - https://learn.microsoft.com/en-us/microsoft-edge/web-ai/devtools-mcp-server
    - https://attack.mitre.org/techniques/T1539/
    - https://attack.mitre.org/techniques/T1048/
drilldown_searches:
    - name: View BP Activity for - $dest$
      search: |-
        `cisco_secure_endpoint` event_type="Threat Detection"
        | spath path=computer.connector_guid output=endpoint_guid
        | search endpoint_guid="$endpoint_guid$"
        | spath path=bp_data.details.sig_id output=sig_id
        | spath path=bp_data.remediated output=remediated
        | spath path=bp_data.details.matched_activity.events{0}.process:start.cmd_line output=process_command
        | spath path=bp_data.details.matched_activity.events{0}.script:execution.cmd_line output=script_command
        | eval observed_command=coalesce(process_command,script_command)
        | table _time detection severity sig_id remediated observed_command _raw
        | sort - _time
      earliest_offset: 7d
      latest_offset: "0"
    - name: View Cloud IOC Activity for - $dest$
      search: |-
        `cisco_secure_endpoint` event_type="Cloud IOC"
        | spath path=computer.connector_guid output=endpoint_guid
        | search endpoint_guid="$endpoint_guid$"
        | spath path=cloud_ioc.short_description output=ioc_name
        | spath path=cloud_ioc.description output=ioc_description
        | spath path=command_line.arguments output=process_command
        | spath path=file.file_name output=file_name
        | spath path=file.file_path output=file_path
        | spath path=file.identity.sha256 output=file_sha256
        | eval activity_time=strftime(tonumber(coalesce(start_timestamp,timestamp)),"%Y-%m-%d %H:%M:%S")
        | table _time activity_time ioc_name severity process_command file_name file_path file_sha256 ioc_description _raw
        | sort - _time
      earliest_offset: 7d
      latest_offset: "0"
    - name: View risk events for the last 7 days for - "$user$"
      search: |-
        | from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
      earliest_offset: 7d
      latest_offset: "0"
finding:
    title: Debugged browser followed by session-related remote copy on $dest$
    entity:
        field: dest
        type: system
        score: 50
threat_objects:
    - field: copy_source
      type: file_path
    - field: browser_command
      type: command
    - field: copy_command
      type: command
analytic_story:
    - Compromised Windows Host
    - Windows Post-Exploitation
asset_type: Endpoint
mitre_attack_id:
    - T1539
    - T1048
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test - Cisco Secure Endpoint BP
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_secure_endpoint/behavioral_protection/browser_debug_session_data_followed_by_remote_copy/cisco_se.log
          source: not_applicable
          sourcetype: cisco:se
      test_type: unit
