name: Windows GitHub Workflow File Creation Hunt
id: 7c7c2aa0-2c3b-4c0e-9f1e-6a7b2e0f1d4b
version: 1
date: '2025-10-27'
author: Michael Haag, Splunk
status: production
type: Hunting
description: Hunt for creation of GitHub Actions workflow YAML files under a repository's
  .github\workflows directory on Windows endpoints. GitHub Actions workflows execute
  arbitrary code in CI/CD pipelines with access to secrets, tokens, and deployment
  credentials. Attackers exploit this by injecting malicious workflows to exfiltrate
  credentials, modify build artifacts, or establish persistence. Sudden or unusual
  workflow creation can indicate supply chain tampering (e.g., Shai-Hulud worm injecting
  workflows across compromised repositories), insider threats, or compromised developer
  accounts. Defenders should track these events to identify unauthorized CI/CD modifications
  before they execute, correlate with git activity or package installations, and
  establish baselines for legitimate workflow creation patterns across development
  teams and repositories to detect anomalies.
data_source:
- Sysmon EventID 11
search: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime
  from datamodel=Endpoint.Filesystem where (Filesystem.file_path IN ("*\\\\.github\\\\workflows\\\\*.yml","*\\\\.github\\\\workflows\\\\*.yaml")
  AND Filesystem.action="created") by Filesystem.dest Filesystem.file_path Filesystem.file_name Filesystem.action Filesystem.user
  | `drop_dm_object_name(Filesystem)` | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `windows_github_workflow_file_creation_hunt_filter`'
how_to_implement: The detection is based on data that originates from Endpoint Detection
  and Response (EDR) agents. These agents are designed to provide security-related
  telemetry from the endpoints where the agent is installed. To implement this search,
  you must ingest logs that contain filesystem events, specifically file creation
  events. These logs must be processed using the appropriate Splunk Technology Add-ons
  that are specific to the EDR product. The logs must also be mapped to the `Filesystem`
  node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM)
  to normalize the field names and speed up the data modeling process.
known_false_positives: Legitimate engineering activity regularly creates workflow YAMLs. Suppress
  by repository path allowlisting, CI hosts, change windows, or approval timeframes.
references:
- https://www.cisa.gov/news-events/alerts/2025/09/23/widespread-supply-chain-compromise-impacting-npm-ecosystem
- https://securelist.com/shai-hulud-worm-infects-500-npm-packages-in-a-supply-chain-attack/117547/
- https://github.com/SigmaHQ/sigma/pull/5658/files
tags:
  analytic_story:
  - NPM Supply Chain Compromise
  asset_type: Endpoint
  mitre_attack_id:
  - T1574.006
  - T1554
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: endpoint
tests:
- name: True Positive Test
  attack_data:
  - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1195.001/npm/windows_workflow_sysmon.log
    source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
    sourcetype: XmlWinEventLog