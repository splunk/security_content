name: Windows Possible OPA Forced Authentication
id: e89c0c4d-5573-4a1e-8b86-6c440082c522
version: 1
date: '2026-04-13'
author: Raven Tait, Splunk
status: production
type: TTP
description: |-
    A critical vulnerability, CVE-2024-8260, has been identified in Open Policy Agent (OPA) for Windows, affecting all versions prior to v0.68.0.
    This vulnerability arises from improper input validation, allowing attackers to exploit the system by tricking OPA into accessing a malicious Server Message Block (SMB) share.
    This can lead to the leakage of the Net-NTLMv2 hash, effectively exposing user credentials.
    Once exploited, attackers can relay authentication to other systems supporting NTLMv2 or perform offline cracking to extract passwords.
    OPA is widely used for enforcing authorization and resource access policies across various environments, including cloud-native applications and APIs.
    The vulnerability allows attackers to force a vulnerable system to authenticate to an attacker's server, thereby sharing user credentials.
data_source:
    - Sysmon EventID 1
search: |-
    | tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where Processes.process="*eval*" Processes.process="*bundle*" Processes.process="*\\\\*\\*" by Processes.process Processes.vendor_product Processes.user_id Processes.process_hash Processes.parent_process_name Processes.parent_process_exec Processes.action Processes.dest Processes.process_current_directory Processes.process_path Processes.process_integrity_level Processes.original_file_name Processes.parent_process Processes.parent_process_path Processes.parent_process_guid Processes.parent_process_id Processes.process_guid Processes.process_id Processes.user Processes.process_name
    | `drop_dm_object_name(Processes)`
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `windows_possible_opa_forced_authentication_filter`
how_to_implement: The detection is based on data that originates from Endpoint Detection and Response (EDR) agents. These agents are designed to provide security-related telemetry from the endpoints where the agent is installed. To implement this search, you must ingest logs that contain the process GUID, process name, and parent process. Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product. The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: Some legitimate enterprise environments may use Open Policy Agent in ways that trigger forced authentication attempts for policy enforcement or monitoring. Filter alerts accordingly to exclude authorized OPA management traffic.
references:
    - https://www.tenable.com/blog/cve-2024-8260-smb-force-authentication-vulnerability-in-opa-could-lead-to-credential-leakage
    - https://www.darkreading.com/vulnerabilities-threats/opa-windows-vulnerability-exposes-ntlm-hashes
drilldown_searches:
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View the detection results for - "$user$" and "$dest$"
      search: '%original_detection_search% | search  user = "$user$" dest = "$dest$"'
    - name: View risk events for the last 7 days for - "$user$" and "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
rba:
    message: Potential OPA forced authentication activity observed on $dest$ via $process$.
    risk_objects:
        - field: dest
          type: system
          score: 50
    threat_objects:
        - field: parent_process_name
          type: process
tags:
    analytic_story:
        - Windows Privilege Escalation
        - Compromised Windows Host
        - Credential Dumping
    asset_type: Endpoint
    mitre_attack_id:
        - T1187
        - T1021.002
        - T1543.003
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1187/snapattack/snapattack.log
          source: XmlWinEventLog:Security
          sourcetype: XmlWinEventLog
