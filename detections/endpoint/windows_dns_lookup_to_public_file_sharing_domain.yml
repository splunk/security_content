name: Windows DNS Lookup to Public File Sharing Domain
id: 3c6e77aa-7b7d-4a20-bd59-9221a0b9f2c9
version: 1
date: '2026-03-03'
author: Teoderick Contreras, Splunk
status: production
type: Anomaly
description: This Analytics detects DNS queries to public file sharing domains, such as api.anonfiles.com and api.gofile.io. These services allow users to anonymously upload and distribute files, which can be abused by threat actors for data exfiltration, malware staging, or command-and-control communications. Monitoring DNS requests to these domains helps identify potentially unauthorized data transfers or suspicious outbound activity. While legitimate use may exist, such queries originating from servers, restricted systems, or non-browser processes should be investigated to determine whether sensitive data is being staged or transmitted externally.
data_source:
    - Sysmon EventID 22
search: '`sysmon` EventCode=22  QueryName IN ("*api.anonfiles.com", "*api.gofile.io") | eval answer=coalesce(answer,"none") | eval answer_count=coalesce(answer_count,0) | stats  min(_time) as firstTime max(_time) as lastTime count BY answer answer_count dvc process_exec process_guid process_name query query_count reply_code_id signature signature_id src user_id vendor_product QueryName QueryResults QueryStatus | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `windows_dns_lookup_to_public_file_sharing_domain_filter`'
how_to_implement: To successfully implement this search, you need to be ingesting logs with the process name and eventcode = 22 dnsquery executions from your endpoints. If you are using Sysmon, you must have at least version 6.0.4 of the Sysmon TA. Tune and filter known instances where renamed rundll32.exe may be used.
known_false_positives: No false positives have been identified at this time.
references:
    - https://malpedia.caad.fkie.fraunhofer.de/details/py.blankgrabber
drilldown_searches:
    - name: View the detection results for - "$dest$"
      search: '%original_detection_search% | search  dest = "$dest$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$") starthoursago=168  | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
rba:
    message: A process [$process_name$] made a DNS query for [$QueryName$] from host [$dest$].
    risk_objects:
        - field: dest
          type: system
          score: 50
    threat_objects:
        - field: process_name
          type: process_name
tags:
    analytic_story:
        - Lokibot
    asset_type: Endpoint
    mitre_attack_id:
        - T1071.004
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1071.004/upload_files_dns/upload_files.log
          source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
          sourcetype: XmlWinEventLog
