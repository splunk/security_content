name: Windows Office VSTO Add-in Access
id: 18b3796c-b61c-4ba6-b294-4c8cde857e2d
version: 1
date: '2026-04-13'
author: Raven Tait, Splunk
status: production
type: Anomaly
description: |-
    Detects Office applications accessing Visual Studio Tools for Office (VSTO) files.
    VSTO files can be bundled alongside office documents and enable .NET based add-ins.
    Once installed they will execute every time that office application is started granting a unique persistence mechanism as well as a vector for initial access.
    False positives could include legitimately developed add-ins so further analysis will be needed to determine maliciousness.
data_source:
    - Windows Event Log Security 4663
search: |-
    `wineventlog_security`
    EventID="4663"
    ObjectName="*.vsto"
    ProcessName IN ("*WINWORD.EXE", "*EXCEL.EXE", "*POWERPNT.EXE", "*ONENOTE.EXE", "*OUTLOOK.EXE")
    | fillnull
    | stats count min(_time) as firstTime max(_time) as lastTime by Computer, ObjectName, ProcessName, EventID
    | rename Computer as dest
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `windows_office_vsto_add_in_access_filter`
how_to_implement: The detection is based on data that originates from Endpoint Detection and Response (EDR) agents. These agents are designed to provide security-related telemetry from the endpoints where the agent is installed. To implement this search, you must ingest logs that contain the process GUID, process name, and parent process. Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product. The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: Legitimate custom Office add-ins developed by organizations may trigger this detection. Verify the source and purpose of the add-in before taking action.
references:
    - https://medium.com/@airlockdigital/make-phishing-great-again-vsto-office-files-are-the-new-macro-nightmare-e09fcadef010
    - https://bohops.com/2018/01/31/vsto-the-payload-installer-that-probably-defeats-your-application-whitelisting-rules/
    - https://lookbook.cyberjungles.com/random-research-area/phishing-with-ms-office-docs/vsto-and-malicious-office-docs
drilldown_searches:
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View the detection results for - "$user$" and "$dest$"
      search: '%original_detection_search% | search  user = "$user$" dest = "$dest$"'
    - name: View risk events for the last 7 days for - "$user$" and "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
rba:
    message: Office process $ProcessName$ accessed VSTO add-in $ObjectName$ on $dest$.
    risk_objects:
        - field: dest
          type: system
          score: 20
    threat_objects:
        - field: ObjectName
          type: file_path
tags:
    analytic_story:
        - Malicious PowerShell
        - Malicious Inno Setup Loader
        - Suspicious MSHTA Activity
        - Suspicious Regsvr32 Activity
        - Suspicious Rundll32 Activity
    asset_type: Endpoint
    mitre_attack_id:
        - T1137.006
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1137.006/snapattack/snapattack.log
          source: XmlWinEventLog:Security
          sourcetype: XmlWinEventLog
