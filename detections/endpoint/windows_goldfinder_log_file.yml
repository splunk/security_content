name: Windows GoldFinder Log File
id: 67f9325f-1adb-4301-b00a-a279ce7fb866
version: 1
date: '2026-04-13'
author: Raven Tait, Splunk
status: production
type: Anomaly
description: This analytic detects the creation of the log file generated by the GoldFinder tool. GoldFinder is commonly used for reconnaissance by identifying sensitive information on Windows systems. The presence of this log file indicates potential information-gathering activity that may precede further exploitation or lateral movement. Detecting this activity enables early identification of adversary reconnaissance efforts.
data_source:
    - Sysmon EventID 11
search: '`sysmon` EventID=11 EventDescription="FileCreate" TargetFilename="*loglog.txt" | fillnull | stats count by Computer, TargetFilename, EventDescription, action, dest, file_name, file_path, process_guid, process_id, user, vendor_product| `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)`| `windows_goldfinder_log_file_filter`'
how_to_implement: The detection is based on data that originates from Endpoint Detection and Response (EDR) agents. These agents are designed to provide security-related telemetry from the endpoints where the agent is installed. To implement this search, you must ingest logs that contain the process GUID, process name, and parent process. Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product. The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: Legitimate use of GoldFinder for system diagnostics or authorized troubleshooting may generate these log files. Monitor for usage consistent with approved maintenance activities.
references:
    - https://www.microsoft.com/security/blog/2021/03/04/goldmax-goldfinder-sibot-analyzing-nobelium-malware/
drilldown_searches:
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View the detection results for - "$user$" and "$dest$"
      search: '%original_detection_search% | search  user = "$user$" dest = "$dest$"'
    - name: View risk events for the last 7 days for - "$user$" and "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
rba:
    message: Potential GoldFinder Log File activity observed on $dest$ via $process$.
    risk_objects:
        - field: dest
          type: system
          score: 20
    threat_objects: []
tags:
    analytic_story:
        - Windows Discovery Techniques
        - Active Directory Discovery
        - Active Directory Lateral Movement
    asset_type: Endpoint
    mitre_attack_id:
        - T1016.001
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1016.001/snapattack/snapattack.log
          source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
          sourcetype: XmlWinEventLog
