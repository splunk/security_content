name: Windows Chromium Session Restored With Crash Bubble Suppressed
id: ff22a1c5-d30c-40c9-adc0-947ea51cc623
version: 1
creation_date: '2026-10-19'
modification_date: '2026-10-19'
author: Onur Mustafa Erdogan, Splunk
status: experimental
type: TTP
description: |
    The following analytic detects a Chromium-based browser being launched with both the --hide-crash-restore-bubble and --restore-last-session
    command-line flags by a process other than the browser itself. Focusing on browser command lines that silently restore the previous session
    without showing the "Chrome didn't shut down correctly" notification. This activity is significant because browser hijackers and adware droppers
    forcefully terminate the browser to tamper with its preference files, then relaunch it with these flags so that the victim does not notice the
    interruption and lands on an attacker-controlled page. If confirmed malicious, this could indicate that the browser profile was modified to
    hijack the default search engine, new tab page or to side-load a malicious extension.
data_source:
    - Sysmon EventID 1
    - Windows Event Log Security 4688
search: |
    | tstats `security_content_summariesonly`
      count min(_time) as firstTime
            max(_time) as lastTime

    from datamodel=Endpoint.Processes where

    Processes.process_name IN ("chrome.exe", "msedge.exe", "brave.exe")
    Processes.process="*--hide-crash-restore-bubble*"
    Processes.process="*--restore-last-session*"
    NOT Processes.parent_process_name IN ("chrome.exe", "msedge.exe", "brave.exe")

    by Processes.action Processes.dest Processes.original_file_name Processes.parent_process
       Processes.parent_process_exec Processes.parent_process_guid Processes.parent_process_id
       Processes.parent_process_name Processes.parent_process_path Processes.process Processes.process_exec
       Processes.process_guid Processes.process_hash Processes.process_id Processes.process_integrity_level
       Processes.process_name Processes.process_path Processes.user Processes.user_id Processes.vendor_product

    | `drop_dm_object_name(Processes)`
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `windows_chromium_session_restored_with_crash_bubble_suppressed_filter`
how_to_implement: |-
    The detection is based on data that originates from Endpoint Detection and Response (EDR) agents. These agents are designed to provide security-related
    telemetry from the endpoints where the agent is installed. To implement this search, you must ingest logs that contain the process GUID, process name,
    and parent process. Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology
    Add-ons that are specific to the EDR product. The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common
    Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: |-
    Browser automation and enterprise management or support tools may launch the browser with these flags to restore sessions silently. Filter
    as needed based on the parent process.
references:
    - https://www.joesandbox.com/analysis/1965188/0/html
    - https://www.gdatasoftware.com/blog/2025/11/38298-learning-about-browser-hijacking
    - https://peter.sh/experiments/chromium-command-line-switches/
drilldown_searches:
    - name: View the detection results for - "$dest$" and "$user$"
      search: '%original_detection_search% | search  dest = "$dest$" user = "$user$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$" and "$user$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$", "$user$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
finding:
    title: A browser session was silently restored by [$process$] with the crash bubble suppressed on [$dest$] by user [$user$].
    entity:
        field: dest
        type: system
        score: 50
threat_objects:
    - field: parent_process_name
      type: parent_process_name
    - field: process
      type: process
analytic_story:
    - Browser Hijacking
asset_type: Endpoint
mitre_attack_id:
    - T1176.001
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1176.001/chromium_restore_suppressed/chromium_restore_suppressed.log
          source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
          sourcetype: XmlWinEventLog
      test_type: unit
