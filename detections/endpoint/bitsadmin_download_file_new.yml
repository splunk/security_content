name: BITSAdmin Download File New
id: 334b32f8-c853-489d-a757-ee8a51586163
version: 1
date: '2025-12-03'
author: PB
status: production
type: TTP
description: >-
  The following analytic detects the use of the BITSAdmin utility to download files,
  specifically actions related to "transfer" and "addfile." It identifies these behaviors
  by analyzing process data within the endpoint data model, looking for specific keyword
  patterns in the process execution related to file transfers. Identifying this behavior
  is crucial for a SOC because BITSAdmin can be exploited by attackers to download
  malicious files stealthily, often circumventing traditional security measures. The
  ability to transfer files without raising alerts can facilitate a variety of attacks,
  including data exfiltration and the deployment of malware. The impact of such attacks
  can be significant, leading to unauthorized access to sensitive information, compromise
  of business operations, and substantial reputational damage. By detecting suspicious
  activities surrounding BITSAdmin, SOC teams can respond to potential threats before
  they escalate into larger security incidents.
data_source:
- Sysmon EventID 1
- Windows Event Log Security 4688
- CrowdStrike ProcessRollup2
search: |-
  | tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
    as lastTime from datamodel=Endpoint.Processes where `process_bitsadmin` Processes.process
    IN ("*transfer*", "*addfile*") by Processes.action Processes.dest Processes.original_file_name
    Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
    Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
    Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
    Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
    Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
    | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `bitsadmin_download_file_new_filter`
how_to_implement: 'This detection looks for BITSAdmin file downloads, leveraging data
  from Sysmon (EventID 1), Windows Security Event Log (EventID 4688), and CrowdStrike
  ProcessRollup2. Key fields include process names, command lines, and parent process
  details. Required TAs: Splunk Add-on for Sysmon, Splunk Add-on for Microsoft Windows,
  and Splunk Add-on for CrowdStrike FDR. Ensure the ingested data is CIM-compliant,
  as the detection utilizes the Endpoint.Processes datamodel for efficient querying
  and correlation.'
known_false_positives: None
references: null
drilldown_searches:
- name: View the detection results for - "$user$" and "$dest$"
  search: |-
    %original_detection_search% | search  user = "$user$" dest = "$dest$"
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$user$" and "$dest$"
  search: |-
    | from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$",
          "$dest$") starthoursago=168  | stats count min(_time) as firstTime max(_time)
          as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk
          Message" values(analyticstories) as "Analytic Stories" values(annotations._all)
          as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics"
          by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
rba:
  message: An instance of $parent_process_name$ spawning $process_name$ was detected
    on system $dest$ by user $user$, indicating potential unauthorized file download
    activity.
  risk_objects:
  - field: dest
    type: system
    score: 80
  - field: user
    type: user
    score: 80
  threat_objects:
  - field: parent_process_name
    type: parent_process_name
  - field: process_name
    type: process_name
tags:
  analytic_story:
  - Credential Dumping
  asset_type: Endpoint
  mitre_attack_id:
  - T1198
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: endpoint
tests:
- name: True Positive Test
  attack_data:
  - data: https://media.githubusercontent.com/media/splunk/attack_data/master/attack_techniques/T1198/bitsadmin-download-file-new/data.log
    source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
    sourcetype: XmlWinEventLog
