name: BITSAdmin Download File New
id: 543c476b-db8e-4b19-a127-93c744e17222
version: 1
date: '2025-11-18'
author: PB
status: production
type: TTP
description: >-
  The following analytic detects the use of BITSAdmin for downloading files, specifically
  identifying processes that invoke actions related to transferring or adding files.
  It does so by querying the Endpoint Processes data model for processes matching
  certain patterns in their names and actions, while aggregating relevant context
  such as the involved user, process IDs, and timings of events. Identifying this
  behavior is critical for a SOC as BITSAdmin is often leveraged by attackers to facilitate
  covert file transfers, potentially leading to data exfiltration or the delivery
  of malicious payloads. The ability to detect misuse of this tool helps security
  teams respond proactively to potential threats before they escalate into significant
  incidents. The impact of attacks utilizing BITSAdmin can be severe, as they may
  result in unauthorized data access, loss of sensitive information, or compromise
  of organizational networks. By monitoring for these specific activities, SOC teams
  can enhance their threat detection capabilities and improve overall security posture.
data_source:
- Sysmon EventID 1
- Windows Event Log Security 4688
- CrowdStrike ProcessRollup2
search: |-
  | tstats `security_content_summariesonly` count min(_time) as firstTime max(_time)
    as lastTime from datamodel=Endpoint.Processes where `process_bitsadmin` Processes.process
    IN ("*transfer*", "*addfile*") by Processes.action Processes.dest Processes.original_file_name
    Processes.parent_process Processes.parent_process_exec Processes.parent_process_guid
    Processes.parent_process_id Processes.parent_process_name Processes.parent_process_path
    Processes.process Processes.process_exec Processes.process_guid Processes.process_hash
    Processes.process_id Processes.process_integrity_level Processes.process_name Processes.process_path
    Processes.user Processes.user_id Processes.vendor_product | `drop_dm_object_name(Processes)`
    | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)` | `bitsadmin_download_file_new_filter`
how_to_implement: This detection looks for file downloads initiated by BITSAdmin,
  leveraging data from Sysmon (EventID 1), Windows Event Log Security (EventID 4688),
  and CrowdStrike ProcessRollup2. Key fields include process names, command lines,
  and timestamps. Required Technology Add-ons are the Splunk Add-on for Sysmon, Splunk
  Add-on for Microsoft Windows, and Splunk Add-on for CrowdStrike FDR. Ensure that
  these data sources align with the Common Information Model (CIM) for optimal integration
  and search efficiency.
known_false_positives: None
references: null
drilldown_searches:
- name: View the detection results for - "$user$" and "$dest$"
  search: |-
    %original_detection_search% | search  user = "$user$" dest = "$dest$"
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$user$" and "$dest$"
  search: |-
    | from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$",
          "$dest$") starthoursago=168  | stats count min(_time) as firstTime max(_time)
          as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk
          Message" values(analyticstories) as "Analytic Stories" values(annotations._all)
          as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics"
          by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
rba:
  message: An instance of $parent_process_name$ spawning $process_name$ was detected
    on system $dest$ by user $user$, indicating a potential misuse of BITSAdmin for
    file downloads.
  risk_objects:
  - field: dest
    type: system
    score: 80
  - field: user
    type: user
    score: 80
  threat_objects:
  - field: parent_process_name
    type: parent_process_name
  - field: process_name
    type: process_name
tags:
  analytic_story:
  - Credential Dumping
  asset_type: Endpoint
  mitre_attack_id:
  - T1197
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: endpoint
tests:
- name: True Positive Test
  attack_data:
  - data: https://media.githubusercontent.com/media/splunk/attack_data/master/attack_techniques/T1197/bitsadmin-download-file-new/data.log
    source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
    sourcetype: XmlWinEventLog
