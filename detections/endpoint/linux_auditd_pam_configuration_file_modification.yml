name: Linux Auditd PAM Configuration File Modification
id: 3c9a6e74-5b2d-4e71-8f0a-1d7c2b9e4a63
version: 1
creation_date: '2026-10-31'
modification_date: '2026-11-24'
author: vahid malekmohammadi
status: production
type: Anomaly
description: |-
    The following analytic detects modification of the Linux PAM (Pluggable Authentication Modules) configuration under /etc/pam.d/, /etc/security/ or /etc/pam.conf, using Linux Auditd.
    Adversaries tamper with these files to backdoor authentication - for example adding "auth sufficient pam_permit.so" to allow any account to authenticate with no password, or wiring a pam_exec/custom module that grants access on a hardcoded password for any existing user.
    The analytic correlates the auditd PATH records of an event with the CWD and SYSCALL records of the same audit event, reconstructing the absolute path when a file was opened by a relative name (for example after a chdir into /etc/pam.d) and tolerating path variations such as /etc//pam.d or /tmp/../etc/pam.d.
    Because package upgrades, pam-auth-update and password changes legitimately write these files, this is modeled as an anomaly and must be tuned with the filter macro.
data_source:
    - Linux Auditd Path
    - Linux Auditd Cwd
    - Linux Auditd Syscall
search: |-
    `linux_auditd`
    (
      (type=PATH nametype IN ("NORMAL","CREATE","DELETE"))
      OR type=CWD
      OR type=SYSCALL
    )

    | rex "msg=audit\([^)]*:(?<audit_id>\d+)\)"

    | fillnull cwd
    | stats values(name) as names values(nametype) as nametype values(cwd) as cwd values(comm) as process_name values(exe) as process values(success) as success values(auid) as auid values(uid) as uid min(_time) as firstTime max(_time) as lastTime BY audit_id host
    | eval cwd=mvfilter(cwd!=0)

    | mvexpand cwd
    | eval candidate_paths=mvmap(names, if(match(names,"^/"), names, cwd."/".names))
    | eval matched_paths=mvfilter(match(candidate_paths,"/etc/(?:[\.\/]+)?(pam\.conf|pam\.d|security)(/.+)?$"))
    | eval match_count=mvcount(matched_paths)

    | where match_count>0 AND success="yes" AND isnotnull(process_name)

    | fields - names,match_count,candidate_paths
    | rename host as dest, matched_paths as path

    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `linux_auditd_pam_configuration_file_modification_filter`
how_to_implement: |-
    To implement this detection, ingest auditd data consisting of SYSCALL, PATH, CWD and PROCTITLE events using the Splunk Add-on for Unix and Linux (https://splunkbase.splunk.com/app/833), and normalize the field names to the Splunk Common Information Model (CIM).
    Make sure the type=CWD record is captured in your auditd configuration, as it is used here to reconstruct the absolute path when a PAM file is opened by a relative name.
    The host's auditd rules must generate PATH and SYSCALL records for writes under these locations - the common way is a watch such as "-w /etc/pam.d/ -p wa -k <key>", "-w /etc/security/ -p wa -k <key>" and "-w /etc/pam.conf -p wa -k <key>" (shipped by most hardened rulesets, e.g. the Neo23x0 auditd baseline). Use write and attribute permissions (wa) and do not add read permission, because the analytic cannot tell a read from a write.
    The analytic matches on the file paths in the PATH records of every audit event, so on hosts with broad audit rules (for example execve auditing) it processes a large number of records; test it in a development environment and check its run time before enabling it in production.
    The analytic requires a successful (success=yes) syscall correlated to the PATH record, so denied/failed write attempts are not reported as modifications. Confirm field names against a real event, as auditd extraction can vary by deployment.
known_false_positives: |-
    Package installation and upgrades (apt, dpkg, dpkg-reconfigure, rpm), pam-auth-update, authselect, ucf, and configuration-management tooling (Ansible, Puppet, Chef, Salt) legitimately modify PAM configuration files.
    Password changes (passwd, chpasswd) rewrite /etc/security/opasswd when password history is enabled, and limits, access or pwquality settings under /etc/security/ are changed by administrators and provisioning tools.
    Update the filter macro to allowlist the expected maintenance processes (for example process_name in dpkg, pam-auth-update, ucf, frontend) or the service accounts that run them for your environment.
references:
    - https://attack.mitre.org/techniques/T1556/003/
    - https://attack.mitre.org/techniques/T1556/
    - https://github.com/zephrax/linux-pam-backdoor
    - https://www.group-ib.com/blog/pam-backdoor/
drilldown_searches:
    - name: View the detection results for - "$dest$"
      search: '%original_detection_search% | search  dest = "$dest$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
intermediate_findings:
    entities:
        - field: dest
          type: system
          score: 20
          message: PAM configuration file [$path$] was modified by process [$process_name$] on host - [$dest$], a possible authentication backdoor.
analytic_story:
    - Compromised Linux Host
    - Linux Persistence Techniques
asset_type: Endpoint
mitre_attack_id:
    - T1556.003
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1556.003/linux_auditd_pam_backdoor/linux_auditd_pam_backdoor.log
          source: auditd
          sourcetype: auditd
      test_type: unit
