name: Windows VBA Project File Created by Non-Office Process
id: 839ded49-b2b9-4c07-ba86-e9a82494280a
version: 1
creation_date: '2026-11-10'
modification_date: '2026-11-10'
author: ali-vrd
status: experimental
type: Anomaly
description: |-
    The following analytic detects the creation of a vbaProject.bin file by a process other than a Microsoft Office
    application. The vbaProject.bin file stores the VBA macro project inside an Office document, containing both the VBA
    source code and the compiled p-code. Attackers use tools such as EvilClippy to perform VBA stomping, which requires
    writing or manipulating a standalone vbaProject.bin file while constructing the malicious document. A legitimate
    vbaProject.bin on the filesystem is written by the Office host process itself (WINWORD.EXE, EXCEL.EXE, POWERPNT.EXE and
    others) or produced by archive utilities extracting document contents. Creation by any other process, including script
    interpreters and unknown binaries, may indicate macro stomping or malicious document staging. This detection leverages
    the Filesystem node of the Endpoint data model.
data_source:
    - Sysmon EventID 11
search: |-
    | tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime

    FROM datamodel=Endpoint.Filesystem

    WHERE
        Filesystem.file_name="vbaProject.bin"
        NOT (
                Filesystem.process_name IN (
                    "7z.exe",
                    "7za.exe",
                    "7zfm.exe",
                    "7zg.exe",
                    "bandizip.exe",
                    "bsdtar.exe",
                    "eqnedt32.exe",
                    "excel.exe",
                    "msaccess.exe",
                    "mspub.exe",
                    "nanazip.exe",
                    "onenote.exe",
                    "outlook.exe",
                    "pea.exe",
                    "peazip.exe",
                    "powerpnt.exe",
                    "rar.exe",
                    "tar.exe",
                    "unrar.exe",
                    "visio.exe",
                    "winproj.exe",
                    "winrar.exe",
                    "winword.exe",
                    "winzip32.exe",
                    "winzip64.exe"
                )
            )
        BY Filesystem.action Filesystem.dest Filesystem.file_create_time Filesystem.file_hash Filesystem.file_modify_time
          Filesystem.file_name Filesystem.file_path Filesystem.file_size Filesystem.process_guid Filesystem.process_id
          Filesystem.process_name Filesystem.user Filesystem.vendor_product

        | `drop_dm_object_name(Filesystem)`
        | `security_content_ctime(firstTime)`
        | `security_content_ctime(lastTime)`
        | `windows_vba_project_file_created_by_non_office_process_filter`
how_to_implement: |-
    To successfully implement this search you need to be ingesting information on process that include the name of the
    process responsible for the changes from your endpoints into the `Endpoint` datamodel in the `Filesystem` node. In
    addition, confirm the latest CIM App 4.20 or higher is installed and the latest TA for the endpoint product.
known_false_positives: |-
    Archive utilities extracting Office document contents, or Office applications not included in the filter list, may
    create vbaProject.bin files legitimately. Rare legitimate tooling that rebuilds Office documents may also trigger this
    analytic.
references:
    - https://attack.mitre.org/techniques/T1564/007/
    - https://github.com/outflanknl/EvilClippy
    - https://www.outflank.nl/blog/2019/05/05/evil-clippy-ms-office-malleable-c2-profiles-and-evading-cobalt-strike-beacon-scans/
drilldown_searches:
    - name: View the detection results for - "$dest$" and "$user$"
      search: '%original_detection_search% | search  dest = "$dest$" user = "$user$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$" and "$user$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$", "$user$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
intermediate_findings:
    entities:
        - field: dest
          type: system
          score: 20
          message: Non-Office process [$process_name$] created [$file_name$] on [$dest$] by user [$user$].
        - field: user
          type: user
          score: 20
          message: Non-Office process [$process_name$] created [$file_name$] on [$dest$] by user [$user$].
threat_objects:
    - field: process_name
      type: process_name
    - field: file_name
      type: file_name
analytic_story:
    - Spearphishing Attachments
asset_type: Endpoint
mitre_attack_id:
    - T1564.007
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
