name: "Windows Common credential Dumpers"
id: bcb6c91d-b87d-4b71-b965-80b25a11adfb
version: 1
date: '2026-04-13'
author: Raven Tait, Splunk
status: production
type: Anomaly
description: This analytic detects the execution of known Windows credential dumping tools by identifying their presence in the AppCompatCache. Credential dumping is a common attack technique used to extract stored account credentials, such as password hashes or plaintext passwords, from a compromised system. This activity is significant because stolen credentials can enable attackers to escalate privileges, move laterally within a network, and maintain persistent access. Confirmed malicious use of these tools can lead to extensive compromise of user accounts and sensitive information.
data_source:
    - Sysmon EventID 1
search: '| tstats `security_content_summariesonly` count min(_time) as firstTime max(_time) as lastTime from datamodel=Endpoint.Processes where Processes.process_name IN ("q32.exe", "q64.exe", "w86.exe", "q86.exe", "quarkpwdMtCrt.exe", "m64.exe", "hash32.exe", "hash64.exe", "ht64.exe", "ht32.exe", "htran.exe", "64.exe", "32.exe", "w32.exe", "w64.exe", "wce32.exe", "wce64.exe", "w32.exe", "w64.exe", "wce.exe", "p32.exe", "p64.exe", "ps32.exe", "ps64.exe", "mimikatz.exe", "mm32.exe", "mm64.exe", "pw32.exe", "pw64.exe", "pwdump.exe", "g32.exe", "g64.exe", "gs32.exe", "gs64.exe") by Processes.process Processes.vendor_product Processes.user_id Processes.process_hash Processes.parent_process_name Processes.parent_process_exec Processes.action Processes.dest Processes.process_current_directory Processes.process_path Processes.process_integrity_level Processes.original_file_name Processes.parent_process Processes.parent_process_path Processes.parent_process_guid Processes.parent_process_id Processes.process_guid Processes.process_id Processes.user Processes.process_name | `drop_dm_object_name(Processes)` | `security_content_ctime(firstTime)`| `security_content_ctime(lastTime)`| `windows_common_credential_dumpers_filter`'
how_to_implement: The detection is based on data that originates from Endpoint Detection and Response (EDR) agents. These agents are designed to provide security-related telemetry from the endpoints where the agent is installed. To implement this search, you must ingest logs that contain the process GUID, process name, and parent process. Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product. The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: Some legitimate system maintenance or security auditing tools may access the AppCompatCache for credential checks. Filter alerts for approved administrative activities.
drilldown_searches:
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View the detection results for - "$user$" and "$dest$"
      search: '%original_detection_search% | search  user = "$user$" dest = "$dest$"'
    - name: View risk events for the last 7 days for - "$user$" and "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
rba:
    message: "potential Common credential\n  dumpers activity observed on $dest$."
    risk_objects:
        - field: dest
          type: system
          score: 50
    threat_objects:
        - field: parent_process_name
          type: process
tags:
    analytic_story:
        - Credential Dumping
        - Windows Persistence Techniques
        - Windows Privilege Escalation
        - Malicious PowerShell
        - Active Directory Privilege Escalation
    asset_type: Endpoint
    mitre_attack_id:
        - T1003
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1003/snapattack/snapattack.log
          source: XmlWinEventLog:Security
          sourcetype: XmlWinEventLog
