name: Linux Auditd Copy Fail Privilege Escalation
id: dd16294f-44d2-40b4-a869-542c0b85113a
version: 1
date: '2026-05-03'
author: Raven Tait, Splunk
status: production
type: TTP
description: Detects the exploitation pattern associated with Copy Fail. Copy Fail (CVE-2026-31431) is a logic bug in the Linux kernel's authencesn cryptographic template. It lets an unprivileged local user trigger a deterministic, controlled 4-byte write into the page cache of any readable file on the system. A single 732-byte Python script can edit a setuid binary and obtain root on essentially all Linux distributions shipped since 2017.
data_source:
    - Linux Auditd Syscall
search: '`linux_auditd` type=SYSCALL | eval indicator=case( key="af_alg",                              "AF_ALG socket", key="splice_user",                         "splice syscall", a0="su",                                   "su_exec", a2="su",                                   "su_exec", name="/usr/bin/su",                        "su_exec", exe="/usr/bin/su",                         "su_exec", true(),                                    null() ) | where isnotnull(indicator) | stats dc(indicator) as unique_signals, values(indicator) as signals, values(host) as dest, min(_time) as firstTime, values(uid) as uid, values(exe) as exe, values(ppid) as ppid, values(pid) as pid, values(comm) as comm by auid | where unique_signals >= 3 | eval risk_score = unique_signals * 25 | sort - risk_score | `security_content_ctime(firstTime)` | `linux_auditd_copy_fail_privilege_escalation_filter`'
how_to_implement: To implement this detection, the process begins by ingesting auditd data, that consist SYSCALL, TYPE, EXECVE and PROCTITLE events, which captures command-line executions and process details on Unix/Linux systems. These logs should be ingested and processed using Splunk Add-on for Unix and Linux (https://splunkbase.splunk.com/app/833), which is essential for correctly parsing and categorizing the data. Ensure specifically that AF_ALG socket creation and splice syscall is being monitored. The next step involves normalizing the field names  to match the field names set by the Splunk Common Information Model (CIM) to ensure consistency across different data sources and enhance the efficiency of data modeling and make sure the type=CWD record type is activate in your auditd configuration. This approach enables effective monitoring and detection of linux endpoints where auditd is deployed.
known_false_positives: No known false positives.
references:
    - https://xint.io/blog/copy-fail-linux-distributions
    - https://github.com/theori-io/copy-fail-CVE-2026-31431
    - https://github.com/Neo23x0/auditd/blob/master/audit.rules
drilldown_searches:
    - name: View the detection results for - "$dest$"
      search: '%original_detection_search% | search  dest = "$dest$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
rba:
    message: Privilege escalation via Copy Fail was executed on $dest$.
    risk_objects:
        - field: dest
          type: system
          score: 50
    threat_objects:
        - field: exe
          type: process
tags:
    analytic_story:
        - Linux Privilege Escalation
    asset_type: Endpoint
    mitre_attack_id:
        - T1068
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
    cve:
        - CVE-2026-31431
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1068/linux_auditd_copy_fail/linux_auditd.log
          source: auditd
          sourcetype: auditd
