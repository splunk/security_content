name: Windows Seatbelt Tool Execution
id: 43f4e64d-0846-4756-a869-ea38ee1334e6
version: 1
date: '2026-04-13'
author: Raven Tait, Splunk
status: production
type: Anomaly
description: 'Detects the execution of the enumeration tool Seatbelt via PE information and command line parameters. Seatbelt is an open-source C# security tool designed to assist in post-exploitation activities and the assessment of Windows systems. Seatbelt is specifically focused on gathering a wide range of information about the target system and its configuration. The tool performs a series of checks and collects data related to various aspects of the Windows operating system.

'
data_source:
    - Sysmon EventID 1
search: '`sysmon` EventID=1 Image="Seatbelt.exe" OR OriginalFileName="Seatbelt.exe" OR Description="*Seatbelt*" CommandLine="*-group=*" | fillnull | stats count by Computer, Image, OriginalFileName, Description, CommandLine, action, original_file_name, parent_process, parent_process_exec, parent_process_guid, parent_process_id, parent_process_name, parent_process_path, process_hash, process_integrity_level, user, user_id, vendor_product | rename Computer as dest|`security_content_ctime(firstTime)`| `security_content_ctime(lastTime)` | `windows_seatbelt_tool_execution_filter`'
how_to_implement: The detection is based on data that originates from Endpoint Detection and Response (EDR) agents. These agents are designed to provide security-related telemetry from the endpoints where the agent is installed. To implement this search, you must ingest logs that contain the process GUID, process name, and parent process. Additionally, you must ingest complete command-line executions. These logs must be processed using the appropriate Splunk Technology Add-ons that are specific to the EDR product. The logs must also be mapped to the `Processes` node of the `Endpoint` data model. Use the Splunk Common Information Model (CIM) to normalize the field names and speed up the data modeling process.
known_false_positives: Legitimate security assessments or internal IT audits may use Seatbelt for system enumeration. Filter alerts for approved security or administrative usage to reduce false positives.
references:
    - https://github.com/GhostPack/Seatbelt
drilldown_searches:
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View the detection results for - "$user$" and "$dest$"
      search: '%original_detection_search% | search  user = "$user$" dest = "$dest$"'
    - earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
      name: View risk events for the last 7 days for - "$user$" and "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$", "$dest$") starthoursago=168  | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
rba:
    message: Potential Seatbelt Tool Execution activity observed on $dest$ via $process$.
    risk_objects:
        - field: dest
          type: system
          score: 20
    threat_objects: []
tags:
    analytic_story:
        - Windows Post-Exploitation
        - Compromised Windows Host
        - Windows Privilege Escalation
    asset_type: Endpoint
    mitre_attack_id:
        - T1526
        - T1087
        - T1083
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1526/snapattack/snapattack.log
          source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
          sourcetype: XmlWinEventLog
