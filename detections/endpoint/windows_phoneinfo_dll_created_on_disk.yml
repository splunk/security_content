name: Windows Phoneinfo.dll Created on Disk
id: 34cb2dfb-1dec-4b6b-bc72-c3904e5e4521
version: 1
creation_date: '2026-08-17'
modification_date: '2026-08-17'
author: Onur Mustafa Erdogan, Splunk
status: production
type: TTP
description: |-
    The following analytic detects the creation of a file named phoneinfo.dll anywhere on disk. phoneinfo.dll
    is not a component shipped with Windows. It is a known phantom-DLL hijack target that is unconditionally
    loaded by wermgr.exe (Windows Error Reporting) when present on the search path. In the ShieldBreak exploit,
    a symbolic link race redirects a privileged, Defender-driven write into C:\Windows\System32\phoneinfo.dll,
    planting the payload that wermgr.exe subsequently loads at SYSTEM integrity. If confirmed malicious, this
    activity indicates an imminent or successful local privilege escalation attempt and the host should be
    isolated pending investigation.
data_source:
    - Sysmon EventID 11
search: |-
    | tstats `security_content_summariesonly`
      count min(_time) as firstTime max(_time) as lastTime
    from datamodel=Endpoint.Filesystem where
    Filesystem.action="created"
    Filesystem.file_name="phoneinfo.dll"
    by Filesystem.action Filesystem.dest Filesystem.file_access_time Filesystem.file_create_time
       Filesystem.file_hash Filesystem.file_modify_time Filesystem.file_name Filesystem.file_path
       Filesystem.file_acl Filesystem.file_size Filesystem.process_guid Filesystem.process_id
       Filesystem.user Filesystem.vendor_product
    | `drop_dm_object_name(Filesystem)`
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `windows_phoneinfo_dll_created_on_disk_filter`
how_to_implement: |-
    The detection is based on file system activities. To implement this search, you must capture file creation events covering DLL extension specifically.
known_false_positives: |-
    No false positives have been identified at this time. phoneinfo.dll is not a component shipped with Windows or any known legitimate application.
references:
    - https://www.cyderes.com/howler-cell/rogueplanet-windows-zero-day
    - https://www.threatlocker.com/blog/nightmareeclipse-releases-new-poc-shieldbreak-exploits-same-weakness-as-rogueplanet
    - https://www.hexacorn.com/blog/2016/06/02/beyond-good-ol-run-key-part-40/
drilldown_searches:
    - name: View the detection results for - "$dest$"
      search: '%original_detection_search% | search  dest = "$dest$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$dest$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$dest$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
finding:
    title: A file named phoneinfo.dll was created at $file_path$ on $dest$
    entity:
        field: dest
        type: system
        score: 80
analytic_story:
    - RoguePlanet
    - Windows Privilege Escalation
asset_type: Endpoint
mitre_attack_id:
    - T1068
    - T1574.001
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: endpoint
security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/refs/heads/master/datasets/emerging_threats/ShieldBreak/phoneinfo_dll_created.log
          source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
          sourcetype: XmlWinEventLog
      test_type: unit
