name: AWS Create Policy Version to allow all resources
id: 2a9b80d3-6340-4345-b5ad-212bf3d0dac4
version: 15
creation_date: '2021-02-22'
modification_date: '2026-11-24'
author: Bhavin Patel, Splunk
status: production
type: TTP
description: >-
    The following analytic identifies the creation of a new AWS IAM policy
    version containing an Allow statement specifying all actions and all
    resources. It detects this activity by analyzing AWS CloudTrail logs
    for successful CreatePolicyVersion events and checking Effect="Allow",
    Action="*", and Resource="*" within the same policy statement. This
    behavior is significant because it may violate the principle of least
    privilege, potentially exposing the environment to misuse or abuse.
    Creating the version alone does not establish that it became the default,
    that the policy was attached, or that the caller gained its permissions.
data_source:
    - AWS CloudTrail CreatePolicyVersion
search: |-
    `cloudtrail` eventName=CreatePolicyVersion eventSource=iam.amazonaws.com errorCode=success
    | spath input=requestParameters.policyDocument output=matching_statement path=Statement{}
    | mvexpand matching_statement
    | spath input=matching_statement output=statement_effect path=Effect
    | where statement_effect="Allow"
    | spath input=matching_statement output=statement_action path=Action
    | spath input=matching_statement output=statement_resource path=Resource
    | spath input=matching_statement output=action_array_values path=Action{}
    | spath input=matching_statement output=resource_array_values path=Resource{}
    | eval action_values=coalesce(action_array_values, statement_action),
        resource_values=coalesce(resource_array_values, statement_resource)
    | where isnotnull(mvfind(action_values, "^\*$"))
        AND isnotnull(mvfind(resource_values, "^\*$"))
    | eval user=coalesce(user_name, 'userIdentity.userName', 'userIdentity.arn', 'userIdentity.principalId'),
        src=coalesce(src, sourceIPAddress),
        user_agent=coalesce(user_agent, userAgent),
        policy_arn='requestParameters.policyArn',
        version_id='responseElements.policyVersion.versionId',
        set_as_default='requestParameters.setAsDefault',
        returned_is_default='responseElements.policyVersion.isDefaultVersion',
        event_id=eventID,
        event_time=eventTime
    | stats count AS matching_row_count
            dc(event_id) AS distinct_event_count
            min(_time) AS firstTime
            max(_time) AS lastTime
            values(event_id) AS event_id
            values(event_time) AS event_time
            values(policy_arn) AS policy_arn
            values(version_id) AS version_id
            values(set_as_default) AS set_as_default
            values(returned_is_default) AS returned_is_default
            values(matching_statement) AS matching_statement
        BY signature dest user
           user_agent src vendor_account
           vendor_region vendor_product
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `aws_create_policy_version_to_allow_all_resources_filter`
how_to_implement: You must install splunk AWS add on and Splunk App for AWS. This search works with AWS CloudTrail logs.
known_false_positives: >-
    Administrators may legitimately create policy versions containing wildcard
    Allow statements. Matching versions may be non-default, unattached, or
    constrained by conditions and other authorization controls.
references:
    - https://bishopfox.com/blog/privilege-escalation-in-aws
    - https://rhinosecuritylabs.com/aws/aws-privilege-escalation-methods-mitigation-part-2/
drilldown_searches:
    - name: View the detection results for - "$user$"
      search: '%original_detection_search% | search  user = "$user$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View risk events for the last 7 days for - "$user$"
      search: '| from datamodel:"Risk.All_Risk"| search normalized_risk_object IN ("$user$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
finding:
    title: User $user$ created version $version_id$ of policy $policy_arn$ with an Allow statement specifying all actions and all resources.
    entity:
        field: user
        type: user
        score: 50
analytic_story:
    - AWS IAM Privilege Escalation
asset_type: AWS Account
mitre_attack_id:
    - T1078.004
product:
    - Splunk Enterprise
    - Splunk Enterprise Security
    - Splunk Cloud
category: cloud
security_domain: network
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1078/aws_create_policy_version/aws_cloudtrail_events.json
          sourcetype: aws:cloudtrail
          source: aws_cloudtrail
      test_type: unit
