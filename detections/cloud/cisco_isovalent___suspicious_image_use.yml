name: Cisco Isovalent - Suspicious Image Use
id: 9f2b7b1d-6c2f-4f2d-9a8b-8a1d7c5f2e11
version: 1
date: '2025-08-21'
author: Bhavin Patel, Splunk
status: production
type: Anomaly
description: |
  The following analytic detects use of container images that fall outside an approved
  allowlist, leveraging Cisco Isovalent/Tetragon runtime telemetry (image name and
  workload identity). Adversaries commonly introduce untrusted or newly published
  images to deploy tooling, establish persistence, or abuse supply‑chain trust. This
  behavior may indicate image pulls from unauthorized registries, execution of
  unvetted software, or a drift from established deployment baselines. Extra scrutiny
  is warranted for namespaces and workloads that normally source images from restricted
  registries, and for pods that suddenly begin running images outside expected
  prefixes.

  Maintain an environment‑specific allowlist via the macro `cisco_isovalent_allowed_images`
  (for example, allow trusted registries/prefixes such as ImageName="gcr.io/org/*",
  "registry.local/*", or "myco/*") and keep it updated as new baseline images are
  introduced. This analytic alerts on images NOT matching the allowlist.
data_source:
- Cisco Isovalent Process Exec
search: |
  `cisco_isovalent_process_exec` process_exec.process.pod.name!=""
  | rename process_exec.process.pod.container.image.name as ImageName
  | rename process_exec.process.pod.namespace as Namespace
  | rename process_exec.process.pod.name as pod_name
  | search NOT `cisco_isovalent_allowed_images`
  | stats count min(_time) as firstTime max(_time) as lastTime by ImageName Namespace pod_name process_name cluster_name
  | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)`
  | `cisco_isovalent___suspicious_image_use_filter`
how_to_implement: |
  Ensure Cisco Isovalent/Tetragon process execution logs are ingested and mapped to the
  `cisco_isovalent` macro. Create and maintain an environment‑specific macro named
  `cisco_isovalent_allowed_images` that returns true for approved images, for example:
  (ImageName="gcr.io/org/app:*" OR ImageName="registry.local/*" OR ImageName="myco/*").
  The search alerts on images NOT matching that allowlist. Tune by namespace or team as needed.
known_false_positives: |
  New legitimate images during rollouts or blue/green deployments may appear until the allowlist
  is updated. Coordinate with platform/DevOps teams to synchronize allowlist changes.
references:
- https://tetragon.io
- https://isovalent.com
drilldown_searches:
- name: View the detection results for - "$pod_name$"
  search: '%original_detection_search% | search user = "$pod_name$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$pod_name$"
  search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$pod_name$")
    starthoursago=168  | stats count min(_time) as firstTime max(_time) as lastTime
    values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories)
    as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic)
    as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
rba:
  message: Suspicious (non‑allowlisted) image $ImageName$ used by pod $pod_name$ in namespace $Namespace$ in the cluster $cluster_name$
  risk_objects:
  - field: pod_name
    type: system
    score: 45
  threat_objects: []
tags:
  analytic_story:
  - Cisco Isovalent Suspicious Activity
  asset_type: Kubernetes
  mitre_attack_id:
  - T1526
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: network
tests:
- name: True Positive Test
  attack_data:
  - data: https://media.githubusercontent.com/media/splunk/attack_data/refs/heads/master/datasets/cisco_isovalent/cisco_isovalent_process_exec/cisco_isovalent_process_exec.log
    sourcetype: cisco:isovalent
    source: cisco_isovalent

