name: Cisco Isovalent - Detect Shell Execution
id: 12345678-abcd-1234-ef00-1234567890ab
version: 1
date: '2025-08-12'
author: Bhavin Patel, Splunk
type: Anomaly
data_source:
- Cisco Isovalent Process Exec
status: production
description: The following analytic detects the execution of a shell inside a container namespace within the Cisco Isovalent environment. It identifies this activity by monitoring process execution logs for the execution of a shell (sh or bash) inside a container namespace. This behavior is significant for a SOC as it could allow an attacker to gain shell access to the container, potentially leading to further compromise of the Kubernetes cluster. If confirmed malicious, this activity could lead to data theft, service disruption, privilege escalation, lateral movement, and further attacks, severely compromising the cluster's security and integrity.
search: |
  `cisco_isovalent_process_exec` process_exec.process.pod.name!=""
  (process_exec.process.binary="*/bin/sh" OR process_exec.process.binary="*/bin/bash")
  | rename process_exec.process.pod.namespace as WorkloadNamespace 
  | rename process_exec.process.pod.labels{} as WorkloadLabels
  | rename process_exec.ancestors{}.binary as WorkloadAncestorsBinary
  | eval WorkloadAncestorsBinary=mvjoin(WorkloadAncestorsBinary, " <- ")
  | eval WorkloadLabels=mvjoin(WorkloadLabels, "; ") 
  | stats count by WorkloadNamespace, process_exec.process.binary, process_exec.parent.binary, WorkloadAncestorsBinary | `cisco_isovalent___detect_shell_execution_filter`
how_to_implement: The detection is based on data that originates from Cisco Isovalent. Ensure that logging is enabled in your environment where Cisco Isovalent is installed. These logs provide a record of the process execution events, which is crucial for monitoring and detecting suspicious activities. Use the Cisco Security Cloud App to collect the logs.
known_false_positives: Shell scripts executed by legitimate users or automated processes.
references:
- https://www.sysdig.com/blog/mitre-attck-framework-for-container-runtime-security-with-sysdig-falco
drilldown_searches:
- name: View the detection results for - "$user$"
  search: '%original_detection_search% | search user = "$user$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$user$"
  search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$")
    starthoursago=168  | stats count min(_time) as firstTime max(_time) as lastTime
    values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories)
    as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic)
    as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
rba:
  message: A shell execution has been detected by user on container pod namespace $WorkloadNamespace$
  risk_objects:
  - field: WorkloadNamespace
    type: system
    score: 49
  threat_objects: []
tags:
  analytic_story:
  - Cisco Isovalent Suspicious Activity
  asset_type: Endpoint
  mitre_attack_id:
  - T1059
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: endpoint
tests:
  - name: True Positive Test
    attack_data:
    - data:  https://media.githubusercontent.com/media/splunk/attack_data/refs/heads/master/datasets/cisco_isovalent/cisco_isovalent.log
      source: not_applicable
      sourcetype: cisco:isovalent:processExec
