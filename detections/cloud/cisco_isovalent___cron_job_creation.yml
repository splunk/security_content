name: Cisco Isovalent - Cron Job Creation
id: 94531a31-a041-4777-909f-cd92ed3b71ad
version: 1
date: '2025-08-12'
author: Bhavin Patel, Splunk
type: Anomaly
data_source:
- Cisco Isovalent Process Exec
status: production
description: The following analytic detects the creation of a cron job within the Cisco Isovalent environment. It identifies this activity by monitoring process execution logs for cron job creation events. This behavior is significant for a SOC as it could allow an attacker to execute malicious tasks repeatedly and automatically, posing a threat to the Kubernetes infrastructure. If confirmed malicious, this activity could lead to persistent attacks, service disruptions, or unauthorized access to sensitive information.
search: |
  `cisco_isovalent_process_exec` process_exec.process.pod.name!="" process_name IN ("*/crond","*/cron","*/crontab")
    OR process_exec.process.arguments="*-l*" OR process_exec.process.arguments="*-e*" 
  | stats count min(_time) as firstTime max(_time) as lastTime values(process_exec.process.arguments) as process
      by process_exec.process.pod.name  process_exec.process.pod.container.image.name
  parent_process_name process_name cluster_name 
  | rename process_exec.process.pod.name as pod_name | rename process_exec.process.pod.container.image.name
  as process_image_name
  | `security_content_ctime(firstTime)` 
  | `security_content_ctime(lastTime)`
  | `cisco_isovalent___cron_job_creation_filter`
how_to_implement: The detection is based on data that originates from Cisco Isovalent. Ensure that logging is enabled in your environment where Cisco Isovalent is installed. These logs provide a record of the process execution events, which is crucial for monitoring and detecting suspicious activities. Use the Cisco Security Cloud App to collect the logs.
known_false_positives: unknown
references:
- https://isovalent.com
- https://tetragon.io
drilldown_searches:
- name: View the detection results for - "$pod_name$"
  search: '%original_detection_search% | search user = "$pod_name$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$pod_name$"
  search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$pod_name$")
    starthoursago=168  | stats count min(_time) as firstTime max(_time) as lastTime
    values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories)
    as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic)
    as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
rba:
  message: cron job creation detected in pod $pod_name$ in the cluster $cluster_name$
  risk_objects:
  - field: pod_name
    type: system
    score: 50
  threat_objects: []
tags:
  analytic_story:
  - Cisco Isovalent Suspicious Activity
  asset_type: Kubernetes
  mitre_attack_id:
  - T1053.007
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: network
tests:
- name: True Positive Test
  attack_data:
  - data: https://media.githubusercontent.com/media/splunk/attack_data/refs/heads/master/datasets/cisco_isovalent/cisco_isovalent_process_exec/cisco_isovalent_process_exec.log
    source: not_applicable
    sourcetype: cisco:isovalent:processExec
