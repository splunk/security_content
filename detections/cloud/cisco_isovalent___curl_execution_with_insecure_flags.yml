name: Cisco Isovalent - Curl Execution With Insecure Flags
id: c16c4899-d3f7-461b-92c2-cc0ef5758855
version: 1
date: '2025-08-12'
author: Bhavin Patel, Splunk
type: Anomaly
data_source:
- Cisco Isovalent Process Exec
status: production
description: The following analytic detects the execution of curl commands with insecure flags within the Cisco Isovalent environment. It identifies this activity by monitoring process execution logs for curl commands that use the -k or --insecure flags. This behavior is significant for a SOC as it could allow an attacker to bypass SSL/TLS verification, potentially exposing the Kubernetes infrastructure to man-in-the-middle attacks. If confirmed malicious, this activity could lead to data interception, service disruptions, or unauthorized access to sensitive  information.
search: |
  `cisco_isovalent_process_exec` process_exec.process.pod.name!="" (process_name="*curl") 
  | regex process="(?i)(?<!\w)-(?:[a-z]*k[a-z]*|-(insecure|proxy-insecure|doh-insecure))"
  | stats count min(_time) as firstTime max(_time) as lastTime values(process_exec.process.arguments) as process
      by process_exec.process.pod.name 
      parent_process_name process_name cluster_name process_exec.process.pod.container.name
  | rename process_exec.process.pod.name as pod_name | rename process_exec.process.pod.container.image.name
      as process_image_name 
  | `security_content_ctime(firstTime)`
  | `security_content_ctime(lastTime)`
  | `cisco_isovalent___curl_execution_with_insecure_flags_filter`
how_to_implement: The detection is based on data that originates from Cisco Isovalent. Ensure that logging is enabled in your environment where Cisco Isovalent is installed. These logs provide a record of the process execution events, which is crucial for monitoring and detecting suspicious activities. Use the Cisco Security Cloud App to collect the logs.
known_false_positives: Legitimate use of curl with insecure flags for testing purposes.
references:
- https://isovalent.com
- https://tetragon.io
drilldown_searches:
- name: View the detection results for - "$pod_name$"
  search: '%original_detection_search% | search pod_name = "$pod_name$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$pod_name$"
  search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$pod_name$")
    starthoursago=168  | stats count min(_time) as firstTime max(_time) as lastTime
    values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories)
    as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic)
    as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
rba:
  message: A curl execution with insecure flags has been detected on pod_name $pod_name$ in the cluster $cluster_name$
  risk_objects:
  - field: pod_name
    type: system
    score: 45
  threat_objects: []
tags:
  analytic_story:
  - Cisco Isovalent Suspicious Activity
  asset_type: Endpoint
  mitre_attack_id:
  - T1071
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: endpoint
tests:
  - name: True Positive Test
    attack_data:
    - data: https://media.githubusercontent.com/media/splunk/attack_data/refs/heads/master/datasets/cisco_isovalent/cisco_isovalent.log
      source: not_applicable
      sourcetype: cisco:isovalent:processExec
