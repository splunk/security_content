name: AWS Anomalous Secrets Manager Batch Retrieval
id: 93646bda-291b-4a59-a926-19f08e26f7cd
version: 1
creation_date: '2026-09-29'
modification_date: '2026-09-29'
author: Maria Jose Erquiaga, Splunk
status: production
type: TTP
description: The following analytic identifies a successful AWS Secrets Manager BatchGetSecretValue request made by a principal that has not successfully used this API during the preceding seven days. It evaluates the latest hour of activity against a seven-day baseline for each AWS principal. BatchGetSecretValue permits multiple secret values to be retrieved in one API request. An attacker with access to a compromised AWS identity may use this operation to collect application credentials, API tokens, database passwords, and other sensitive information while generating fewer CloudTrail events than repeated GetSecretValue calls. This activity is particularly significant when the principal does not normally perform batch secret retrieval.
data_source:
    - AWS CloudTrail BatchGetSecretValue
search: |-
    `cloudtrail` earliest=-169h latest=now eventName="BatchGetSecretValue" eventSource="secretsmanager.amazonaws.com"
    | spath input=_raw path=userIdentity.userName output=iam_user
    | spath input=_raw path=userIdentity.sessionContext.sessionIssuer.userName output=role_name
    | spath input=_raw path=userIdentity.sessionContext.sessionIssuer.arn output=issuer_arn
    | spath input=_raw path=userIdentity.arn output=identity_arn
    | spath input=_raw path=userIdentity.principalId output=principal_id
    | spath input=_raw path=recipientAccountId output=vendor_account
    | spath input=_raw path=sourceIPAddress output=src
    | spath input=_raw path=userAgent output=user_agent
    | spath input=_raw path=awsRegion output=vendor_region
    | spath input=_raw path=errorCode output=error_code
    | eval user=coalesce(issuer_arn, identity_arn, principal_id, iam_user, role_name, "unknown")
    | where (isnull(error_code) OR error_code="") AND user!="unknown"
    | eval evaluation_start=relative_time(now(), "-1h")
    | eval period=if(_time>=evaluation_start, "current", "baseline")
    | stats count(eval(period="current")) as batch_request_count
        count(eval(period="baseline")) as prior_batch_request_count
        values(eval(if(period="current", src, null()))) as src
        values(eval(if(period="current", user_agent, null()))) as user_agent
        values(eval(if(period="current", vendor_account, null()))) as vendor_account
        values(eval(if(period="current", vendor_region, null()))) as vendor_region
        earliest(eval(if(period="current", _time, null()))) as firstTime
        latest(eval(if(period="current", _time, null()))) as lastTime
        by user
    | where batch_request_count>0 AND prior_batch_request_count=0
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `aws_anomalous_secrets_manager_batch_retrieval_filter`
how_to_implement: This detection requires the Splunk Add-on for Amazon Web Services and AWS CloudTrail events from AWS Secrets Manager. Schedule the search to run hourly. The search covers 169 hours, consisting of a one-hour evaluation window and the preceding 168-hour baseline. CloudTrail delivery latency must be considered when configuring the scheduled search. If CloudTrail events are regularly delayed, configure the schedule or evaluation window to allow sufficient ingestion time. The principal is derived from the session issuer ARN for assumed roles, the identity ARN for IAM users, and other identity attributes as fallbacks. The detection filter macro can be used to exclude authorized roles, applications, secret-rotation services, and deployment workflows.
known_false_positives: Legitimate administrators, deployment systems, credential-rotation services, incident-response tooling, or newly deployed applications may use BatchGetSecretValue for the first time. A principal may trigger the detection again when it has not used the API during the preceding seven days. Review the principal, source IP address, user agent, account, region, requested secret identifiers, and surrounding CloudTrail activity to determine whether the request was authorized.
references:
    - https://attack.mitre.org/techniques/T1555/006/
    - https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_BatchGetSecretValue.html
    - https://docs.aws.amazon.com/secretsmanager/latest/userguide/cloudtrail_log_entries.html
    - https://www.elastic.co/guide/en/security/8.19/aws-secrets-manager-rapid-secrets-retrieval.html
drilldown_searches:
    - name: View the detection results for - "$user$"
      search: '%original_detection_search% | search user="$user$"'
      earliest_offset: $info_min_time$
      latest_offset: $info_max_time$
    - name: View successful Secrets Manager activity for the last 7 days for - "$user$"
      search: '`cloudtrail` eventSource="secretsmanager.amazonaws.com" | spath input=_raw path=userIdentity.userName output=iam_user | spath input=_raw path=userIdentity.sessionContext.sessionIssuer.userName output=role_name | spath input=_raw path=userIdentity.sessionContext.sessionIssuer.arn output=issuer_arn | spath input=_raw path=userIdentity.arn output=identity_arn | spath input=_raw path=userIdentity.principalId output=principal_id | spath input=_raw path=errorCode output=error_code | eval user=coalesce(issuer_arn, identity_arn, principal_id, iam_user, role_name, "unknown") | where (isnull(error_code) OR error_code="") AND user="$user$" | table _time user eventName sourceIPAddress userAgent awsRegion requestParameters'
      earliest_offset: 7d
      latest_offset: "0"
    - name: View risk events for the last 7 days for - "$user$"
      search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$user$") | stats count min(_time) as firstTime max(_time) as lastTime values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories) as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic) as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`'
      earliest_offset: 7d
      latest_offset: "0"
intermediate_findings:
    entities:
        - field: user
          type: user
          score: 40
          message: User $user$ made $batch_request_count$ successful AWS Secrets Manager BatchGetSecretValue requests after no successful use of this API during the preceding seven days.
threat_objects:
    - field: src
      type: ip_address
analytic_story:
    - AWS Identity and Access Management Account Takeover
asset_type: AWS Account
mitre_attack_id:
    - T1555.006
product:
    - Splunk Cloud
    - Splunk Enterprise
    - Splunk Enterprise Security
category: cloud
security_domain: threat
tests:
    - name: True Positive Test
      attack_data:
        - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1555.006/aws_anomalous_secrets_manager_batch_retrieval/aws_anomalous_secrets_manager_batch_retrieval.json
          source: aws_cloudtrail
          sourcetype: aws:cloudtrail
      test_type: unit
