name: Cisco Isovalent - Detect Late Process Execution
id: 7f4b9b8e-5d6a-4a21-9e3f-0f1e8f2d1c3a
version: 1
date: '2025-08-21'
author: Bhavin Patel, Splunk
type: Anomaly
data_source:
- Cisco Isovalent Process Exec
status: production
description: |
  Detects process executions that occur well after a container has initialized, which can indicate
  suspicious activity (e.g., interactive shells, injected binaries, or post-compromise tooling).
  The analytic compares the process start time to the container start time and flags processes
  launched more than 5 minutes (300 seconds) after initialization.
search: |
  `cisco_isovalent_process_exec` process_name="/bin/sh"
  | rename process_exec.process.pod.container.name as pod_name 
  | rename process_exec.process.start_time as ProcessStartTime 
  | rename process_exec.process.pod.container.start_time as ContainerStartTime 
  | eval ProcessStartTime=strptime(ProcessStartTime, "%Y-%m-%dT%H:%M:%S.%3Q")
  | eval ContainerStartTime=strptime(ContainerStartTime, "%Y-%m-%dT%H:%M:%S.%9Q")
  | eval ContainerTime5min=relative_time(ContainerStartTime, "+1m")
  | where ProcessStartTime > ContainerTime5min
  | table pod_name, process_name, ProcessStartTime, ContainerTime5min | `security_content_ctime(ProcessStartTime)`
    | `security_content_ctime(ContainerTime5min)`
  | `cisco_isovalent___detect_late_process_execution_filter`
how_to_implement: |
  how_to_implement: The detection is based on data that originates from Cisco Isovalent. Ensure that logging is enabled in your environment where Cisco Isovalent is installed. These logs provide a record of the process execution events, which is crucial for monitoring and detecting suspicious activities. Use the Cisco Security Cloud App to collect the logs. Tune the 300-second threshold to your environment
  and consider allowlisting known late-start maintenance or backup jobs.
known_false_positives: |
  Legitimate scheduled tasks (cron jobs), health probes, or maintenance tooling may start well after
  container initialization. Baseline common late-start processes and suppress as needed.
references:
- https://docs.isovalent.com/user-guide/sec-ops-visibility/process-execution/index.html
drilldown_searches:
- name: View the detection results for pod - "$pod_name$"
  search: '%original_detection_search% | search pod_name = "$pod_name$"'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for - "$pod_name$"
  search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ("$pod_name$")
    starthoursago=168  | stats count min(_time) as firstTime max(_time) as lastTime
    values(search_name) as "Search Name" values(risk_message) as "Risk Message" values(analyticstories)
    as "Analytic Stories" values(annotations._all) as "Annotations" values(annotations.mitre_attack.mitre_tactic)
    as "ATT&CK Tactics" by normalized_risk_object | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
rba:
  message: Late process execution ($process_name$) detected in pod $pod_name$
  risk_objects:
  - field: pod_name
    type: system
    score: 45
  threat_objects: []
tags:
  analytic_story:
  - Cisco Isovalent Suspicious Activity
  asset_type: Endpoint
  mitre_attack_id:
  - T1059
  product:
  - Splunk Enterprise
  - Splunk Enterprise Security
  - Splunk Cloud
  security_domain: endpoint
tests:
- name: True Positive Test
  attack_data:
  - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/cisco_isovalent/cisco_isovalent_process_exec_delayed_shell.log
    source: not_applicable
    sourcetype: cisco:isovalent:processExec