name: Splunk Image File Disclosure via PDF Export in Classic Dashboard
id: 7464e2dc-98a5-4af9-87a1-fa6d5a256fa6
version: 5
creation_date: '2024-10-14'
modification_date: '2026-05-14'
author: Rod Soto
data_source:
    - Splunk
type: Hunting
status: removed
description: In Splunk Enterprise versions 9.3.0, 9.2.3, and 9.1.6, a low-privileged user that does not hold the “admin” or “power” Splunk roles could view images on the host machine using the PDF export feature in Splunk classic dashboards.
search: |-
    ```Search for any PDFs that have been generated```
    index=_internal sourcetype=splunk_pdfgen "Generated pdf" 
    ```Extract a potential Dashboard Filename```
    | rex field=filename "(?<title>.*)-[0-9]{4}-[0-9]{1,2}-[0-9]{1,2}.pdf" 
    ```Join this with all dashboards. Potentially vulnerable dashbaords MUST be classic (version 1.1) AND contain at least one <img...> tag```
    | join type=inner title 
        [| rest /servicesNS/-/-/data/ui/views 
        | search eai:data="*<img*" version="1.1"] 
    | stats count min(_time) as earliestTime max(_time) as latestTime by author eai:acl.app label title eai:data
    | `security_content_ctime(earliestTime)`
    | `security_content_ctime(latestTime)`
    | `splunk_image_file_disclosure_via_pdf_export_in_classic_dashboard_filter`
how_to_implement: Need to access to REST API.
known_false_positives: This is a hunting search and operator must identify indicators of local host image source such as UNC paths ('C:\'', '//'') in order to identify potential exploitation of this vulnerability.
references:
    - https://advisory.splunk.com/advisories/SVD-2024-1004
tags:
    analytic_story:
        - Splunk Vulnerabilities
    asset_type: Splunk Server
    mitre_attack_id:
        - T1087
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
    cve:
        - CVE-2024-45734
    manual_test: This search uses a REST call against a running Splunk instance to fetch information about dashboards. It cannot be replicated with a normal test or attack data.
deprecation_info:
    reason: Detection is deprecated as the associated CVEs have been patched in the latest Splunk release.
    removed_in_version: 5.6.0
    replacement_content: []
