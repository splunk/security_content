name: Splunk Persistent XSS via Scheduled Views
id: d4f55f7c-6518-4122-a197-951fe0f21b25
version: 5
creation_date: '2024-10-14'
modification_date: '2026-05-14'
author: Rod Soto
data_source:
    - Splunk
type: Hunting
status: removed
description: In Splunk Enterprise versions below 9.2.3 and 9.1.6 and Splunk Cloud Platform versions below 9.1.2308.211, a low-privileged user that does not hold the “admin” or “power” Splunk roles could craft a malicious payload through Scheduled Views that could result in execution of unauthorized JavaScript code in the browser of a user.
search: |-
    `splunkd_ui` method=POST uri=*/scheduledview/search/update* 
    | stats  count earliest(_time) as firstTime  latest(_time) as lastTime values(bytes) AS bytes values(uri) AS uri values(useragent) AS user_agent by clientip user host
    | `security_content_ctime(firstTime)`
    | `security_content_ctime(lastTime)`
    | `splunk_persistent_xss_via_scheduled_views_filter`
how_to_implement: Requires access to REST API.
known_false_positives: This is a hunting search, it is not possible to detect XSS payload from the scheduled view, however it is possible to see who was sent the scheduled search in order to trigger potential XSS.
references:
    - https://advisory.splunk.com/advisories/SVD-2024-1010
tags:
    analytic_story:
        - Splunk Vulnerabilities
    asset_type: Splunk Server
    mitre_attack_id:
        - T1189
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: endpoint
    cve:
        - CVE-2024-45740
tests:
    - name: True Positive Test
      attack_data:
          - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1189/splunk/svd-2024-1010.log
            custom_index: _internal
            sourcetype: splunkd_ui_access
            source: /opt/splunk/var/log/splunk/splunkd_ui_access.log
deprecation_info:
    reason: Detection is deprecated as the associated CVEs have been patched in the latest Splunk release.
    removed_in_version: 5.6.0
    replacement_content: []
