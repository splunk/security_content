name: Cloud Network Access Control List Deleted
id: 021abc51-1862-41dd-ad43-43c739c0a983
version: 4
creation_date: '2021-01-12'
modification_date: '2026-05-13'
author: Peter Gael, Splunk
status: removed
type: Anomaly
description: Enforcing network-access controls is one of the defensive mechanisms used by cloud administrators to restrict access to a cloud instance. After the attacker has gained control of the console by compromising an admin account, they can delete a network ACL and gain access to the instance from anywhere. This search will query the Change datamodel to detect users deleting network ACLs. Deprecated because it's a duplicate
data_source: []
search: '`cloudtrail` eventName=DeleteNetworkAcl|rename userIdentity.arn as arn  | stats count min(_time) as firstTime max(_time) as lastTime values(errorMessage) values(errorCode) values(userAgent) values(userIdentity.*) by src userName arn eventName | `security_content_ctime(lastTime)` | `security_content_ctime(firstTime)` | `cloud_network_access_control_list_deleted_filter`'
how_to_implement: You must be ingesting your cloud infrastructure logs from your cloud provider. You can also provide additional filtering for this search by customizing the `cloud_network_access_control_list_deleted_filter` macro.
known_false_positives: It's possible that a user has legitimately deleted a network ACL.
references: []
rba:
    message: AWS Network ACL Deleted by $userName$
    risk_objects:
        - field: userName
          type: user
          score: 25
    threat_objects: []
tags:
    analytic_story:
        - AWS Network ACL Activity
    asset_type: Instance
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: network
deprecation_info:
    reason: Detections updated to use the new search logic and field names due to the TA update
    removed_in_version: 5.2.0
    replacement_content:
        - AWS Network Access Control List Deleted
