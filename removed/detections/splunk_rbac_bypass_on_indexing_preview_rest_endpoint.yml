name: Splunk RBAC Bypass On Indexing Preview REST Endpoint
id: bbe26f95-1655-471d-8abd-3d32fafa86f8
version: 6
creation_date: '2025-05-12'
modification_date: '2026-05-14'
author: Rod Soto
status: removed
type: Hunting
data_source:
    - Splunk
description: The following analytic identifies unauthorized attempts to use the /services/indexing/preview REST endpoint in Splunk. It detects POST requests to this endpoint by monitoring the _internal index for specific URI patterns. This activity is significant because it indicates a potential RBAC (Role-Based Access Control) bypass, allowing unauthorized users to overwrite search results if they know the search ID (SID) of an existing job. If confirmed malicious, this could lead to data manipulation, unauthorized access to sensitive information, and compromised integrity of search results.
search: '`splunkda` method="POST" uri="*/services/indexing/preview*" | table host clientip status useragent user uri_path | `splunk_rbac_bypass_on_indexing_preview_rest_endpoint_filter`'
how_to_implement: This search does not require additional data ingestion. It requires the ability to search _internal index.
known_false_positives: This is a hunting search which provides verbose results against this endpoint. Operator must consider things such as IP address, useragent and user(specially low privelege) and host to investigate possible attack.
references:
    - https://advisory.splunk.com/
tags:
    analytic_story:
        - Splunk Vulnerabilities
    asset_type: Endpoint
    mitre_attack_id:
        - T1134
    product:
        - Splunk Enterprise
    security_domain: endpoint
tests:
    - name: True Positive Test
      attack_data:
          - data: https://media.githubusercontent.com/media/splunk/attack_data/master/datasets/attack_techniques/T1134/splunk/splunk_rbac_bypass_on_indexing_preview_rest_endpoint.log
            source: splunkd_access.log
            sourcetype: splunkd_access
            custom_index: _internal
deprecation_info:
    reason: Detection is deprecated as the associated CVEs have been patched in the latest Splunk release.
    removed_in_version: 5.6.0
    replacement_content: []
