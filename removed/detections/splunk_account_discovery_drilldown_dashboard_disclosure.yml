name: Splunk Account Discovery Drilldown Dashboard Disclosure
id: f844c3f6-fd99-43a2-ba24-93e35fe84be6
version: 6
creation_date: '2025-05-12'
modification_date: '2026-05-14'
author: Marissa Bower, Rod Soto, Splunk
status: removed
type: TTP
description: The following analytic identifies the presence of environment variables in Splunk dashboard drilldown URLs. It uses the REST API to query dashboards for specific patterns in the XML data. This activity is significant because it can expose sensitive tokens from privileged users if an attacker shares a malicious dashboard. If confirmed malicious, this could allow an attacker to detokenize variables and potentially gain unauthorized access to sensitive information or escalate privileges within the Splunk environment.
data_source: []
search: '| rest splunk_server=local /servicesNS/-/-/data/ui/views | search eai:data="*$env:*" eai:data="*url*" eai:data="*options*" | rename author AS Author eai:acl.sharing AS Permissions eai:appName AS App eai:data AS "Dashboard XML" | fields Author Permissions App "Dashboard XML" | `splunk_account_discovery_drilldown_dashboard_disclosure_filter`'
how_to_implement: This search uses REST function to query for dashboards with environment variables present in URL options.
known_false_positives: This search may reveal non malicious URLs with environment variables used in organizations.
references:
    - https://www.splunk.com/en_us/product-security.html
rba:
    message: Potential exposure of environment variables from url embedded in dashboard
    risk_objects:
        - field: author
          type: user
          score: 40
    threat_objects: []
tags:
    analytic_story:
        - Splunk Vulnerabilities
    asset_type: Endpoint
    cve:
        - CVE-2022-37438
    mitre_attack_id:
        - T1087
    product:
        - Splunk Enterprise
        - Splunk Enterprise Security
        - Splunk Cloud
    security_domain: threat
deprecation_info:
    reason: Detection is deprecated as the associated CVEs have been patched in the latest Splunk release.
    removed_in_version: 5.6.0
    replacement_content: []
